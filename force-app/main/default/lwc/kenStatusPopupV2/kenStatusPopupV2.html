<template>
    <div class="overlay" onclick={handleOverlayClick}>
        <div class="toast" role="alert" aria-live="polite">
            <template lwc:if={dismissible}>
                <button type="button" class="toast__close" onclick={handleClose} aria-label="Dismiss">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#373A45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </template>

            <div class="toast__badge" aria-hidden="true">
                <svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
                    <path d="M48 4 L56 11 L66 8 L69 18 L79 20 L77 30 L86 36 L79 44 L86 52 L77 58 L79 68 L69 70 L66 80 L56 77 L48 84 L40 77 L30 80 L27 70 L17 68 L19 58 L10 52 L17 44 L10 36 L19 30 L17 20 L27 18 L30 8 L40 11 Z"
                          fill="#10B981"/>
                    <path d="M34 48 L44 58 L62 38"
                          stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                </svg>
            </div>

            <h2 class="toast__header">{header}</h2>
            <template lwc:if={showContent}>
                <p class="toast__content">{content}</p>
            </template>
        </div>
    </div>
</template>
