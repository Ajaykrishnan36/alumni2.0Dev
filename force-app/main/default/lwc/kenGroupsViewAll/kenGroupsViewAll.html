<template>
    <div class="va-container">

        <div class="va-topbar">
            <h2 class="va-title">{title}</h2>
            <div class="va-actions">
                <div class="search-box-wrap">
                    <span class="search-icon-wrap">
                        <lightning-icon icon-name="utility:search" size="x-small" class="search-icon"></lightning-icon>
                    </span>
                    <input type="search" placeholder="Search" class="search-input-inner" value={searchTerm} oninput={handleSearchInput} />
                </div>
                <div class="filter-wrap" data-filter-root="true" onclick={handleFilterWrapClick}>
                    <button type="button" class="filter-btn" onclick={handleToggleFilters}>
                        <span class="filter-btn-label">Filters</span>
                        <svg class="filter-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <path d="M9 15.75C9 15.5511 9.07902 15.3603 9.21967 15.2197C9.36032 15.079 9.55109 15 9.75 15H14.25C14.4489 15 14.6397 15.079 14.7803 15.2197C14.921 15.3603 15 15.5511 15 15.75C15 15.9489 14.921 16.1397 14.7803 16.2803C14.6397 16.421 14.4489 16.5 14.25 16.5H9.75C9.55109 16.5 9.36032 16.421 9.21967 16.2803C9.07902 16.1397 9 15.9489 9 15.75ZM6 11.25C6 11.0511 6.07902 10.8603 6.21967 10.7197C6.36032 10.579 6.55109 10.5 6.75 10.5H17.25C17.4489 10.5 17.6397 10.579 17.7803 10.7197C17.921 10.8603 18 11.0511 18 11.25C18 11.4489 17.921 11.6397 17.7803 11.7803C17.6397 11.921 17.4489 12 17.25 12H6.75C6.55109 12 6.36032 11.921 6.21967 11.7803C6.07902 11.6397 6 11.4489 6 11.25ZM3 6.75C3 6.55109 3.07902 6.36032 3.21967 6.21967C3.36032 6.07902 3.55109 6 3.75 6H20.25C20.4489 6 20.6397 6.07902 20.7803 6.21967C20.921 6.36032 21 6.55109 21 6.75C21 6.94891 20.921 7.13968 20.7803 7.28033C20.6397 7.42098 20.4489 7.5 20.25 7.5H3.75C3.55109 7.5 3.36032 7.42098 3.21967 7.28033C3.07902 7.13968 3 6.94891 3 6.75Z" fill="#373A45"/>
                        </svg>
                    </button>
                    <template if:true={hasActiveFilters}>
                        <span class="filter-count-badge">{filterCountLabel}</span>
                    </template>
                    <template if:true={showFilterPanel}>
                        <div class="filter-popover">
                            <h2 class="filter-popover-title">Filters</h2>
                            <div class="filter-popover-body">
                                <template if:true={isCreatedView}>
                                    <label class="filter-label">Status</label>
                                    <select class="filter-select" onchange={handleStatusFilter}>
                                        <option value="all"       selected={filterStatusAll}>All</option>
                                        <option value="Draft"     selected={filterStatusDraft}>Draft</option>
                                        <option value="In Review" selected={filterStatusInReview}>In Review</option>
                                        <option value="Approved"  selected={filterStatusApproved}>Approved</option>
                                        <option value="Rejected"  selected={filterStatusRejected}>Rejected</option>
                                    </select>
                                </template>
                                <label class="filter-label">Type</label>
                                <select class="filter-select" onchange={handleTypeFilter}>
                                    <option value="all"     selected={filterTypeAll}>All</option>
                                    <option value="private" selected={filterTypePrivate}>Private</option>
                                    <option value="public"  selected={filterTypePublic}>Public</option>
                                </select>
                                <template if:true={isDiscoverView}>
                                    <label class="filter-label">Owned By</label>
                                    <select class="filter-select" onchange={handleOwnershipFilter}>
                                        <option value="all"    selected={filterOwnerAll}>All</option>
                                        <option value="admin"  selected={filterOwnerAdmin}>Admin</option>
                                        <option value="alumni" selected={filterOwnerAlumni}>Alumni</option>
                                    </select>
                                </template>
                            </div>
                            <div class="filter-popover-actions">
                                <button type="button" class="filter-reset-btn" onclick={handleClearFilters}>Reset</button>
                                <button type="button" class="filter-apply-btn" onclick={handleApplyFilters}>Apply</button>
                            </div>
                        </div>
                    </template>
                </div>
                <template if:true={showCreatedCreate}>
                    <button type="button" class="btn-create-top" onclick={handleCreateGroup}>+ Create Group</button>
                </template>
            </div>
        </div>

        <template if:true={isLoading}>
            <div class="va-loading">
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </div>
        </template>

        <template if:false={isLoading}>
            <div class="va-content">
                <div class="va-grid">
                    <template for:each={filteredGroups} for:item="group">
                        <div key={group.id} class="va-card" data-group-id={group.id} onclick={handleGroupCardClick}>
                            <div class="va-card-image" style={group.cardStyle}>
                                <span class="va-badge">{group.groupType}</span>
                                <template if:true={group.isInReview}>
                                    <span class="va-badge va-badge-review">In Review</span>
                                </template>
                            </div>
                            <div class="va-card-info">
                                <h3>{group.name}</h3>
                                <p class="va-members">{group.members} members</p>
                                <div class="va-friends-info">
                                    <div class="va-avatars">
                                        <template for:each={group.friendsImages} for:item="img">
                                            <img key={img.key} src={img.url} alt="Friend avatar" class="va-avatar-sm" />
                                        </template>
                                    </div>
                                    <span>{group.friends}</span>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
                <template if:true={isEmpty}>
                    <div class="va-empty">
                        <p>No groups found.</p>
                    </div>
                </template>
            </div>
        </template>

    </div>
</template>
