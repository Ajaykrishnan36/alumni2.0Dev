<template>
    <c-ken42-alumni-shell-v2 active-nav="home">
    <div class="app">
        <!-- ==================== SIDEBAR ==================== -->
        <aside class="sidebar">
            <div class="user-card">
                <span class="user-card__avatar">{userInitial}</span>
                <p class="user-card__name">{userFullName}</p>
                <p class="user-card__batch">{userBatch}</p>
            </div>

            <nav class="nav">
                <template for:each={navItems} for:item="n">
                    <a key={n.id} class={n.itemClass} data-id={n.id} onclick={handleNav}>
                        <span class="nav__icon">
                            <template lwc:if={n.isHome}><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></template>
                            <template lwc:if={n.isCalendar}><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></template>
                            <template lwc:if={n.isBriefcase}><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg></template>
                            <template lwc:if={n.isUsers}><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></template>
                            <template lwc:if={n.isCompass}><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg></template>
                            <template lwc:if={n.isHeart}><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></template>
                            <template lwc:if={n.isGroup}><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></template>
                            <template lwc:if={n.isChat}><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></template>
                            <template lwc:if={n.isSupport}><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></template>
                        </span>
                        <span class="nav__label">{n.label}</span>
                    </a>
                </template>
            </nav>

            <div class="sidebar__footer">
                <p class="powered-by">Powered by <span>Alumni 2.0</span></p>
                <button type="button" class="logout-btn" onclick={handleLogout}>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#373A45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    Logout
                </button>
            </div>
        </aside>

        <!-- ==================== MAIN ==================== -->
        <main class="main">
            <!-- Top bar -->
            <header class="topbar">
                <div class={newsletterClass}>
                    <div class="newsletter__head">
                        <span class="newsletter__tag">Newsletter</span>
                        <span class="newsletter__title">Alumni Newsletter | October 2025</span>
                    </div>
                    <div class="newsletter__actions">
                        <a class="newsletter__view" onclick={handleViewNewsletter}>View More</a>
                        <button type="button" class="newsletter__cta" onclick={handleViewNewsletter}>Read Now</button>
                    </div>
                </div>
                <div class="topbar__actions">
                    <button class="icon-btn" aria-label="Messages">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#373A45" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                    </button>
                    <button class="icon-btn icon-btn--badge" aria-label="Notifications">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#373A45" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                        <span class="icon-btn__dot"></span>
                    </button>
                    <div class="topbar__logo">
                        <template lwc:if={institutionLogoUrl}>
                            <img src={institutionLogoUrl} alt="Institution Logo" />
                        </template>
                        <template lwc:else>
                            <span>Institution Logo</span>
                        </template>
                    </div>
                </div>
            </header>

            <!-- 3-col grid -->
            <div class="grid">
                <!-- ===== Center: Feed ===== -->
                <section class="col-feed">
                    <div class="col-head">
                        <h2 class="col-head__title">Feed</h2>
                        <select class="col-head__filter"><option>All</option><option>Events</option><option>News</option><option>Social</option></select>
                    </div>

                    <template for:each={feedDisplay} for:item="f">
                        <article key={f.id} class="post">
                            <template lwc:if={f.isSpotlight}>
                                <div class="post__media" style="background: linear-gradient(135deg,#FFE08A,#FFCB47);">
                                    <span class="post__play">▶</span>
                                </div>
                                <div class="post__body">
                                    <span class="post__pill">{f.title}</span>
                                    <h3 class="post__title">{f.subtitle}</h3>
                                    <p class="post__text">{f.excerpt}</p>
                                </div>
                            </template>
                            <template lwc:if={f.isEvent}>
                                <div class="post__body">
                                    <div class="post__head">
                                        <h3 class="post__title">{f.title}</h3>
                                        <span class="post__badge post__badge--news">{f.badge}</span>
                                    </div>
                                    <p class="post__text">{f.excerpt}</p>
                                    <p class="post__meta">{f.meta}</p>
                                </div>
                            </template>
                            <template lwc:if={f.isSocial}>
                                <div class="post__body">
                                    <div class="post__head">
                                        <h3 class="post__title">{f.title}</h3>
                                        <span class="post__badge post__badge--social">{f.badge}</span>
                                    </div>
                                    <p class="post__text">{f.excerpt}</p>
                                    <p class="post__meta">{f.meta}</p>
                                </div>
                            </template>
                        </article>
                    </template>
                </section>

                <!-- ===== Right-mid: Events + QuickLinks + Invite ===== -->
                <section class="col-events">
                    <div class="col-head"><h2 class="col-head__title">Upcoming Events</h2></div>
                    <article class="event-card">
                        <div class="event-card__img" style="background: linear-gradient(135deg,#86C5E8,#67A1C8);"></div>
                        <div class="event-card__body">
                            <h3 class="event-card__title">Living Earth Collaborative</h3>
                            <p class="event-card__meta">📍 Bangalore, India · 12 Oct 2025</p>
                        </div>
                    </article>

                    <div class="quick-links">
                        <h3 class="card-title">Quick Links</h3>
                        <div class="chips">
                            <template for:each={quickLinks} for:item="q">
                                <button key={q} type="button" class="chip">{q}</button>
                            </template>
                        </div>
                    </div>

                    <div class="invite">
                        <h3 class="card-title">Invite Friends</h3>
                        <p class="invite__msg">Share this link to invite them to the community.</p>
                        <div class="invite__copy">
                            <span class="invite__url">https://alumni.portal.edu/...</span>
                            <button type="button" class="invite__btn">📋</button>
                        </div>
                    </div>
                </section>

                <!-- ===== Far right: Birthdays + Resources + Businesses ===== -->
                <section class="col-side">
                    <div class="card">
                        <h3 class="card-title">Upcoming Birthdays</h3>
                        <ul class="bday-list">
                            <template for:each={birthdays} for:item="b">
                                <li key={b.id} class="bday-item">
                                    <span class="bday-item__avatar" style={b.avatarStyle}>{b.name.charAt(0)}</span>
                                    <span class="bday-item__name">{b.name}</span>
                                    <span class="bday-item__date">{b.date}</span>
                                </li>
                            </template>
                        </ul>
                    </div>

                    <div class="card">
                        <h3 class="card-title">Resources</h3>
                        <div class="res-grid">
                            <template for:each={resources} for:item="r">
                                <div key={r.id} class="res-item">
                                    <span class="res-item__bar" style={r.barStyle}></span>
                                    <p class="res-item__title">{r.title}</p>
                                    <p class="res-item__sub">{r.subtitle}</p>
                                </div>
                            </template>
                        </div>
                    </div>

                    <div class="card">
                        <h3 class="card-title">Businesses by Alumni</h3>
                        <div class="biz-grid">
                            <template for:each={businesses} for:item="b">
                                <div key={b.id} class="biz-item">
                                    <span class="biz-item__logo" style={b.logoStyle}>{b.initial}</span>
                                    <p class="biz-item__name">{b.name}</p>
                                </div>
                            </template>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>
    </c-ken42-alumni-shell-v2>
</template>
