<template>
    <div class="experience-card">
        <div class="experience-top-row">
            <div class="experience-details">
                <h4 class="position">{position}</h4>
                <p class="company-info">{company} | {employmentType}</p>
                <p class="location-info">{location} | {workType}</p>
            </div>
            <template if:true={isMyProfile}>
                <div class="card-actions">
                    <button class="icon-btn-plain" aria-label="Delete" onclick={handleDelete}>
                        <lightning-icon icon-name="utility:delete" size="x-small"></lightning-icon>
                    </button>
                    <button class="ken-edit-icon-btn" aria-label="Edit" onclick={handleEdit}>
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M11.7167 7.51667L12.4833 8.28333L4.93333 15.8333H4.16667V15.0667L11.7167 7.51667ZM14.7167 2.5C14.5083 2.5 14.2917 2.58333 14.1333 2.74167L12.6083 4.26667L15.7333 7.39167L17.2583 5.86667C17.5833 5.54167 17.5833 5.01667 17.2583 4.69167L15.3083 2.74167C15.1417 2.575 14.9333 2.5 14.7167 2.5ZM11.7167 5.15833L2.5 14.375V17.5H5.625L14.8417 8.28333L11.7167 5.15833Z" fill="var(--primary-color)"/>
                        </svg>
                    </button>
                </div>
            </template>

            <template if:true={showDeleteConfirm}>
                <div class="delete-confirm-overlay">
                    <div class="delete-confirm-modal">
                        <p class="delete-confirm-message">Are you sure you want to delete?</p>
                        <div class="delete-confirm-actions">
                            <button type="button" class="delete-confirm-no-btn" onclick={handleCancelDelete}>No</button>
                            <button type="button" class="delete-confirm-yes-btn" onclick={handleConfirmDelete}>Yes</button>
                        </div>
                    </div>
                </div>
            </template>
            <template if:false={isMyProfile}>
                <div class="experience-duration">
                    <span class="duration-badge">{duration}</span>
                </div>
            </template>
        </div>
        <template if:true={description}>
            <div class="experience-description">
                <lightning-formatted-rich-text value={description}></lightning-formatted-rich-text>
            </div>
        </template>
    </div>
</template>
