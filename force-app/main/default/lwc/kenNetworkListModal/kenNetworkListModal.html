<template>
    <template if:true={isOpen}>
        <div class="modal-backdrop" onclick={handleBackdropClick}>
            <div class="modal-box" onclick={stopPropagation}>

                <!-- Header -->
                <div class="modal-header">
                    <div class="modal-title-wrap">
                        <h2 class="modal-title">{title}</h2>
                        <span class="modal-count">{recordCount} connections</span>
                    </div>
                    <div class="modal-actions">
                        <button class="export-btn" onclick={handleExportCsv} title="Export as CSV" aria-label="Export as CSV">&#x2193; Export CSV</button>
                        <button class="modal-close" onclick={handleClose} title="Close" aria-label="Close modal">&#x2715;</button>
                    </div>
                </div>

                <!-- Search -->
                <div class="modal-search">
                    <input
                        type="text"
                        class="search-input"
                        placeholder="Search by name, status or date..."
                        value={searchTerm}
                        oninput={handleSearch}
                    />
                </div>

                <!-- Body -->
                <div class="modal-body">
                    <template if:true={isLoading}>
                        <div class="loading-state">
                            <div class="spinner"></div>
                            <p>Loading connections...</p>
                        </div>
                    </template>

                    <template if:false={isLoading}>
                        <template if:true={hasRows}>
                            <table class="network-table">
                                <thead>
                                    <tr>
                                        <th class="col-name">Connection #</th>
                                        <th class="col-initiator">Initiator</th>
                                        <th class="col-recipient">Recipient</th>
                                        <th class="col-status">Status</th>
                                        <th class="col-date">Requested</th>
                                        <th class="col-date">Accepted</th>
                                        <th class="col-tat">TAT (Days)</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={paginatedList} for:item="r">
                                        <tr key={r.id} class="network-row" data-record-id={r.id} onclick={handleRowClick} title="Click to open record">
                                            <td class="col-name conn-name-cell">{r.connectionName}</td>
                                            <td class="col-initiator">
                                                <span class="person-link" data-record-id={r.initiatorId} onclick={handlePersonClick}>{r.initiatorName}</span>
                                            </td>
                                            <td class="col-recipient">
                                                <span class="person-link" data-record-id={r.recipientId} onclick={handlePersonClick}>{r.recipientName}</span>
                                            </td>
                                            <td class="col-status">
                                                <span class={r.statusClass}>{r.status}</span>
                                            </td>
                                            <td class="col-date">{r.requestedDate}</td>
                                            <td class="col-date">{r.acceptedDate}</td>
                                            <td class="col-tat tat-cell">{r.tatDisplay}</td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>

                            <div class="pagination">
                                <button class="page-btn" onclick={prevPage} disabled={isFirstPage}>&#8249; Prev</button>
                                <span class="page-info">{pageInfo}</span>
                                <button class="page-btn" onclick={nextPage} disabled={isLastPage}>Next &#8250;</button>
                            </div>
                        </template>

                        <template if:false={hasRows}>
                            <div class="empty-state">No connections found</div>
                        </template>
                    </template>
                </div>

            </div>
        </div>
    </template>
</template>
