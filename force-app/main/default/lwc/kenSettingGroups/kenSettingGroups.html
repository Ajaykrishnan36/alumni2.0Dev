<template>
    <div class="groups-container">
        <h1 class="header-title">Groups</h1>

        <template if:true={error}>
            <div class="error-banner">{error}</div>
        </template>

        <template if:true={isLoading}>
            <div class="loading-spinner">
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </div>
        </template>

        <template if:true={isSaving}>
            <div class="loading-spinner">
                <lightning-spinner alternative-text="Saving" size="medium"></lightning-spinner>
            </div>
        </template>

        <template if:false={isLoading}>
            <div class="card groups-card-content">
                <h2 class="section-title">Preferences</h2>
                <div class="form-container">

                    <!-- Who can invite -->
                    <div class="form-group row-group">
                        <label class="field-label">Who can invite me to groups</label>
                        <div class="radio-group-custom">
                            <template for:each={inviteOptions} for:item="opt">
                                <label key={opt.value} class="custom-radio-wrapper">
                                    <input type="radio" name="group-invite" class="custom-radio-input"
                                           value={opt.value} checked={opt.checked} onchange={handleInviteChange} />
                                    <span class="custom-radio-circle"></span>
                                    <span class="custom-radio-label">{opt.label}</span>
                                </label>
                            </template>
                        </div>
                    </div>

                    <!-- Updates Toggle -->
                    <div class="form-group updates-group">
                        <label class="field-label">Receive updates from groups that you are a part of</label>
                        <div class="toggle-row">
                            <span>Turn on updates</span>
                            <div class="toggle-wrapper">
                                <label class="custom-toggle">
                                    <input type="checkbox" checked={updatesEnabled} onchange={handleUpdateToggle} />
                                    <span class="slider round"></span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- Notify me for -->
                    <div class="form-group">
                        <label class="field-label">Notify me for</label>
                        <div class="checkbox-group">
                            <template for:each={notifyFor} for:item="opt">
                                <label key={opt.value} class="custom-checkbox-wrapper">
                                    <input type="checkbox" class="custom-checkbox-input" checked={opt.checked}
                                           data-value={opt.value} onchange={handleNotifyForChange} />
                                    <span class="custom-checkbox-box"></span>
                                    <span class="custom-checkbox-label">{opt.label}</span>
                                </label>
                            </template>
                        </div>
                    </div>

                </div>
            </div>

            <div class="footer-actions">
                <button class="btn btn-outline" onclick={handleDiscard} disabled={isSaving}>Discard Changes</button>
                <button class="btn btn-primary" onclick={handleSave} disabled={isSaving}>Save Changes</button>
            </div>
        </template>
    </div>

    <c-ken-status-popup visible={showSuccessPopup} message="Group preferences saved successfully" variant="success"></c-ken-status-popup>
</template>
