<template>
    <div class={sidebarClass}>
        <div class="sidenav">
            <div class="profile-section" onclick={navigateToHomePage}>
                <div class="profile-picture-container" onclick={navigateToMyProfile}>
                    <img src={profilePhotoUrl}
                         alt="Profile Picture"
                         class="profile-picture"
                         onerror={handleImageError} />
                </div>
                <div class="profile-name-row">
                    <h2 class="profile-name">{studentName}</h2>
                    <button lwc:if={showRoleSwitch} type="button" class="role-switch-btn" title="Switch role" aria-label="Switch role"
                        onclick={navigateToRoleSelect}>
                        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true">
                            <g fill="currentColor">
                                <circle cx="6.5" cy="5" r="2.7"></circle>
                                <path d="M2 14.5c0-2.6 2-4.3 4.5-4.3s4.5 1.7 4.5 4.3z"></path>
                                <circle cx="17.5" cy="14" r="2.7"></circle>
                                <path d="M13 23.5c0-2.6 2-4.3 4.5-4.3s4.5 1.7 4.5 4.3z"></path>
                            </g>
                            <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M13.5 3.2a7.5 7.5 0 0 1 6.7 4.8"></path>
                                <polyline points="21.6 5.7 20.2 8 17.8 6.8"></polyline>
                                <path d="M10.5 20.8a7.5 7.5 0 0 1-6.7-4.8"></path>
                                <polyline points="2.4 18.3 3.8 16 6.2 17.2"></polyline>
                            </g>
                        </svg>
                    </button>
                </div>
                <template if:true={graduationYear}>
                    <p class="profile-batch">Batch - {graduationYear}</p>
                </template>
            </div>

            <ul class="menu-items-list">
                <template for:each={regularMenuItems} for:item="item">
                    <li key={item.id} class="menu-item-wrapper">
                        <c-ken-nav-item
                            item={item}
                            is-selected={item.isSelected}
                            class="full-width"
                            onitemselect={handleItemSelect}
                            onsubmenuselect={handleSubMenuSelect}>
                        </c-ken-nav-item>
                    </li>
                </template>
            </ul>

            <div class="powered-by-section">
                <div class="powered-by-button">
                    <span class="powered-by-text">Powered by</span>
                    <img src={sideLogoUrl} alt="ken42" class="ken42-icon" />
                </div>
            </div>

            <div class="logout-section">
                <template for:each={logoutMenuItems} for:item="item">
                    <c-ken-nav-item
                        key={item.id}
                        item={item}
                        is-selected={item.isSelected}
                        class="full-width"
                        onitemselect={handleItemSelect}
                        onsubmenuselect={handleSubMenuSelect}>
                    </c-ken-nav-item>
                </template>
            </div>
        </div>
    </div>
</template>
