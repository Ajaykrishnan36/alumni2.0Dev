<template>
    <div class="joined-groups-container">

        <!-- Header Row -->
        <div class="header-row">
            <h2 class="page-title">Groups Joined</h2>
            <div class="search-actions">
                <div class="search-box-wrap">
                    <span class="search-icon-wrap">
                        <lightning-icon icon-name="utility:search" size="x-small" class="search-icon"></lightning-icon>
                    </span>
                    <input
                        type="search"
                        placeholder="Search"
                        class="search-input-inner"
                        value={searchTerm}
                        oninput={handleSearchInput}
                    />
                </div>
                <button type="button" class="filter-btn" onclick={openFilterPanel}>
                    <span class="filter-btn-label">Filters</span>
                    <svg class="filter-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M9 15.75C9 15.5511 9.07902 15.3603 9.21967 15.2197C9.36032 15.079 9.55109 15 9.75 15H14.25C14.4489 15 14.6397 15.079 14.7803 15.2197C14.921 15.3603 15 15.5511 15 15.75C15 15.9489 14.921 16.1397 14.7803 16.2803C14.6397 16.421 14.4489 16.5 14.25 16.5H9.75C9.55109 16.5 9.36032 16.421 9.21967 16.2803C9.07902 16.1397 9 15.9489 9 15.75ZM6 11.25C6 11.0511 6.07902 10.8603 6.21967 10.7197C6.36032 10.579 6.55109 10.5 6.75 10.5H17.25C17.4489 10.5 17.6397 10.579 17.7803 10.7197C17.921 10.8603 18 11.0511 18 11.25C18 11.4489 17.921 11.6397 17.7803 11.7803C17.6397 11.921 17.4489 12 17.25 12H6.75C6.55109 12 6.36032 11.921 6.21967 11.7803C6.07902 11.6397 6 11.4489 6 11.25ZM3 6.75C3 6.55109 3.07902 6.36032 3.21967 6.21967C3.36032 6.07902 3.55109 6 3.75 6H20.25C20.4489 6 20.6397 6.07902 20.7803 6.21967C20.921 6.36032 21 6.55109 21 6.75C21 6.94891 20.921 7.13968 20.7803 7.28033C20.6397 7.42098 20.4489 7.5 20.25 7.5H3.75C3.55109 7.5 3.36032 7.42098 3.21967 7.28033C3.07902 7.13968 3 6.94891 3 6.75Z" fill="#373A45"/>
                    </svg>
                    <template if:true={activeFilterCount}>
                        <span class="filter-badge">{activeFilterCount}</span>
                    </template>
                </button>
            </div>
        </div>

        <!-- Groups Grid -->
        <div class="groups-grid-wrap">
            <template if:true={hasGroups}>
                <div class="groups-grid">
                    <template for:each={filteredGroups} for:item="group">
                        <div key={group.id} class="group-card">
                            <div class="card-image">
                                <img src={group.image} alt={group.name} class="group-image" />
                                <span class="badge">{group.status}</span>
                            </div>
                            <div class="card-info">
                                <h3 class="group-name">{group.name}</h3>
                                <p class="members-text">{group.members} members</p>
                                <div class="friends-info">
                                    <div class="avatars">
                                        <template for:each={group.friendsImages} for:item="img">
                                            <img key={img} src={img} alt="Friend" class="avatar-sm" />
                                        </template>
                                    </div>
                                    <span>{group.friends}</span>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </template>

            <template if:false={hasGroups}>
                <div class="empty-state">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#C0C4CC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                    <p class="empty-title">No groups found</p>
                    <p class="empty-sub">Try adjusting your search or filters.</p>
                </div>
            </template>
        </div>

        <!-- Filter Panel Overlay -->
        <template if:true={showFilterPanel}>
            <div class="filter-overlay" onclick={closeFilterPanel}></div>
            <div class="filter-panel">
                <div class="filter-panel-header">
                    <h3 class="filter-panel-title">Filters</h3>
                    <button type="button" class="filter-close-btn" onclick={closeFilterPanel} aria-label="Close filters">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>

                <div class="filter-panel-body">
                    <!-- Status -->
                    <div class="filter-field">
                        <div class="custom-select-wrap">
                            <select class="custom-select" onchange={handleStatusChange}>
                                <option value="" selected={isStatusAll}>Status</option>
                                <option value="Private" selected={isStatusPrivate}>Private</option>
                                <option value="Public" selected={isStatusPublic}>Public</option>
                            </select>
                            <svg class="select-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8E929E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </div>
                    </div>

                    <!-- Type -->
                    <div class="filter-field">
                        <div class="custom-select-wrap">
                            <select class="custom-select" onchange={handleTypeChange}>
                                <option value="" selected={isTypeAll}>Type</option>
                                <option value="Alumni" selected={isTypeAlumni}>Alumni</option>
                                <option value="Professional" selected={isTypeProfessional}>Professional</option>
                                <option value="Social" selected={isTypeSocial}>Social</option>
                            </select>
                            <svg class="select-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8E929E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </div>
                    </div>

                    <!-- Created On -->
                    <div class="filter-field">
                        <div class="date-input-wrap">
                            <input
                                type="date"
                                class="date-input"
                                value={filterCreatedOn}
                                onchange={handleCreatedOnChange}
                                placeholder="Created on"
                            />
                            <svg class="date-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8E929E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                                <line x1="16" y1="2" x2="16" y2="6"></line>
                                <line x1="8" y1="2" x2="8" y2="6"></line>
                                <line x1="3" y1="10" x2="21" y2="10"></line>
                            </svg>
                        </div>
                    </div>
                </div>

                <div class="filter-panel-footer">
                    <button type="button" class="reset-btn" onclick={handleResetFilters}>Reset Filters</button>
                    <button type="button" class="apply-btn" onclick={handleApplyFilters}>Apply</button>
                </div>
            </div>
        </template>

    </div>
</template>
