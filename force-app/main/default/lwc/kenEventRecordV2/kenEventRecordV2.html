<template>
    <button type="button" class="back-btn" onclick={handleBack}>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Back to Registered Events
    </button>

    <article class="rec">
        <!-- Hero banner -->
        <div class="rec__banner" style={bannerStyle}>
            <span class="rec__pill">{event.badge}</span>
            <h2 class="rec__title">{event.title}</h2>
        </div>

        <!-- Sub-tabs -->
        <nav class="subtabs">
            <button type="button" class={aboutTabClass} onclick={handleAbout}>About</button>
            <button type="button" class={scheduleTabClass} onclick={handleSchedule}>Schedule</button>
        </nav>

        <div class="rec__grid">
            <div class="rec__main">
                <!-- ABOUT -->
                <template lwc:if={isAbout}>
                    <h3 class="sec-h">About the Event</h3>
                    <p class="sec-body">{about.description}</p>

                    <template lwc:if={hasMeals}>
                        <div class="meals">
                            <div class="meals__head">
                                <span class="meals__title">Meals for Attendees</span>
                                <span class="chip chip--green">
                                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                    Meals Included
                                </span>
                            </div>
                            <ul class="meals__list">
                                <template for:each={about.meals} for:item="m">
                                    <li key={m}>{m}</li>
                                </template>
                            </ul>
                        </div>
                    </template>
                </template>

                <!-- SCHEDULE -->
                <template lwc:if={isSchedule}>
                    <div class="acc-wrap">
                        <template for:each={scheduleDays} for:item="d">
                            <div key={d.id} class="acc">
                                <button type="button" class="acc__head" data-id={d.id} onclick={toggleDay}>
                                    <span class="acc__day">
                                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><polyline points="12 7 12 12 15 14"></polyline></svg>
                                        {d.dayLabel}
                                    </span>
                                    <span class={d.chevClass}>▾</span>
                                </button>
                                <template lwc:if={d.isOpen}>
                                    <div class="acc__body">
                                        <template for:each={d.sessions} for:item="s">
                                            <div key={s.id} class="sess">
                                                <div class="sess__main">
                                                    <p class="sess__title">{s.title}</p>
                                                    <div class="sess__meta">
                                                        <span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><polyline points="12 7 12 12 15 14"></polyline></svg>{s.time}</span>
                                                        <span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>{s.speaker}</span>
                                                        <span><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>{s.location}</span>
                                                    </div>
                                                </div>
                                                <span class={s.pillClass}>{s.statusLabel}</span>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
                </template>

                <!-- Footer meta icons -->
                <div class="rec__footer">
                    <span class="fmeta"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>{event.dateLabel}</span>
                    <span class="fmeta"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"></path></svg>{event.formatLong}</span>
                    <span class="fmeta"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg>{event.capacity}</span>
                    <span class="fmeta"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"></path></svg>{event.language}</span>
                </div>
            </div>

            <!-- Right column: What to Expect -->
            <aside class="rec__aside">
                <h4 class="aside-h">What to Expect</h4>
                <ul class="exp-list">
                    <template for:each={whatToExpect} for:item="x">
                        <li key={x}>
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#19A974" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                            <span>{x}</span>
                        </li>
                    </template>
                </ul>
            </aside>
        </div>

        <!-- Dynamic action bar -->
        <div class="rec__actions">
            <template lwc:if={isCancelled}>
                <button type="button" class="btn btn--ghost-disabled" disabled>Registration Cancelled</button>
                <button type="button" class="btn btn--ghost-disabled" disabled>Download Brochure</button>
            </template>
            <template lwc:elseif={isCompleted}>
                <button type="button" class="btn btn--outline" onclick={handleBrochure}>Download Brochure</button>
                <button type="button" class="btn btn--outline" onclick={handleViewSummary}>View Registration Summary</button>
                <button type="button" class="btn btn--primary" onclick={handleFeedback}>Submit Feedback</button>
            </template>
            <template lwc:else>
                <button type="button" class="btn btn--outline" onclick={handleBrochure}>Download Brochure</button>
                <button type="button" class="btn btn--outline" onclick={handleViewSummary}>View Registration Summary</button>
                <button type="button" class="btn btn--primary" onclick={handleJoin}>
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2"></rect></svg>
                    Join Event • Ongoing
                </button>
            </template>
        </div>
    </article>
</template>
