<template>
    <div class="slds-modal__content slds-p-around_medium">
        <div class="slds-text-heading_medium slds-text-align_center slds-m-bottom_small">
            Attach file to send
        </div>
        <div class="slds-border_bottom slds-m-bottom_medium"></div>

        <!-- Upload File -->
        <lightning-input type="file"
                         label="Upload .csv or .xlsx file"
                         accept=".csv,.xlsx"
                         onchange={handleFileChange}>
        </lightning-input>

        <!-- Show file name -->
        <template if:true={selectedFile}>
            <div class="slds-box slds-box_x-small slds-m-top_medium">
                <span class="slds-truncate" title={fileName}>{fileName}</span>
                <lightning-button-icon icon-name="utility:delete"
                                       alternative-text="Remove file"
                                       variant="bare"
                                       class="slds-icon-text-error slds-m-left_small"
                                       onclick={removeSelectedFile}>
                </lightning-button-icon>
            </div>
        </template>

        <!-- Buttons -->
        <div class="slds-clearfix slds-m-top_medium">
            <div class="slds-float_right">
                <lightning-button label="Cancel" class="slds-m-right_small" onclick={handleCancel}></lightning-button>
                <lightning-button variant="brand" label="Send" onclick={handleUpload}></lightning-button>
            </div>
        </div>
    </div>
</template>
