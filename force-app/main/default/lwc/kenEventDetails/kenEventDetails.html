<template>
    <!-- Toast -->
    <template if:true={showToast}>
        <div class={toastClasses}>
            <div class="toast-content">
                <div class="toast-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d={toastIcon} fill={toastIconColor}></path>
                    </svg>
                </div>
                <div class="toast-text">
                    <div class="toast-title">{toastTitle}</div>
                    <div class="toast-message">{toastMessage}</div>
                </div>
            </div>
        </div>
    </template>

    <!-- Desktop View -->
    <div if:true={showDesktopView}>
        <div class="event-details-container">
            <template if:true={showSpinner}>
                <lightning-spinner alternative-text="Loading" size="medium" variant="brand"></lightning-spinner>
            </template>

            <template if:true={event}>
                <!-- Banner -->
                <div class="event-banner">
                    <img src={event.image} alt={event.title} class="event-banner-img" />
                    <div class="event-banner-overlay"></div>
                    <div class="event-banner-bottom">
                        <h1 class="event-banner-title">{event.title}</h1>
                        <div class="event-banner-badges">
                            <template if:true={showFeeBadge}>
                                <span class="event-fee-badge">{priceLabel}</span>
                            </template>
                            <template if:true={firstCategory}>
                                <span class="event-type-badge-pill">{firstCategory}</span>
                            </template>
                        </div>
                    </div>
                </div>

                <!-- Tab Navigation -->
                <div class="event-tab-nav">
                    <button type="button" class={aboutTabClass} onclick={handleTabAbout}>About</button>
                    <button type="button" class={scheduleTabClass} onclick={handleTabSchedule}>Schedule</button>
                    <template if:true={showParticipantsTab}>
                        <button type="button" class={participantsTabClass} onclick={handleTabParticipants}>Participants</button>
                    </template>
                    <template if:true={showEventUpdatesTab}>
                        <button type="button" class={updatesTabClass} onclick={handleTabUpdates}>Event Updates</button>
                    </template>
                </div>

                <!-- About Tab -->
                <template if:true={isAboutTab}>
                    <div class="event-tab-body">
                        <!-- Rejection reason (host only, rejected events) -->
                        <template if:true={showRejectionReason}>
                            <div class="rejection-reason-box">
                                <div class="rejection-reason-title">Reason for Rejection</div>
                                <div class="rejection-reason-text">{event.rejectionReason}</div>
                            </div>
                        </template>

                        <div class="slds-grid slds-wrap">
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_7-of-12 about-left-col">
                                <h2 class="tab-section-heading">About the Event</h2>
                                <p class="about-description">{event.description}</p>

                                <!-- Get Event Support -->
                                <div class="get-help-row">
                                    <button type="button" class="get-help-btn" onclick={handleGetHelp}>Get Event Support</button>
                                    <span class="get-help-text">Need help with this event?</span>
                                </div>

                                <template if:true={hasMeals}>
                                    <hr class="about-divider" />
                                    <div class="meals-header-row">
                                        <h2 class="tab-section-heading">Meals for Attendees</h2>
                                        <span class="meals-badge">
                                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                                                <path d="M11 9H9V2H7v7H5V2H3v7c0 2.12 1.66 3.84 3.75 3.97V22h2.5v-9.03C11.34 12.84 13 11.12 13 9V2h-2v7zm5-3v8h2.5v8H21V2c-2.76 0-5 2.24-5 4z" fill="currentColor"/>
                                            </svg>
                                            Meals Available
                                        </span>
                                    </div>
                                    <template for:each={mealsByDate} for:item="mealDay">
                                        <div key={mealDay.date} class="meal-day-row">
                                            <span class="meal-day-date">{mealDay.date}</span>
                                            <span class="meal-day-types">({mealDay.meals})</span>
                                            <template if:true={mealDay.optedLabel}>
                                                <span class="meal-day-opted">{mealDay.optedLabel}</span>
                                            </template>
                                        </div>
                                    </template>
                                </template>
                            </div>

                            <div class="slds-col slds-size_1-of-1 slds-medium-size_5-of-12 about-right-col about-right-col-bg">
                                <h2 class="tab-section-heading">What to Expect</h2>
                                <template if:true={hasExpectations}>
                                    <template for:each={expectationsList} for:item="exp">
                                        <div key={exp.id} class="expectation-item-new">
                                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                                                <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z" fill="#3061FF"/>
                                            </svg>
                                            <span>{exp.text}</span>
                                        </div>
                                    </template>
                                </template>
                                <template if:false={hasExpectations}>
                                    <p class="about-description">{event.expectations}</p>
                                </template>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- Schedule Tab -->
                <template if:true={isScheduleTab}>
                    <div class="event-tab-body">
                        <c-ken-event-schedule record-id={recordId}></c-ken-event-schedule>
                    </div>
                </template>

                <!-- Participants Tab (host only) -->
                <template if:true={isParticipantsTab}>
                    <div class="event-tab-body">
                        <div class="pt-toolbar">
                            <div class="pt-search">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" fill="#8C8E94"/></svg>
                                <input type="text" placeholder="Search participants" value={participantSearch} oninput={handleParticipantSearch} />
                            </div>
                            <div class="pt-toolbar-right">
                                <div class="pt-filter-wrap">
                                    <button type="button" class={filterBtnClass} onclick={handleToggleFilterDropdown}>
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                                            <path d="M4.25 5.61C6.27 8.2 10 13 10 13v6c0 .55.45 1 1 1h2c.55 0 1-.45 1-1v-6s3.72-4.8 5.74-7.39A1 1 0 0 0 18.95 4H5.04a1 1 0 0 0-.79 1.61z" fill="currentColor"/>
                                        </svg>
                                        Filters
                                        <template if:true={hasActiveFilters}>
                                            <span class="pt-filter-badge">{activeFilterCount}</span>
                                        </template>
                                    </button>
                                    <template if:true={showFilterDropdown}>
                                        <div class="pt-filter-dropdown">
                                            <div class="pt-filter-row">
                                                <label class="pt-filter-label">Meals</label>
                                                <select class="pt-filter-select" onchange={handleFilterMealsChange}>
                                                    <option value="">All</option>
                                                    <option value="yes">Included</option>
                                                    <option value="no">Not Included</option>
                                                </select>
                                            </div>
                                            <div class="pt-filter-row">
                                                <label class="pt-filter-label">Custom Form</label>
                                                <select class="pt-filter-select" onchange={handleFilterCustomFormChange}>
                                                    <option value="">All</option>
                                                    <option value="filled">Filled</option>
                                                    <option value="notfilled">Not Filled</option>
                                                </select>
                                            </div>
                                            <button type="button" class="pt-clear-filters-btn" onclick={handleClearFilters}>Clear Filters</button>
                                        </div>
                                    </template>
                                </div>
                                <button class="pt-download-btn" onclick={handleDownloadReport}>
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                                    Download Diet/Survey Report
                                </button>
                            </div>
                        </div>

                        <div class="pt-table-wrap">
                            <table class="pt-table">
                                <thead>
                                    <tr>
                                        <th>Participant</th>
                                        <th>Contact</th>
                                        <th>Sessions</th>
                                        <th>Meals Included</th>
                                        <th>Diet</th>
                                        <th>Custom Form</th>
                                        <th>Registered On</th>
                                        <template if:true={showFees}>
                                            <th>Payment Method</th>
                                            <th>Transaction ID</th>
                                        </template>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={pagedParticipants} for:item="p">
                                        <tr key={p.id}>
                                            <td class="pt-participant">
                                                <div class="pt-name">{p.name}</div>
                                                <div class="pt-batch">{p.batchLabel}</div>
                                            </td>
                                            <td class="pt-contact">
                                                <div>{p.email}</div>
                                                <div class="pt-phone">{p.phone}</div>
                                            </td>
                                            <td>{p.sessionsCount}</td>
                                            <td>{p.mealsLabel}</td>
                                            <td>{p.diet}</td>
                                            <td><span class={p.customFormClass}>{p.customFormLabel}</span></td>
                                            <td>{p.registeredOnLabel}</td>
                                            <template if:true={showFees}>
                                                <td>{p.paymentMethod}</td>
                                                <td>{p.transactionId}</td>
                                            </template>
                                        </tr>
                                    </template>
                                    <template if:false={hasParticipantRows}>
                                        <tr><td colspan={participantEmptyColspan} class="pt-empty">No participants yet.</td></tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>

                        <template if:true={showParticipantPagination}>
                            <div class="pt-pagination">
                                <button class="pt-page-btn" onclick={handleParticipantPrev} disabled={isParticipantPrevDisabled}>&#8592; Previous</button>
                                <span class="pt-page-label">{participantPageLabel}</span>
                                <button class="pt-page-btn" onclick={handleParticipantNext} disabled={isParticipantNextDisabled}>Next &#8594;</button>
                            </div>
                        </template>
                    </div>
                </template>

                <!-- Event Updates Tab -->
                <template if:true={isUpdatesTab}>
                    <div class="event-tab-body">
                        <!-- Photos & Highlights cards -->
                        <div class="slds-grid slds-wrap slds-gutters_medium eu-cards">
                            <template if:true={showPhotosCard}>
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                    <div class="eu-card">
                                        <div class="eu-card-left">
                                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z" fill="var(--primary-color, #3061FF)"/></svg>
                                            <span class="eu-card-title">Event Photos</span>
                                        </div>
                                        <template if:true={isHost}>
                                            <div class="eu-card-right">
                                                <template if:true={hasPhotosLink}>
                                                    <span class="eu-link-text">{photosLink}</span>
                                                </template>
                                                <button class="eu-action-btn filled" onclick={handleAddPhotos}>{photosBtnLabel}</button>
                                            </div>
                                        </template>
                                        <template if:false={isHost}>
                                            <button class="eu-action-btn filled" onclick={handleOpenPhotos}>Open Gallery</button>
                                        </template>
                                    </div>
                                </div>
                            </template>

                            <template if:true={showHighlightsCard}>
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                                    <div class="eu-card">
                                        <div class="eu-card-left">
                                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M19 9l1.25-2.75L23 5l-2.75-1.25L19 1l-1.25 2.75L15 5l2.75 1.25L19 9zm-7.5.5L9 4 6.5 9.5 1 12l5.5 2.5L9 20l2.5-5.5L17 12l-5.5-2.5zM19 15l-1.25 2.75L15 19l2.75 1.25L19 23l1.25-2.75L23 19l-2.75-1.25L19 15z" fill="var(--primary-color, #3061FF)"/></svg>
                                            <span class="eu-card-title">Event Highlights</span>
                                        </div>
                                        <template if:true={isHost}>
                                            <div class="eu-card-right">
                                                <template if:true={hasHighlightsLink}>
                                                    <span class="eu-link-text">{highlightsLink}</span>
                                                </template>
                                                <button class="eu-action-btn" onclick={handleAddHighlights}>{highlightsBtnLabel}</button>
                                            </div>
                                        </template>
                                        <template if:false={isHost}>
                                            <button class="eu-action-btn" onclick={handleOpenHighlights}>View Highlights</button>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </div>

                        <!-- Pre-Event Surveys section -->
                        <template if:true={hasPreEventSurveys}>
                            <div class="eu-feedback-section">
                                <h3 class="eu-feedback-heading">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M19 3H14.82C14.4 1.84 13.3 1 12 1s-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm2 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z" fill="currentColor"/></svg>
                                    Surveys
                                </h3>
                                <template for:each={processedPreEventSurveys} for:item="survey">
                                    <div key={survey.id} class="eu-feedback-card">
                                        <div class="eu-feedback-card-header">
                                            <div class="eu-feedback-name">{survey.name}</div>
                                            <template if:true={survey.isCompleted}>
                                                <span class="eu-fb-badge eu-fb-completed">Completed</span>
                                            </template>
                                            <template if:true={survey.isActive}>
                                                <span class="eu-fb-badge eu-fb-active">Active</span>
                                            </template>
                                        </div>
                                        <div class="eu-feedback-period">Survey Period: {survey.periodLabel}</div>
                                        <div class="eu-feedback-stats">
                                            <div class="eu-feedback-stat">
                                                <span class="eu-stat-label">Total Questions</span>
                                                <span class="eu-stat-value">{survey.questionLabel}</span>
                                            </div>
                                            <div class="eu-feedback-stat">
                                                <span class="eu-stat-label">Responses</span>
                                                <span class="eu-stat-value">{survey.responseLabel}</span>
                                            </div>
                                            <template if:true={survey.hasQuestionnaire}>
                                                <button type="button" class="eu-view-details-btn" onclick={handleSurveyViewDetails} data-id={survey.id}>View Details</button>
                                            </template>
                                            <template if:false={survey.hasQuestionnaire}>
                                                <button type="button" class="eu-setup-survey-btn" onclick={handleSurveySetup} data-id={survey.id}>Setup Survey Form</button>
                                            </template>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </template>

                        <!-- Session Feedback section -->
                        <template if:true={hasSessionFeedbacks}>
                            <div class="eu-feedback-section">
                                <h3 class="eu-feedback-heading">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z" fill="currentColor"/></svg>
                                    Session Feedback
                                </h3>
                                <template for:each={processedSessionFeedbacks} for:item="session">
                                    <div key={session.sessionId} class="eu-session-card">
                                        <div class="eu-session-header">
                                            <div class="eu-session-meta">
                                                <span class="eu-session-name">{session.sessionName}</span>
                                                <span class="eu-session-date">{session.sessionDate}</span>
                                            </div>
                                            <template if:true={session.hasSurvey}>
                                                <template if:true={session.isCompleted}>
                                                    <span class="eu-fb-badge eu-fb-completed">Completed</span>
                                                </template>
                                                <template if:true={session.isActive}>
                                                    <span class="eu-fb-badge eu-fb-active">Active</span>
                                                </template>
                                            </template>
                                        </div>
                                        <template if:true={session.hasSurvey}>
                                            <div class="eu-feedback-stats">
                                                <div class="eu-feedback-stat">
                                                    <span class="eu-stat-label">Total Questions</span>
                                                    <span class="eu-stat-value">{session.questionLabel}</span>
                                                </div>
                                                <div class="eu-feedback-stat">
                                                    <span class="eu-stat-label">Responses</span>
                                                    <span class="eu-stat-value">{session.responseLabel}</span>
                                                </div>
                                                <template if:true={session.hasQuestionnaire}>
                                                    <button type="button" class="eu-view-details-btn" onclick={handleSurveyViewDetails} data-id={session.surveyId}>View Details</button>
                                                </template>
                                                <template if:false={session.hasQuestionnaire}>
                                                    <button type="button" class="eu-setup-survey-btn" onclick={handleSurveySetup} data-id={session.sessionId}>Setup Feedback Form</button>
                                                </template>
                                            </div>
                                        </template>
                                        <template if:false={session.hasSurvey}>
                                            <div class="eu-no-form-row">
                                                <span class="eu-no-form-text">No feedback form created yet</span>
                                                <button type="button" class="eu-setup-survey-btn" onclick={handleSurveySetup} data-id={session.sessionId}>Setup Feedback Form</button>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
                </template>

                <!-- Footer Bar -->
                <div class="event-footer-bar">
                    <div class="footer-meta">
                        <template if:true={event.startDate}>
                            <div class="footer-meta-item">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                                    <path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V9h14v11zM7 11h5v5H7z" fill="#585A64"/>
                                </svg>
                                <span>{event.formattedDateRange}</span>
                            </div>
                        </template>
                        <template if:true={eventLocationType}>
                            <div class="footer-meta-item">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                                    <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" fill="#585A64"/>
                                </svg>
                                <span>{eventLocationType}</span>
                            </div>
                        </template>
                        <div class="footer-meta-item">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                                <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z" fill="#585A64"/>
                            </svg>
                            <span>{event.participantsCount}</span>
                        </div>
                        <template if:true={formattedLanguage}>
                            <div class="footer-meta-item">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                                    <path d="M12.87 15.07l-2.54-2.51.03-.03c1.74-1.94 2.98-4.17 3.71-6.53H17V4h-7V2H8v2H1v1.99h11.17C11.5 7.92 10.44 9.75 9 11.35 8.07 10.32 7.3 9.19 6.69 8h-2c.73 1.63 1.73 3.17 2.98 4.56l-5.09 5.02L4 19l5-5 3.11 3.11.76-2.04zM18.5 10h-2L12 22h2l1.12-3h4.75L21 22h2l-4.5-12zm-2.62 7l1.62-4.33L19.12 17h-3.24z" fill="#585A64"/>
                                </svg>
                                <span>{formattedLanguage}</span>
                            </div>
                        </template>
                    </div>

                    <div class="footer-actions">
                        <!-- Host: In Review -->
                        <template if:true={showHostInReviewActions}>
                            <span class="footer-posted-date">Posted on: {event.postedDate}</span>
                            <span class="footer-status-badge badge-review">In Review</span>
                            <button type="button" class="footer-edit-btn" onclick={handleEditEvent}>Edit Event</button>
                            <button type="button" class="footer-delete-btn" onclick={handleDeleteEvent}>Delete Event</button>
                        </template>

                        <!-- Host: Rejected -->
                        <template if:true={showHostRejectedActions}>
                            <span class="footer-status-badge badge-rejected">Rejected</span>
                            <button type="button" class="footer-register-btn" onclick={handleEditAndResubmit}>Edit &amp; Resubmit</button>
                        </template>

                        <!-- Host: Approved -->
                        <template if:true={showHostApprovedActions}>
                            <template if:true={isOngoingStatus}>
                                <button type="button" class="footer-join-link" onclick={handleJoinEvent}>Join Event</button>
                                <span class="footer-status-badge badge-ongoing">
                                    <span class="footer-status-dot"></span>Ongoing
                                </span>
                            </template>
                            <template if:true={isUpcomingStatus}>
                                <span class="footer-status-badge badge-upcoming">Upcoming</span>
                            </template>
                            <template if:true={isCompletedStatus}>
                                <span class="footer-status-badge badge-completed">Completed</span>
                            </template>
                        </template>

                        <!-- Non-host -->
                        <template if:true={showNonHostActions}>
                            <template if:false={isRegistered}>
                                <span class="footer-posted-date">Posted on: {event.postedDate}</span>
                            </template>
                            <template if:true={isOngoingStatus}>
                                <button type="button" class="footer-join-link" onclick={handleJoinEvent}>Join Event</button>
                                <span class="footer-status-badge badge-ongoing">
                                    <span class="footer-status-dot"></span>Ongoing
                                </span>
                            </template>
                            <template if:true={event.hasBrochure}>
                                <button type="button" class="footer-brochure-btn" onclick={handleDownloadBrochure}>
                                    Download Brochure
                                </button>
                            </template>
                            <template if:true={showRegisterButton}>
                                <button type="button" class="footer-register-btn" onclick={handleRegister}>
                                    Register Now
                                </button>
                            </template>
                            <template if:true={isRegistered}>
                                <template if:true={isUpcomingStatus}>
                                    <span class="footer-status-badge badge-upcoming">Upcoming</span>
                                </template>
                                <template if:true={isCompletedStatus}>
                                    <span class="footer-status-badge badge-completed">Completed</span>
                                </template>
                                <button type="button" class="footer-register-btn" onclick={handleViewRegistrationSummary}>
                                    View Registration Summary
                                </button>
                            </template>
                        </template>
                    </div>
                </div>
            </template>

        </div>
    </div>

    <!-- Add/Change Photos Link modal -->
    <template if:true={showPhotosModal}>
        <div class="eu-modal-backdrop"></div>
        <section class="eu-modal">
            <h2 class="eu-modal-title">Add Photos Link</h2>
            <p class="eu-modal-sub">Paste the link where your event photos are stored.</p>
            <label class="eu-modal-label">Link<span class="eu-req">*</span></label>
            <input type="text" class="eu-modal-input" placeholder="Paste Link" value={photosLinkInput} oninput={handlePhotosLinkInput} />
            <div class="eu-modal-actions">
                <button class="eu-btn-cancel" onclick={closePhotosModal}>Cancel</button>
                <button class="eu-btn-save" onclick={handleSavePhotos}>Link Photos</button>
            </div>
        </section>
    </template>

    <!-- Add/Change Highlights Link modal -->
    <template if:true={showHighlightsModal}>
        <div class="eu-modal-backdrop"></div>
        <section class="eu-modal">
            <h2 class="eu-modal-title">Add Event Highlights Link</h2>
            <p class="eu-modal-sub">You can add a Drive, website, or media link related to the highlights.</p>
            <label class="eu-modal-label">Link<span class="eu-req">*</span></label>
            <input type="text" class="eu-modal-input" placeholder="Paste Link" value={highlightsLinkInput} oninput={handleHighlightsLinkInput} />
            <div class="eu-modal-actions">
                <button class="eu-btn-cancel" onclick={closeHighlightsModal}>Cancel</button>
                <button class="eu-btn-save" onclick={handleSaveHighlights}>Link Highlights</button>
            </div>
        </section>
    </template>

    <!-- Delete event confirmation modal -->
    <template if:true={showDeleteConfirm}>
        <div class="eu-modal-backdrop" onclick={handleDeleteCancel}></div>
        <section class="eu-modal eu-modal-simple">
            <p class="eu-modal-question">Are you sure you want to delete this event?</p>
            <div class="eu-modal-actions">
                <button class="eu-btn-cancel" onclick={handleDeleteCancel}>Cancel</button>
                <button class="eu-btn-delete" onclick={handleDeleteConfirm}>Yes, Delete</button>
            </div>
        </section>
    </template>
</template>
