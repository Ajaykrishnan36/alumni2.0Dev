<template>
    <div class="surveys-page">
        <div class="surveys-container">
            <!-- Left Column: All Surveys -->
            <div class="all-surveys-section">
                <!-- Header -->
                <div class="section-header">
                    <p class="section-title">All Surveys & Feedback</p>
                    <div class="header-controls">
                        <c-ken-search-bar placeholder="Search" onsearch={handleSearch}></c-ken-search-bar>
                        <button class="sort-btn" onclick={handleSortClick}>
                            <span>Sort by</span>
                            <svg class={sortIconClass} width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/>
                            </svg>
                        </button>
                        <button class={filtersBtnClass} onclick={handleFiltersClick} data-filter-btn="true">
                            <span>Filters</span>
                            <svg class="filters-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M9 15.75C9 15.5511 9.07902 15.3603 9.21967 15.2197C9.36032 15.079 9.55109 15 9.75 15H14.25C14.4489 15 14.6397 15.079 14.7803 15.2197C14.921 15.3603 15 15.5511 15 15.75C15 15.9489 14.921 16.1397 14.7803 16.2803C14.6397 16.421 14.4489 16.5 14.25 16.5H9.75C9.55109 16.5 9.36032 16.421 9.21967 16.2803C9.07902 16.1397 9 15.9489 9 15.75ZM6 11.25C6 11.0511 6.07902 10.8603 6.21967 10.7197C6.36032 10.579 6.55109 10.5 6.75 10.5H17.25C17.4489 10.5 17.6397 10.579 17.7803 10.7197C17.921 10.8603 18 11.0511 18 11.25C18 11.4489 17.921 11.6397 17.7803 11.7803C17.6397 11.921 17.4489 12 17.25 12H6.75C6.55109 12 6.36032 11.921 6.21967 11.7803C6.07902 11.6397 6 11.4489 6 11.25ZM3 6.75C3 6.55109 3.07902 6.36032 3.21967 6.21967C3.36032 6.07902 3.55109 6 3.75 6H20.25C20.4489 6 20.6397 6.07902 20.7803 6.21967C20.921 6.36032 21 6.55109 21 6.75C21 6.94891 20.921 7.13968 20.7803 7.28033C20.6397 7.42098 20.4489 7.5 20.25 7.5H3.75C3.55109 7.5 3.36032 7.42098 3.21967 7.28033C3.07902 7.13968 3 6.94891 3 6.75Z" fill="#373A45"/>
                            </svg>
                            <template if:true={hasActiveFilters}>
                                <span class="filter-badge">{activeFilterCount}</span>
                            </template>
                        </button>
                    </div>
                </div>

                <!-- Survey Cards List -->
                <div class="surveys-list">
                    <!-- Empty State -->
                    <template if:true={isEmptyAllSurveys}>
                        <div class="all-surveys-empty-state">
                            <img src={SurveyEmptyImageUrl} alt="No surveys available" class="empty-state-image" />
                            <h3 class="empty-state-title">No Surveys Available Now</h3>
                            <p class="empty-state-subtitle">We will let you know when there is a new survey that you can take</p>
                        </div>
                    </template>
                    
                    <!-- Surveys List -->
                    <template if:true={hasAllSurveys}>
                        <template for:each={allSurveys} for:item="survey">
                            <template if:true={survey.isCompleted}>
                                <div key={survey.id} class="survey-card completed-survey-card">
                                    <div class="survey-info">
                                        <h3 class="survey-title">{survey.title}</h3>
                                        <p class="survey-date">Last date: {survey.lastDate}</p>
                                    </div>
                                    <div class="survey-meta">
                                        <span class="survey-type-tag">{survey.type}</span>
                                        <div class="survey-questions-info">
                                            <span class="questions-label">Total Questions</span>
                                            <span class="questions-count">{survey.totalQuestions}</span>
                                        </div>
                                    </div>
                                    <div class="completed-survey-actions">
                                        <span class="completed-badge">Completed</span>
                                        <button class="retake-survey-btn" onclick={handleRetakeSurvey} data-survey-id={survey.id}>Retake</button>
                                    </div>
                                </div>
                            </template>
                            <template if:false={survey.isCompleted}>
                                <div key={survey.id} class="survey-card">
                                    <div class="survey-info">
                                        <h3 class="survey-title">{survey.title}</h3>
                                        <p class="survey-date">Last date: {survey.lastDate}</p>
                                    </div>
                                    <div class="survey-meta">
                                        <span class="survey-type-tag">{survey.type}</span>
                                        <div class="survey-questions-info">
                                            <span class="questions-label">Total Questions</span>
                                            <span class="questions-count">{survey.totalQuestions}</span>
                                        </div>
                                    </div>
                                    <div class="get-started-actions">
                                        <button class="get-started-btn" onclick={handleBeginSurvey} data-survey-id={survey.id}>
                                            Get Started
                                        </button>
                                    </div>
                                </div>
                            </template>
                        </template>
                    </template>
                </div>
            </div>

            <!-- Right Column: Your Surveys and Create New Survey -->
            <div class="your-surveys-section">
                <!-- Your Surveys List -->
                <div class="your-surveys-list">
                    <p class="your-surveys-title">Your Surveys</p>
                    
                    <!-- Empty State -->
                    <template if:true={isEmptyYourSurveys}>
                        <div class="your-surveys-empty-state">
                            <img src={SurveyEmptyImageUrl} alt="No surveys" class="empty-state-image" />
                            <p class="empty-state-message">You have created no survey's so far!</p>
                        </div>
                    </template>
                    
                    <!-- Surveys List -->
                    <template if:true={hasYourSurveys}>
                        <div class="your-surveys-cards-container">
                            <template for:each={yourSurveys} for:item="survey">
                                <template if:true={survey.isCompleted}>
                                    <div key={survey.id} class="your-survey-card completed-survey-card" onclick={handleViewSurveyDetails} data-survey-id={survey.id}>
                                        <div class="your-survey-content">
                                            <h3 class="your-survey-title">{survey.title}</h3>
                                            <p class="your-survey-detail">Last date: {survey.lastDate}</p>
                                            <p class="your-survey-detail">Responses: {survey.responses}</p>
                                        </div>
                                        <div class={survey.statusClass}>
                                            Completed
                                        </div>
                                    </div>
                                </template>
                                <template if:false={survey.isCompleted}>
                                    <div key={survey.id} class="your-survey-card" onclick={handleViewSurveyDetails} data-survey-id={survey.id}>
                                        <div class="your-survey-content">
                                            <h3 class="your-survey-title">{survey.title}</h3>
                                            <template if:true={survey.submittedDate}>
                                                <p class="your-survey-detail">Submitted on: {survey.submittedDate}</p>
                                            </template>
                                            <template if:true={survey.surveyPeriod}>
                                                <p class="your-survey-detail">Survey Period: {survey.surveyPeriod}</p>
                                            </template>
                                            <template if:true={survey.showResponses}>
                                                <p class="your-survey-detail">Responses: {survey.responses}</p>
                                            </template>
                                            <template if:true={survey.rejectedDate}>
                                                <p class="your-survey-detail">Rejected on: {survey.rejectedDate}</p>
                                            </template>
                                            <template if:true={survey.rejectionReason}>
                                                <p class="your-survey-detail">
                                                    <span class="reason-label">Reason:</span>
                                                    <span class="reason-text">{survey.rejectionReason}</span>
                                                </p>
                                            </template>
                                        </div>
                                        <div class={survey.statusClass}>
                                            <template if:true={survey.showStatusIcon}>
                                                <div class="status-indicator"></div>
                                            </template>
                                            {survey.status}
                                        </div>
                                    </div>
                                </template>
                            </template>
                        </div>
                        <button class="view-all-btn" onclick={handleViewAll}>View All</button>
                    </template>
                </div>

                <!-- Create New Survey Card -->
                <div class="create-survey-card" onclick={handleCreateSurvey}>
                    <div class="create-survey-header">
                        <div class="create-survey-header-content">
                            <p class="create-survey-title">Create New Survey</p>
                            <lightning-icon icon-name="utility:chevronright" size="small" class="arrow-icon"></lightning-icon>
                        </div>
                        <div class="create-survey-header-line"></div>
                    </div>
                    <div class="create-survey-illustration">
                        <img src={listYourBusinessImageUrl} alt="Create New Survey" class="create-survey-image" onerror={handleImageError} />
                    </div>
                </div>
            </div>
        </div>

        <!-- Filters Popup -->
        <template if:true={showFiltersPopup}>
            <div class="filters-overlay" onclick={handleFiltersOverlayClick}></div>
            <div class="filters-popup" onclick={handleFiltersPopupClick} style={computedPopupStyle}>
                <div class="filters-header">
                    <h3 class="filters-title">Filters</h3>
                </div>
                <div class="filters-content">
                    <div class="filter-field">
                        <lightning-input
                            type="date"
                            label=""
                            placeholder="Select last date"
                            value={selectedDate}
                            onchange={handleDateChange}
                            variant="label-hidden"
                            class="filter-date-input">
                        </lightning-input>
                    </div>
                    <div class="filter-field">
                        <lightning-combobox
                            label=""
                            placeholder="Status"
                            options={statusOptions}
                            value={selectedStatus}
                            onchange={handleStatusChange}
                            variant="label-hidden"
                            class="filter-combobox">
                        </lightning-combobox>
                    </div>
                    <div class="filter-field">
                        <lightning-combobox
                            label=""
                            placeholder="Choose Survey/Feedback"
                            options={surveyFeedbackOptions}
                            value={selectedSurveyFeedback}
                            onchange={handleSurveyFeedbackChange}
                            variant="label-hidden"
                            class="filter-combobox">
                        </lightning-combobox>
                    </div>
                </div>
                <div class="filters-actions">
                    <button class="reset-filters-btn" onclick={handleResetFilters}>Reset Filters</button>
                    <button class="apply-filters-btn" onclick={handleApplyFilters}>Apply</button>
                </div>
            </div>
        </template>

        <!-- Begin Survey Dialog -->
        <template if:true={showBeginSurveyDialog}>
            <div class="begin-survey-overlay" onclick={handleGoBackFromDialog}></div>
            <div class="begin-survey-dialog" onclick={handleDialogClick}>

                </div>
                <div class="begin-survey-content">
                    <h2 class="begin-survey-title">Your Opinion Matters!</h2>
                    <p class="begin-survey-message">Your feedback is essential to help us enhance engagement & better cater to your interest. Help us by answering a quick survey</p>
                </div>
                <div class="begin-survey-actions">
                    <button class="go-back-btn" onclick={handleGoBackFromDialog}>Go Back</button>
                    <button class="begin-survey-confirm-btn" onclick={handleBeginSurveyFromDialog}>Get Started</button>
                </div>
            </div>
        </template>

        <!-- Survey Form Dialog -->
        <template if:true={showSurveyForm}>
            <div class="survey-form-overlay" onclick={handleBack}></div>
            <div class="survey-form-dialog" onclick={handleDialogClick}>
                <p class="survey-form-title">{selectedSurveyTitle}</p>
                
                <template if:true={isSubmitting}>
                    <div class="survey-form-overlay"></div>
                    <div class="submit-loader" onclick={handleDialogClick}>
                        <lightning-spinner alternative-text="Submitting..." size="medium" variant="brand"></lightning-spinner>
                        <p>Submitting your responses...</p>
                    </div>
                </template>

                <template if:true={currentQuestion}>
                    <div class="survey-question-container">
                        <p class="survey-question-label">
                            {currentQuestion.displayId}. {currentQuestion.question}
                            <template if:true={currentQuestion.isRequired}>
                                <span class="required-asterisk">*</span>
                            </template>
                        </p>
                        
                        <!-- Checkbox Questions -->
                        <template if:true={isCheckboxQuestion}>
                            <div class="survey-options">
                                <template for:each={currentQuestion.options} for:item="option">
                                    <label key={option} class="checkbox-option">
                                        <input 
                                            type="checkbox" 
                                            value={option}
                                            data-question-id={currentQuestion.id}
                                            onchange={handleCheckboxChange}
                                        />
                                        <span>{option}</span>
                                    </label>
                                </template>
                            </div>
                        </template>
                        
                        <!-- Text Input Questions -->
                        <template if:true={isTextQuestion}>
                            <input 
                                type="text" 
                                class="survey-text-input"
                                placeholder={currentQuestion.placeholder}
                                data-question-id={currentQuestion.id}
                                onchange={handleTextChange}
                            />
                        </template>
                        
                        <!-- Rating Scale -->
                        <template if:true={isRatingQuestion}>
                            <div class="rating-scale">
                                <template for:each={currentQuestion.scale} for:item="item">
                                    <div key={item.value} class="rating-item">
                                        <button 
                                            type="button"
                                            class="rating-btn"
                                            data-rating-value={item.value}
                                            data-question-id={currentQuestion.id}
                                            onclick={handleRatingClick}
                                        >
                                            {item.value}
                                        </button>
                                        <template if:true={item.label}>
                                            <span class="rating-label">{item.label}</span>
                                        </template>
                                    </div>
                                </template>
                            </div>
                        </template>
                        
                        <!-- Radio Questions -->
                        <template if:true={isRadioQuestion}>
                            <div class="survey-options">
                                <template for:each={currentQuestion.options} for:item="option">
                                    <label key={option} class="radio-option">
                                        <input 
                                            type="radio" 
                                            name={currentQuestion.id}
                                            value={option}
                                            data-question-id={currentQuestion.id}
                                            onchange={handleRadioChange}
                                        />
                                        <span>{option}</span>
                                    </label>
                                </template>
                            </div>
                            
                            <!-- Conditional text field for question h -->
                            <template if:true={showConditionalField}>
                                <div class="conditional-field">
                                    <p class="conditional-label">If yes, please specify areas or activities where you would be interested in volunteering.</p>
                                    <input 
                                        type="text" 
                                        class="survey-text-input"
                                        placeholder="Enter"
                                        data-question-id={currentQuestion.followUpQuestionId}
                                        onchange={handleTextChange}
                                    />
                                </div>
                            </template>
                        </template>
                    </div>
                </template>
                
                <template if:true={questionError}>
                    <div class="submit-error">{questionError}</div>
                </template>
                <div class="survey-form-actions">
                    <button class="back-btn" onclick={handleBack}>Back</button>
                    <button class="next-btn" onclick={handleNext}>
                        <template if:true={isLastQuestion}>Submit</template>
                        <template if:false={isLastQuestion}>Next</template>
                    </button>
                </div>
            </div>
        </template>

        <!-- Submit Confirmation Dialog -->
        <template if:true={showSubmitConfirmation}>
            <div class="survey-form-overlay" onclick={handleReviewForm}></div>
            <div class="submit-confirmation-dialog" onclick={handleDialogClick}>
                <p class="confirmation-message">Are you sure you want to submit your survey?</p>
                <div class="confirmation-actions">
                    <button class="review-form-btn" onclick={handleReviewForm}>Review Form</button>
                    <button class="yes-submit-btn" onclick={handleConfirmSubmit}>Yes</button>
                </div>
                <template if:true={submitError}>
                    <div class="submit-error">{submitError}</div>
                </template>
            </div>
        </template>

        <!-- Success Dialog -->
        <template if:true={showSuccessDialog}>
            <div class="survey-form-overlay" onclick={handleCloseSuccessDialog}></div>
            <div class="success-dialog" onclick={handleDialogClick}>
                <div class="success-icon-container">
