<template>
    <div class="feed-container">
        <div class="feed-header">
            <p class="feed-title">Feed</p>
            <template if:true={showFeedViewMore}>
                <button type="button" class="feed-view-more-btn" onclick={handleViewMoreFeed}>View more</button>
            </template>
        </div>

        <div class="feed-content">
            <!-- In the Spotlight Section -->
            <template if:true={showSpotlightSection}>
            <div class="spotlight-card">
                <div class="spotlight-header">
                    <p class="spotlight-title">In the Spotlight</p>
                    <template if:true={hasMultipleSpotlights}>
                        <div class="spotlight-nav">
                            <button type="button" class="spotlight-nav-btn" onclick={handleSpotlightPrev} aria-label="Previous spotlight">‹</button>
                            <span class="spotlight-counter">{spotlightCounter}</span>
                            <button type="button" class="spotlight-nav-btn" onclick={handleSpotlightNext} aria-label="Next spotlight">›</button>
                        </div>
                    </template>
                </div>
                <template if:true={spotlightIsVideo}>
                    <div class="video-container">
                        <iframe
                            width="100%"
                            height="315"
                            src={spotlightEmbedUrl}
                            title="Spotlight video"
                            style="border: none;"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                            referrerpolicy="strict-origin-when-cross-origin"
                            allowfullscreen>
                        </iframe>
                    </div>
                </template>
                <template if:false={spotlightIsVideo}>
                    <template if:true={spotlightImageUrl}>
                        <div class="video-container">
                            <img src={spotlightImageUrl} alt="Spotlight" style="width:100%; border-radius:8px;" />
                        </div>
                    </template>
                </template>
                <div class="spotlight-content">
                    <p class="spotlight-headline">{spotlightHeadline}</p>
                    <p class="spotlight-description">{spotlightDisplayText}</p>
                    <template if:true={spotlightShowToggle}>
                        <div class="expand-toggle-mobile">
                            <button type="button" class="show-all-btn" onclick={toggleSpotlightExpand}>
                                <template if:false={spotlightExpanded}>Show all</template>
                                <template if:true={spotlightExpanded}>Minimize</template>
                            </button>
                        </div>
                    </template>
                </div>
            </div>
            </template>

            <!-- Feed Items -->
            <template for:each={displayFeedItems} for:item="item">
                <div key={item.id} class="feed-item">
                    <div class="feed-item-icon">
                        <img src={item.icon} alt={item.title} class="icon-image" />
                    </div>
                    <div class="feed-item-content">
                        <div class="feed-item-header">
                            <p class="feed-item-title">{item.title}</p>
                            <span class="feed-item-tag">{item.tag}</span>
                        </div>
                        <p class="feed-item-text">{item.contentDisplayText}</p>
                        <template if:true={item.contentShowToggle}>
                            <div class="expand-toggle-mobile">
                                <button type="button" class="show-all-btn feed-item-show-all" onclick={toggleItemContentExpand} data-item-id={item.id}>
                                    <template if:false={item.contentExpanded}>Show all</template>
                                    <template if:true={item.contentExpanded}>Minimize</template>
                                </button>
                            </div>
                        </template>
                        <template if:true={item.hashtags}>
                            <div class="feed-item-hashtags">
                                <template for:each={item.hashtags} for:item="tag">
                                    <span key={tag} class="hashtag">#{tag}</span>
                                </template>
                            </div>
                        </template>
                        <div class="feed-item-meta">
                            <span class="feed-item-date">{item.metaDisplayText}</span>
                            <template if:true={item.metaShowToggle}>
                                <div class="expand-toggle-mobile">
                                    <button type="button" class="show-all-btn" onclick={toggleItemMetaExpand} data-item-id={item.id}>
                                        <template if:false={item.metaExpanded}>Show all</template>
                                        <template if:true={item.metaExpanded}>Minimize</template>
                                    </button>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </template>

            <template if:true={showFeedEmpty}>
                <div class="feed-empty">
                    <img src={emptyImage} alt="" class="feed-empty-img" />
                    <p class="feed-empty-title">No posts yet</p>
                    <p class="feed-empty-text">Posts from the groups you join will show up here.</p>
                </div>
            </template>
        </div>
    </div>
</template>
