<template>
    <template lwc:if={embedded}>
        <div class="rl">
            <div class="rl-bar">
                <h1 class="rl-title">Your resumes</h1>
                <div class="rl-bar__right">
                    <div class="rl-search">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <input type="search" placeholder="Search..." value={searchTerm} oninput={handleSearch}/>
                    </div>
                    <button type="button" class="rl-btn rl-btn--primary" onclick={handleOpenUpload}>Upload Resume</button>
                </div>
            </div>
            <template lwc:if={isLoading}>
                <div class="rl-empty">Loading…</div>
            </template>
            <template lwc:elseif={hasResumes}>
                <div class="rl-grid">
                    <template for:each={filteredResumes} for:item="r">
                        <article key={r.id} class="rl-card">
                            <div class="rl-card__head">
                                <span class="rl-pdf">PDF</span>
                                <span class="rl-card__name" title={r.name}>{r.name}</span>
                                <button type="button" class="rl-trash" data-id={r.id} onclick={handleDelete} title="Delete">
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                                </button>
                            </div>
                            <template lwc:if={r.canDownload}>
                                <a class="rl-download" href={r.downloadUrl} target="_blank" rel="noopener">
                                    <span>Download resume</span>
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                                </a>
                            </template>
                            <template lwc:else>
                                <span class="rl-download rl-download--disabled">Processing…</span>
                            </template>
                        </article>
                    </template>
                </div>
            </template>
            <template lwc:else>
                <div class="rl-empty">
                    <div class="rl-empty__icon" aria-hidden="true">&#128196;</div>
                    <h3>No resumes yet</h3>
                    <p>Upload a resume (PDF) and it will appear here to download or share with your applications.</p>
                    <button type="button" class="rl-btn rl-btn--primary" onclick={handleOpenUpload}>Upload Resume</button>
                </div>
            </template>
            <template lwc:if={showUpload}>
                <div class="rl-modal-backdrop" onclick={handleBackdrop}>
                    <div class="rl-modal" onclick={stop}>
                        <div class="rl-modal__head">
                            <span class="rl-modal__title">Resume <span class="rl-req">*</span></span>
                            <button type="button" class="rl-modal__close" onclick={handleCloseUpload}>&times;</button>
                        </div>
                        <label class="rl-file">
                            <template lwc:if={pendingName}><span class="rl-file__name">{pendingName}</span></template>
                            <template lwc:else><span class="rl-file__hint">Upload your resume (PDF only)</span></template>
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                            <input type="file" accept="application/pdf,.pdf" onchange={handleFilePick}
                                style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);border:0;padding:0;margin:-1px;"/>
                        </label>
                        <div class="rl-modal__foot">
                            <button type="button" class="rl-btn rl-btn--primary" disabled={submitDisabled} onclick={handleSubmitUpload}>
                                <template lwc:if={uploading}>Uploading…</template>
                                <template lwc:else>Submit</template>
                            </button>
                        </div>
                    </div>
                </div>
            </template>
            <template lwc:if={toastVisible}><div class="rl-toast">{toast}</div></template>
        </div>
    </template>

    <template lwc:else>
        <c-ken42-alumni-shell-v2 active-nav="jobs">
            <div class="rl">
                <div class="rl-bar">
                    <h1 class="rl-title">Your resumes</h1>
                    <div class="rl-bar__right">
                        <div class="rl-search">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                            <input type="search" placeholder="Search..." value={searchTerm} oninput={handleSearch}/>
                        </div>
                        <button type="button" class="rl-btn rl-btn--primary" onclick={handleOpenUpload}>Upload Resume</button>
                    </div>
                </div>
                <template lwc:if={isLoading}>
                    <div class="rl-empty">Loading…</div>
                </template>
                <template lwc:elseif={hasResumes}>
                    <div class="rl-grid">
                        <template for:each={filteredResumes} for:item="r">
                            <article key={r.id} class="rl-card">
                                <div class="rl-card__head">
                                    <span class="rl-pdf">PDF</span>
                                    <span class="rl-card__name" title={r.name}>{r.name}</span>
                                    <button type="button" class="rl-trash" data-id={r.id} onclick={handleDelete} title="Delete">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                                    </button>
                                </div>
                                <template lwc:if={r.canDownload}>
                                    <a class="rl-download" href={r.downloadUrl} target="_blank" rel="noopener">
                                        <span>Download resume</span>
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                                    </a>
                                </template>
                                <template lwc:else>
                                    <span class="rl-download rl-download--disabled">Processing…</span>
                                </template>
                            </article>
                        </template>
                    </div>
                </template>
                <template lwc:else>
                    <div class="rl-empty">
                        <div class="rl-empty__icon" aria-hidden="true">&#128196;</div>
                        <h3>No resumes yet</h3>
                        <p>Upload a resume (PDF) and it will appear here to download or share with your applications.</p>
                        <button type="button" class="rl-btn rl-btn--primary" onclick={handleOpenUpload}>Upload Resume</button>
                    </div>
                </template>
                <template lwc:if={showUpload}>
                    <div class="rl-modal-backdrop" onclick={handleBackdrop}>
                        <div class="rl-modal" onclick={stop}>
                            <div class="rl-modal__head">
                                <span class="rl-modal__title">Resume <span class="rl-req">*</span></span>
                                <button type="button" class="rl-modal__close" onclick={handleCloseUpload}>&times;</button>
                            </div>
                            <label class="rl-file">
                                <template lwc:if={pendingName}><span class="rl-file__name">{pendingName}</span></template>
                                <template lwc:else><span class="rl-file__hint">Upload your resume (PDF only)</span></template>
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                                <input type="file" accept="application/pdf,.pdf" onchange={handleFilePick}
                                    style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);border:0;padding:0;margin:-1px;"/>
                            </label>
                            <div class="rl-modal__foot">
                                <button type="button" class="rl-btn rl-btn--primary" disabled={submitDisabled} onclick={handleSubmitUpload}>
                                    <template lwc:if={uploading}>Uploading…</template>
                                    <template lwc:else>Submit</template>
                                </button>
                            </div>
                        </div>
                    </div>
                </template>
                <template lwc:if={toastVisible}><div class="rl-toast">{toast}</div></template>
            </div>
        </c-ken42-alumni-shell-v2>
    </template>
</template>
