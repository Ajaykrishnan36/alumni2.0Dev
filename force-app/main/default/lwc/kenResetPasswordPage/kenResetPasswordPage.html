<template>
	<div class="section-width">
		<template if:true={isLoading}>
			<lightning-spinner
				alternative-text="Loading..."
				size="medium"
				variant="brand"
			></lightning-spinner>
		</template>
		
		<!-- Step 1: Email Input -->
		<template if:true={showEmailStep}>
			<p class="reset-title">Reset your password</p>
			<p class="reset-subtitle">Forgot your password or using a temporary password? Enter your registered email to reset it and continue.</p>

			<div class="slds-grid slds-wrap">
				<div class="slds-col slds-size_1-of-1">
					<div class="field-label">Email</div>
					<lightning-input
						id="email"
						label="Email"
						type="email"
						placeholder="Enter your email"
						data-id="email"
						value={email}
						variant="label-hidden"
						oninput={handleInputChange}
						onchange={handleInputChange}
						onblur={handleOnBlur}
						onkeyup={handleEnterKey}
						class="studentportalInputsLogin"
					>
					</lightning-input>
				</div>
				<template if:true={errorMessage}>
					<div class="slds-text-color_error slds-m-bottom_medium error-message">{errorMessage}</div>
				</template>
			</div>
			<div style="margin-top: 25px;">
				<lightning-button
					variant="brand"
					disable-animation="true"
					label="Continue"
					type="submit"
					onclick={handleSendResetEmail}
					stretch
					class="studentportal-BlueButtonLogin"
				></lightning-button>
			</div>
			<div class="back-to-login">
				<button type="button" class="back-link" onclick={handleBackToLogin}>Back to Login</button>
			</div>
			<!-- <div class="powered-by-section">
				<span class="powered-by-text">Powered by</span>
				<img src={kenPoweredbyLogo} alt="ken42" class="ken42-logo-image" />
			</div> -->
		</template>

		<!-- Step 2: OTP Verification -->
		<template if:true={showOTPStep}>
			<p class="reset-title">Verify OTP</p>
			<div class="otp-container">
				<div class="otp-email-section">
					<span class="otp-email-text">An OTP has been sent to </span>
					<span class="otp-email-address">{email}</span>
					<button type="button" class="edit-email-btn" onclick={handleEditEmail} aria-label="Edit email">
						<svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
							<path d="M3 17.25V21H6.75L17.81 9.94L14.06 6.19L3 17.25ZM20.71 7.04C21.1 6.65 21.1 6.02 20.71 5.63L18.37 3.29C17.98 2.9 17.35 2.9 16.96 3.29L15.12 5.13L18.87 8.88L20.71 7.04Z" fill="currentColor"/>
						</svg>
					</button>
				</div>
				<div class="otp-input-container">
					<template for:each={otpInputs} for:item="input">
						<input
							key={input.id}
							type="text"
							class="otp-input"
							maxlength="1"
							value={input.value}
							data-index={input.id}
							oninput={handleOTPInput}
							onkeydown={handleOTPKeyDown}
							onpaste={handleOTPPaste}
						/>
					</template>
				</div>
				<div class="otp-timer-section">
					<template if:true={canResend}>
						<span class="resend-text">Did not receive it yet? <button type="button" class="resend-link" onclick={handleResendOTP}>Resend OTP</button></span>
					</template>
					<template if:false={canResend}>
						<span class="timer-text">Resend OTP in <span class="timer-value">{timerDisplay}</span></span>
					</template>
				</div>
				<div style="margin-top: 25px;">
					<lightning-button
						variant="brand"
						disable-animation="true"
						label="Verify"
						type="submit"
						onclick={handleVerifyOTP}
						stretch
						class="studentportal-BlueButtonLogin"
					></lightning-button>
				</div>
				<!-- <div class="powered-by-section">
					<span class="powered-by-text">Powered by</span>
					<img src={kenPoweredbyLogo} alt="ken42" class="ken42-logo-image" />
				</div> -->
			</div>
		</template>

		<!-- Step 3: New Password Form -->
		<template if:true={showPasswordStep}>
			<p class="reset-title">Reset your password</p>
			<p class="reset-subtitle">Set a new password to continue. If you are using a temporary password, this step is required.</p>
			<div class="slds-grid slds-wrap">
				<div class="slds-col slds-size_1-of-1">
					<div class="field-label">New Password</div>
					<div class="password-input-container">
						<lightning-input
							class="studentportalInputsLogin password-input"
							id="newPassword"
							label="New Password"
							type={newPasswordFieldType}
							placeholder="Enter your new password"
							data-id="newPassword"
							value={newPassword}
							variant="label-hidden"
							oninput={handleInputChange}
							onchange={handleInputChange}
							onblur={handleOnBlur}
							onkeyup={handleEnterKey}>
						</lightning-input>
						<template if:true={showNewPasswordToggle}>
							<button
								class={newPasswordToggleButtonClass}
								type="button"
								onclick={toggleNewPasswordVisibility}
								aria-label={newPasswordToggleLabel}
							>
								<lightning-icon icon-name={newPasswordIconName} size="x-small"></lightning-icon>
							</button>
						</template>
					</div>
				</div>
				<div class="slds-col slds-size_1-of-1">
					<div class="field-label">Re-enter New Password</div>
					<div class="password-input-container">
						<lightning-input
							class="studentportalInputsLogin password-input"
							id="confirmPassword"
							label="Re-enter New Password"
							type={confirmPasswordFieldType}
							placeholder="Re-enter your new password"
							data-id="confirmPassword"
							value={confirmPassword}
							variant="label-hidden"
							oninput={handleInputChange}
							onchange={handleInputChange}
							onblur={handleOnBlur}
							onkeyup={handleEnterKey}>
						</lightning-input>
						<template if:true={showConfirmPasswordToggle}>
							<button
								class={confirmPasswordToggleButtonClass}
								type="button"
								onclick={toggleConfirmPasswordVisibility}
								aria-label={confirmPasswordToggleLabel}
							>
								<lightning-icon icon-name={confirmPasswordIconName} size="x-small"></lightning-icon>
							</button>
						</template>
					</div>
				</div>
				<template if:true={errorMessage}>
					<div class="slds-text-color_error slds-m-bottom_medium error-message">{errorMessage}</div>
				</template>
			</div>
			<div style="margin-top: 25px;">
				<lightning-button
					variant="brand"
					disable-animation="true"
					label="Submit"
					type="submit"
					onclick={handleSubmitNewPassword}
					stretch
					class="studentportal-BlueButtonLogin"
				></lightning-button>
			</div>
			<div class="back-to-login">
				<button type="button" class="back-link" onclick={handleBackToLogin}>Back to Login</button>
			</div>
			<div class="register-link-section">
				<span class="register-link-text">Don't have an account? </span>
				<button type="button" class="register-link" onclick={handleRegister}>Register Now</button>
			</div>
			<!-- <div class="powered-by-section">
				<span class="powered-by-text">Powered by</span>
				<img src={kenPoweredbyLogo} alt="ken42" class="ken42-logo-image" />
			</div> -->
		</template>

		<div class="card-powered-by">
			<span class="card-powered-text">Powered by</span>
			<img src={kenPoweredbyLogo} alt="ken42" class="card-powered-logo" />
		</div>
	</div>
	<!-- Toast notifications -->
	<c-ken-toast-notification
		is-visible={isSuccessToastVisible}
		toast-title={successTitle}
		toast-message={successDescription}
		toast-variant="success">
	</c-ken-toast-notification>
	
	<c-ken-toast-notification
		is-visible={isErrorToastVisible}
		toast-title={errorTitle}
		toast-message={errorDescription}
		toast-variant="error">
	</c-ken-toast-notification>
</template>
