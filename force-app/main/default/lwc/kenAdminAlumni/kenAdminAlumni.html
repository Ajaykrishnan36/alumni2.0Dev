<template>
    <main class="content">

        <!-- Banner -->
        <div class="banner">
            <div class="banner-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </div>
            <div>
                <h1>Master Alumni Data</h1>
                <p>One row per alumnus, merged from historical uploads, the old portal, the new portal, leads, referrals, student transitions, and staff entries.</p>
            </div>
        </div>

        <!-- Dashboard filter banner -->
        <template lwc:if={hasDashboardFilter}>
            <div class="dash-filter-banner">
                <div class="dash-filter-text">
                    <span class="dash-filter-tag">Filtered from Dashboard</span>
                    <span class="dash-filter-label">{dashboardFilterLabel}</span>
                </div>
                <button class="dash-filter-clear" onclick={handleClearDashboardFilter}>Clear filter</button>
            </div>
        </template>

        <!-- Alumni tabs -->
        <div class="alumni-tab-row">
            <div class="alumni-tabs">
                <div class={cAll} data-tab="all" onclick={handleTab}>All Master Records <span class="count">{countAll}</span></div>
                <div class={cRecent} data-tab="recent" onclick={handleTab}>Recently Joined <span class="count">{countRecent}</span></div>
                <div class={cRegistered} data-tab="registered" onclick={handleTab}>Registered Alumni <span class="count">{countRegistered}</span></div>
                <div class={cUnregistered} data-tab="unregistered" onclick={handleTab}>Un-registered Alumni <span class="count">{countUnregistered}</span></div>
                <div class={cOldPortal} data-tab="oldportal" onclick={handleTab}>Old Portal Records <span class="count">{countOldPortal}</span></div>
                <div class={cIssues} data-tab="issues" onclick={handleTab}>Data Issues <span class="count">{countIssues}</span></div>
                <div class={cLeads} data-tab="leads" onclick={handleTab}>Leads <span class="count">{countLeads}</span></div>
                <div class={cReferrals} data-tab="referrals" onclick={handleTab}>Referrals <span class="count">{countReferrals}</span></div>
            </div>
        </div>

        <!-- ALL MASTER RECORDS -->
        <template lwc:if={isAll}>
            <div class="alumni-desc">Every alumni identity in the master database, regardless of portal status, source, or data quality.</div>
            <div class="filter-bar">
                <div class="search-input"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg><input placeholder="Search by name, email, registration number, program, batch, company, city, country, LinkedIn URL…" oninput={handleSearch}/></div>
                <template lwc:if={showPortalDropdown}>
                    <div class="filter-select">
                        <button type="button" class="ken-dd-trigger" onclick={handlePortalStatusToggle}>
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M22 3H2l8 9.46V19l4 2v-8.54z"></path></svg>
                            <span>{portalStatusLabel}</span>
                            <svg class="ken-dd-caret" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m6 9 6 6 6-6"></path></svg>
                        </button>
                        <template lwc:if={portalStatusOpen}>
                            <div class="ken-dd-menu">
                                <div class={portalStatusItemAll}     data-value=""           onclick={handlePortalStatusSelect}>All Portal Statuses</div>
                                <div class={portalStatusItemActive}  data-value="active"     onclick={handlePortalStatusSelect}>Active on New Portal</div>
                                <div class={portalStatusItemReg}     data-value="registered" onclick={handlePortalStatusSelect}>Registered on New Portal</div>
                                <div class={portalStatusItemNot}     data-value="not"        onclick={handlePortalStatusSelect}>Not on Portal</div>
                                <div class={portalStatusItemOld}     data-value="old"        onclick={handlePortalStatusSelect}>Old Portal Record</div>
                            </div>
                        </template>
                    </div>
                </template>
                <button type="button" class="ken-filters-btn" onclick={handleFiltersClick}>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M22 3H2l8 9.46V19l4 2v-8.54z"></path></svg>
                    <span>Filters</span>

                </button>

                </button>

            <div class="master-label">Master Data</div>
            <div class="master-count">{masterCountAll}</div>
            <div class="table-wrap">
                <table class="table">
                    <thead><tr><th>Name</th><th>Program &amp; Batch</th><th>Institution</th><th>Location</th><th>Role &amp; Company</th><th>Master Record</th><th>Portal</th><th>Source</th><th>Completeness</th><th>Last Updated</th></tr></thead>

                        </template>
                        <template lwc:if={isEmpty}>

                        <template for:each={rows} for:item="row">

                                <td><div class="cell-name"><div class="avatar-circle">{row.initials}</div><div class="meta"><div class="nm">{row.name}</div><div class={row.emailClass}>{row.emailDisplay}</div></div></div></td>
                                <td><div class="cell-stack"><div class="l1">{row.program}</div><div class="l2">Class of {row.batch} · {row.registrationNumber}</div></div></td>
                                <td><div class="cell-stack"><div class="l1">{row.institution}</div></div></td>
                                <td><div class="cell-stack"><div class="l1">{row.location}</div><div class="l2">{row.country}</div></div></td>
                                <td><div class="cell-stack"><div class="l1">{row.role}</div><div class="l2">{row.company}</div></div></td>
                                <td><span class={row.masterPillClass}>{row.masterRecordStatus}</span></td>
                                <td><span class={row.portalPillClass}>{row.portalStatus}</span></td>
                                <td><span class={row.sourcePillClass}>{row.sourceLabel}</span></td>
                                <td><div class="complete-cell"><div class="complete-bar"><div class={row.completenessFillClass} style={row.completenessStyle}></div></div><div class="complete-val">{row.completenessLabel}</div></div></td>
                                <td><div class="cell-stack"><div class="l1">{row.lastUpdatedLabel}</div></div></td>
                            </tr>
                        </template>

                </table>
            </div>
        </template>

                                <td><div class="cell-stack"><div class="l1">{row.location}</div><div class="l2">{row.country}</div></div></td>
                                <td><div class="cell-stack"><div class="l1">{row.role}</div><div class="l2">{row.company}</div></div></td>
                                <td><span class={row.masterPillClass}>{row.masterRecordStatus}</span></td>
                                <td><span class={row.portalPillClass}>{row.portalStatus}</span></td>
                                <td><span class={row.sourcePillClass}>{row.sourceLabel}</span></td>
                                <td><div class="complete-cell"><div class="complete-bar"><div class={row.completenessFillClass} style={row.completenessStyle}></div></div><div class="complete-val">{row.completenessLabel}</div></div></td>
                                <td><div class="cell-stack"><div class="l1">{row.lastUpdatedLabel}</div></div></td>
                            </tr>
                        </template>
                    </tbody>
                </table>
                <div class="table-foot">

                                <td><span class={row.masterPillClass}>{row.masterRecordStatus}</span></td>
                                <td><span class={row.portalPillClass}>{row.portalStatus}</span></td>

                        <div class="metric-cell"><div class="metric-l">Data Completeness</div><div class="metric-v">{detailCompleteness}</div></div>
                        <div class="metric-cell"><div class="metric-l">Engagement Score</div><div class="metric-v accent">{detailEngagement}</div></div>
                        <div class="metric-cell"><div class="metric-l">Last Login</div><div class="metric-v">{detailLastLogin}</div></div>
                    </div>

                    <div class="modal-tabs">
                        <div class={mtOverview}   data-mt="overview"   onclick={handleInnerTab}>Overview</div>
                        <div class={mtEducation}  data-mt="education"  onclick={handleInnerTab}>Education</div>
                        <div class={mtContact}    data-mt="contact"    onclick={handleInnerTab}>Contact</div>
                        <div class={mtCareer}     data-mt="career"     onclick={handleInnerTab}>Career</div>
                        <div class={mtPortal}     data-mt="portal"     onclick={handleInnerTab}>Portal</div>
                        <div class={mtEngagement} data-mt="engagement" onclick={handleInnerTab}>Engagement</div>
                        <div class={mtRequests}   data-mt="requests"   onclick={handleInnerTab}>Requests</div>
                        <div class={mtHistory}    data-mt="history"    onclick={handleInnerTab}>Update History</div>
                        <div class={mtActivity}   data-mt="activity"   onclick={handleInnerTab}>Activity</div>
                    </div>

                    <div class="modal-body">
                        <template lwc:if={isOverview}>
                            <div class="detail-card">
                                <div class="dc-title">Identity</div>
                                <div class="dc-grid">
                                    <div><div class="dc-field-label">Name</div><div class="dc-field-value">{detailName}</div></div>
                                    <div><div class="dc-field-label">Owner</div><div class="dc-field-value">Ken42 Ops</div></div>
                                    <div><div class="dc-field-label">Batch</div><div class="dc-field-value">{detailBatch}</div></div>
                                    <div><div class="dc-field-label">Program</div><div class="dc-field-value">{detailProgram}</div></div>
                                </div>
                            </div>
                            <div class="detail-card">
                                <div class="dc-title">Current Status</div>
                                <div class="dc-grid">
                                    <div><div class="dc-field-label">Company</div><div class="dc-field-value">{detailCompany}</div></div>
                                    <div><div class="dc-field-label">Location</div><div class="dc-field-value">{detailLocation}</div></div>
                                </div>
                            </div>
                            <div class="detail-card">
                                <div class="dc-title">Record Health</div>
                                <div class="dc-grid" style="grid-template-columns:repeat(3,1fr)">
                                    <div><div class="dc-field-label">Source</div><div style="margin-top:4px"><span class="pill violet">{detailSource}</span></div></div>
                                    <div><div class="dc-field-label">Verification</div><div style="margin-top:4px"><span class="pill info">Institution Verified</span></div></div>
                                    <div><div class="dc-field-label">Portal Activation</div><div style="margin-top:4px"><span class="pill success">Registered</span></div></div>
                                </div>
                            </div>
                        </template>

                        <template lwc:if={isEducation}>
                            <div class="detail-card">
                                <div class="dc-title">Academic Details</div>
                                <div class="dc-grid">
                                    <div><div class="dc-field-label">Program</div><div class="dc-field-value">{detailProgram}</div></div>
                                    <div><div class="dc-field-label">Department</div><div class="dc-field-value">{detailIndustry}</div></div>
                                    <div><div class="dc-field-label">Batch / Class <span class="badge-mini">Institution Controlled</span></div><div class="dc-field-value">{detailBatch}</div></div>
                                    <div><div class="dc-field-label">Registration Number <span class="badge-mini">Institution Controlled</span></div><div class="dc-field-value">{detailRegNumber}</div></div>
                                </div>
                            </div>
                        </template>

                        <template lwc:if={isContact}>
                            <div class="detail-card">
                                <div class="dc-title">Contact Information</div>
                                <div class="dc-grid">
                                    <div><div class="dc-field-label">Email Address</div><div class="dc-field-value">{detailEmail}</div></div>
                                    <div><div class="dc-field-label">Phone Number</div><div class="dc-field-value">{detailPhone}</div></div>
                                    <div style="grid-column:1/-1"><div class="dc-field-label">LinkedIn Profile</div><div class="dc-field-value link">{detailLinkedin}</div></div>
                                </div>
                            </div>
                            <div class="detail-card">
                                <div class="dc-title">Communication Preferences</div>
                                <div class="kv-row"><span class="k">Email Visible</span><span><span class={emailVisibilityPillClass}>{emailVisibilityLabel}</span></span></div>
                                <div class="kv-row"><span class="k">Phone Visible</span><span><span class={phoneVisibilityPillClass}>{phoneVisibilityLabel}</span></span></div>
                            </div>
                        </template>

                        <template lwc:if={isCareer}>
                            <div class="detail-card">
                                <div class="dc-title">Current Role</div>
                                <div class="dc-grid">
                                    <div style="grid-column:1/-1"><div class="dc-field-label">Company</div><div class="dc-field-value" style="font-size:18px;font-weight:700">{detailCompany}</div></div>
                                    <div><div class="dc-field-label">Job Function / Title</div><div class="dc-field-value">{detailRole}</div></div>
                                    <div><div class="dc-field-label">Industry</div><div class="dc-field-value">{detailIndustry}</div></div>
                                    <div><div class="dc-field-label">Seniority Level</div><div class="dc-field-value">Senior</div></div>
                                </div>
                            </div>
                        </template>

                        <template lwc:if={isPortal}>
                            <div class="detail-card">
                                <div class="dc-title">Portal Lifecycle</div>
                                <div class="kv-row"><span class="k">Invited Date</span><span class="v">—</span></div>
                                <div class="kv-row"><span class="k">Link Opened</span><span class="v">—</span></div>
                                <div class="kv-row"><span class="k">Registered Date</span><span class="v">{detailRegistrationDate}</span></div>
                                <div class="kv-row"><span class="k">Questionnaire Status</span><span class="v">—</span></div>
                                <div class="kv-row"><span class="k">Last Login</span><span class="v">{detailLastLogin}</span></div>
                            </div>
                        </template>

                        <template lwc:if={isEngagement}>
                            <div class="detail-card">
                                <div class="dc-title">Interests &amp; Preferences</div>
                                <template lwc:if={hasDetailInterests}>
                                    <div class="chips-row">
                                        <template for:each={detailInterests} for:item="interest">
                                            <span key={interest} class="interest-chip">{interest}</span>
                                        </template>
                                    </div>
                                </template>
                                <template lwc:else>
                                    <div class="empty-state">No interests selected.</div>
                                </template>
                                <div class="subsec-label" style="margin-top:24px">Engagement Signals</div>
                                <div class="chips-row">
                                    <span class="signal-chip">{engagementScoreLabel}</span>
                                </div>
                            </div>
                        </template>

                        <template lwc:if={isRequests}>
                            <div class="detail-card">
                                <div class="dc-title">Forms &amp; Requests Sent</div>
                                <div class="empty-state">No active requests for this alumni.</div>
                            </div>
                        </template>

                        <template lwc:if={isHistory}>
                            <div class="detail-card">
                                <div class="dc-title">Field Update History</div>
                                <template lwc:if={hasHistoryRows}>
                                    <table class="history-table">
                                        <thead><tr><th>Date</th><th>Field</th><th>Previous Value</th><th>New Value</th><th>Source</th><th>Updated By</th></tr></thead>
                                        <tbody>
                                            <template for:each={historyRows} for:item="h">
                                                <tr key={h.key}>
                                                    <td>{h.dateLabel}</td>
                                                    <td>{h.field}</td>
                                                    <td class="strike">{h.previousValue}</td>
                                                    <td class="new">{h.newValue}</td>
                                                    <td><span class="source-tag">{h.sourceTag}</span></td>
                                                    <td>{h.updatedBy}</td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </template>
                                <template lwc:else>
                                    <div class="empty-state">No tracked field changes yet.</div>
                                </template>
                            </div>
                        </template>

                        <template lwc:if={isActivity}>
                            <div class="detail-card">
                                <div class="dc-title">Activity Timeline</div>
                                <template lwc:if={hasTimelineRows}>
                                    <div class="timeline">
                                        <template for:each={timelineRows} for:item="t">
                                            <div class="tl-item" key={t.key}>
                                                <div class="tl-title">{t.title}</div>
                                                <div class="tl-meta"><span class="tl-tag">{t.actor}</span><span>{t.dateLabel}</span></div>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                                <template lwc:else>
                                    <div class="empty-state">No activity recorded yet.</div>
                                </template>
                            </div>
                        </template>
                    </div>
                    </template>
                </div>
            </div>
        </div>
    </template>

    <!-- ============================================================
         MODAL: DATA ISSUES — fix-in-place panel
         ============================================================ -->
    <template lwc:if={showIssuesModal}>
        <div class={overlayClass} onclick={handleOverlayClick}>
            <div class="modal modal-narrow">
                <div class="modal-scroll" style="padding:32px 36px 28px;position:relative">
                    <div class="modal-close" onclick={handleClose}>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 6 6 18M6 6l12 12"></path></svg>
                    </div>
                    <div class="unmerged-eyebrow"><span class="state">DATA ISSUES</span><span class="dot"></span>FIX IN PLACE</div>
                    <div class="person-header" style="margin-top:14px">
                        <div class="person-avatar">{personInitials}</div>
                        <div>
                            <h2>{personName}</h2>
                            <div class="person-sub">{issueDetailSub}</div>
                            <div class="status-chips">
                                <span class="chip-outline danger">{issuesRemainingLabel}</span>
                            </div>
                        </div>
                    </div>

                    <div class="detail-card" style="margin-top:18px">
                        <div class="dc-title" style="display:flex;align-items:center;gap:8px;color:var(--c-rose-700)">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="13"></line><line x1="12" y1="16" x2="12" y2="16.5"></line></svg>
                            Email address
                        </div>
                        <template lwc:if={issueEmailMissing}>
                            <div class="kv-row" style="color:var(--c-rose-700)"><span class="k" style="color:var(--c-rose-700)">●</span><span>Email is missing</span></div>
                        </template>
                        <template lwc:if={issueEmailBounced}>
                            <div class="kv-row" style="color:var(--c-rose-700)"><span class="k" style="color:var(--c-rose-700)">●</span><span>Email has hard-bounced</span></div>
                        </template>
                        <input class="filter-native" style="width:100%;padding:10px 12px;border:1px solid var(--slate-200);border-radius:8px;font-size:13px;margin-top:8px" placeholder="name@example.com" value={issueEmailValue} oninput={handleIssueEmailInput} />
                        <div class="kv-row" style="margin-top:10px;justify-content:space-between">
                            <span class="k" style="color:var(--slate-500);font-size:11.5px">{issueEmailFootnote}</span>
                            <button class="btn-secondary" onclick={handleSaveEmail} disabled={isSavingEmail}>Save email</button>
                        </div>
                        <template lwc:if={issueEmailError}>
                            <div class="kv-row" style="color:var(--c-rose-700)"><span>{issueEmailError}</span></div>
                        </template>
                    </div>

                    <div class="detail-card" style="margin-top:14px">
                        <div class="dc-title" style="display:flex;align-items:center;gap:8px;color:var(--c-rose-700)">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="13"></line><line x1="12" y1="16" x2="12" y2="16.5"></line></svg>
                            Phone number
                        </div>
                        <template lwc:if={issuePhoneMissing}>
                            <div class="kv-row" style="color:var(--c-rose-700)"><span class="k" style="color:var(--c-rose-700)">●</span><span>Phone number is missing</span></div>
                        </template>
                        <input class="filter-native" style="width:100%;padding:10px 12px;border:1px solid var(--slate-200);border-radius:8px;font-size:13px;margin-top:8px" placeholder="+91 98765 43210" value={issuePhoneValue} oninput={handleIssuePhoneInput} />
                        <div class="kv-row" style="margin-top:10px;justify-content:space-between">
                            <span class="k" style="color:var(--slate-500);font-size:11.5px">Include country code. Format will be re-validated on save.</span>
                            <button class="btn-secondary" onclick={handleSavePhone} disabled={isSavingPhone}>Save phone</button>
                        </div>
                        <template lwc:if={issuePhoneError}>
                            <div class="kv-row" style="color:var(--c-rose-700)"><span>{issuePhoneError}</span></div>
                        </template>
                    </div>

                    <div class="merge-foot" style="margin-top:18px">
                        <span class="merge-create" onclick={handleOpenFullProfile}>Open full profile instead</span>
                        <span class="merge-reject">Mark as unreachable</span>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- ============================================================
         MODAL: LEAD / REFERRAL WORKSPACE (unified — both surface a Lead Id)
         ============================================================ -->
    <template lwc:if={showWorkspaceModal}>
        <div class={overlayClass} onclick={handleOverlayClick}>
            <div class={leadModalClass}>
                <div class="modal-scroll" style="padding:0;position:relative">
                    <div class="modal-close" onclick={handleClose}>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 6 6 18M6 6l12 12"></path></svg>
                    </div>

                    <template lwc:if={isNewRoleLead}>
                        <div style="padding:40px 36px 32px">
                        <div class="merge-panel">
                            <div class="merge-title">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 5v14M5 12h14"></path></svg>
                                New role for an existing alumnus
                            </div>
                            <div class="merge-desc">This isn't a new lead to merge — it's a new role / education added by an existing alumnus, already linked to their master profile. Approve to add the role, or reject it.</div>
                            <div class="merge-item">
                                <div class="avatar-circle">{personInitials}</div>
                                <div class="info"><div class="nm">{capturedExistingAccountName}</div><div class="det">Existing alumnus · linked account</div></div>
                                <button class="merge-btn" onclick={handleViewExistingProfile}>View profile</button>
                            </div>
                            <div class="merge-foot" style="display:flex;align-items:center;justify-content:space-between;gap:12px">
                                <span class="merge-reject" onclick={handleRejectLead}>Reject</span>
                                <button class="merge-btn" style="background:var(--primary-color,#1f3b8f);color:#fff;border-color:transparent" onclick={handleApproveRole}>Approve role</button>
                            </div>
                        </div>
                        </div>
                    </template>

                    <template lwc:else>
                        <div class="lead-ws">
                            <aside class="lead-rail">
                                <div class="lead-railhead">
                                    <div class="idrow">
                                        <div class="avatar-circle">{railInitials}</div>
                                        <div>
                                            <h3>{railName}</h3>
                                            <div class="sub">{railSubLine}</div>
                                        </div>
                                    </div>
                                    <div class="lead-railpills">
                                        <span class="pill teal">{recordKindLabel}</span>
                                        <span class="pill warn">Unmerged</span>
                                        <template lwc:if={capturedSource}><span class="pill neutral">{capturedSource}</span></template>
                                    </div>
                                </div>
                                <div class="lead-datablk">
                                    <div class="h">Captured</div>
                                    <div class="lead-kv">
                                        <div class="r"><span class="k">Institute</span><span class="v">{railInstitute}</span></div>
                                        <div class="r"><span class="k">Programme</span><span class="v">{railProgram}</span></div>
                                        <div class="r"><span class="k">Registration no.</span><span class="v muted">{capturedRegNumber}</span></div>
                                        <div class="r"><span class="k">Year of enrollment</span><span class="v">{railYearOfEnrollment}</span></div>
                                        <div class="r"><span class="k">Year of graduation</span><span class="v">{capturedGradYear}</span></div>
                                        <div class="r"><span class="k">Referred by</span><span class="v muted">{capturedReferredBy}</span></div>
                                    </div>
                                </div>
                                <div class="lead-datablk">
                                    <div class="h">Contact</div>
                                    <div class="lead-kv">
                                        <div class="r"><span class="k">Email</span>
                                            <template lwc:if={railEmail}><span class="v">{railEmail}</span></template>
                                            <template lwc:else><span class="v missing">missing</span></template>
                                        </div>
                                        <div class="r"><span class="k">Phone</span>
                                            <template lwc:if={railPhone}><span class="v">{railPhone}</span></template>
                                            <template lwc:else><span class="v missing">missing</span></template>
                                        </div>
                                    </div>
                                </div>
                                <div class="lead-datablk">
                                    <div class="h">Lifecycle &amp; ownership</div>
                                    <div class="lead-kv">
                                        <div class="r"><span class="k">Registration status</span><span class="v">{railStatusLabel}</span></div>
                                        <div class="r"><span class="k">Owner</span><span class="v">{ownerName}</span></div>
                                        <div class="r"><span class="k">Created</span><span class="v">{railCreated}</span></div>
                                    </div>
                                </div>
                            </aside>

                            <div class="lead-canvas">
                                <div class="lead-topbar">
                                    <div class="lead-seg">
                                        <div class={ltMerge} data-lt="merge" onclick={handleLeadTab}>Merge &amp; Lookup</div>
                                        <div class={ltActivity} data-lt="activity" onclick={handleLeadTab}>Activity <span class="b">{timelineCount}</span></div>
                                        <div class={ltComm} data-lt="comm" onclick={handleLeadTab}>Communication <span class="b">{commCount}</span></div>
                                        <div class={ltOwner} data-lt="owner" onclick={handleLeadTab}>Change Owner</div>
                                        <div class={ltHistory} data-lt="history" onclick={handleLeadTab}>Field history</div>
                                    </div>
                                    <div class="lead-actionbar">
                                        <button class="la-btn ok" onclick={handleVerifyLead} disabled={isConverting}>
                                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6 9 17l-5-5"></path></svg>
                                            Convert
                                        </button>
                                        <button class="la-btn danger" onclick={handleRejectLead} disabled={isRejecting}>
                                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"></path></svg>
                                            Reject
                                        </button>
                                    </div>
                                </div>

                                <div class="lead-pane">
                                    <template lwc:if={isLeadTabMerge}>
                        <template lwc:if={mergeReviewActive}>
                            <div class="merge-panel">
                                <div class="merge-top-row">
                                    <button class="merge-back-top" onclick={handleBackToMergeCandidates}>
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"></path></svg>
                                        Back to candidates
                                    </button>
                                    <div class="compare-bulk-actions">
                                        <button type="button" class="btn-secondary" onclick={handleUseAllExisting}>Use all Existing</button>
                                        <button type="button" class="btn-secondary" onclick={handleUseAllIncoming}>Use all Incoming</button>
                                    </div>
                                </div>
                                <div class="merge-title">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 6 9 17l-5-5"></path></svg>
                                    Review merge
                                </div>
                                <div class="merge-desc">Merging into <strong>{mergeReviewMasterName}</strong></div>
                                <template lwc:if={mergeReviewLoading}>
                                    <div class="empty-state">Loading comparison…</div>
                                </template>
                                <template lwc:else>
                                    <div class="compare-card">
                                        <div class="compare-head">
                                            <span>Field</span>
                                            <span>Existing</span>
                                            <span>Incoming</span>
                                            <span class="result">Merged</span>
                                        </div>
                                        <template for:each={mergeReviewRows} for:item="row">
                                            <div key={row.fieldKey} class={row.rowClass}>
                                                <div class="field-name">{row.label}</div>
                                                <button type="button" class={row.existingPillClass} data-field={row.fieldKey} data-side="existing" onclick={handlePickSide}>{row.existingValue}</button>
                                                <button type="button" class={row.incomingPillClass} data-field={row.fieldKey} data-side="incoming" onclick={handlePickSide}>{row.incomingValue}</button>
                                                <div class="merged-value">{row.mergedValue}</div>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                                <div class="merge-foot" style="justify-content:flex-end">
                                    <button class="merge-btn merge-btn-primary" onclick={handleConfirmMerge} disabled={isMerging}>Merge</button>
                                </div>
                            </div>
                        </template>
                        <template lwc:else>
                            <template lwc:if={mergeMultiReviewActive}>
                                <div class="merge-panel">
                                    <button class="merge-back-top" onclick={handleBackFromMultiReview}>
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"></path></svg>
                                        Back to candidates
                                    </button>
                                    <div class="merge-title">
                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 6 9 17l-5-5"></path></svg>
                                        Compare candidates
                                    </div>
                                    <div class="merge-target-row">
                                        <label class="merge-target-label" for="mergeTargetSelectLead">Merge into</label>
                                        <select id="mergeTargetSelectLead" class="merge-target-select" onchange={handleMultiTargetChange}>
                                            <option value="" selected={isNoMultiTargetSelected}>Choose a candidate…</option>
                                            <template for:each={multiTargetOptions} for:item="opt">
                                                <option key={opt.key} value={opt.key} selected={opt.isSelected}>{opt.label}</option>
                                            </template>
                                        </select>
                                        <button class="merge-btn merge-btn-primary merge-target-btn" disabled={isMultiMergeDisabled} title={multiMergeButtonTitle} onclick={handleConfirmMultiMerge}>Merge</button>
                                    </div>
                                    <template lwc:if={mergeMultiReviewLoading}>
                                        <div class="empty-state">Loading comparison…</div>
                                    </template>
                                    <template lwc:else>
                                        <div class="multi-compare-scroll">
                                            <div class="multi-compare-row multi-compare-head">
                                                <div class="multi-compare-label-col">Field</div>
                                                <div class="multi-compare-col multi-compare-incoming">New Lead</div>
                                                <template for:each={mergeMultiReviewMasterNames} for:item="master">
                                                    <div key={master.key} class="multi-compare-col">
                                                        <div>
                                                            <div>{master.name}</div>
                                                            <div class="multi-compare-id">{master.key}</div>
                                                        </div>
                                                    </div>
                                                </template>
                                                <div class="multi-compare-col multi-compare-merged-head">Merged</div>
                                            </div>
                                            <template for:each={mergeMultiReviewRows} for:item="row">
                                                <div key={row.fieldKey} class="multi-compare-row">
                                                    <div class="multi-compare-label-col">{row.label}</div>
                                                    <template for:each={row.sources} for:item="src">
                                                        <button type="button" key={src.key} class={src.pillClass} data-field={row.fieldKey} data-source={src.key} onclick={handlePickMultiSide}>{src.value}</button>
                                                    </template>
                                                    <div class="multi-compare-col multi-compare-merged">{row.mergedValue}</div>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </template>
                            <template lwc:else>
                                <div class="merge-panel">
                                    <div class="merge-title">
                                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 7a4 4 0 0 0 8 0M12 21V11"></path><circle cx="6" cy="20" r="2"></circle><circle cx="18" cy="20" r="2"></circle></svg>
                                        Find &amp; merge with master record
                                    </div>
                                    <div class="merge-desc">This record cannot be used until it is merged with a master alumni identity. Suggestions below are matched by registration number, name, email, or phone — or search directly.</div>
                                    <div class="merge-search">
                                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
                                        <input value={mergeSearchTerm} oninput={handleMergeSearch} />
                                    </div>
                                    <template lwc:if={isMergeLoading}>
                                        <div class="empty-state">Searching…</div>
                                    </template>
                                    <template lwc:if={isMergeEmpty}>
                                        <div class="empty-state">No candidates found.</div>
                                    </template>
                                    <template lwc:if={hasMergeRows}>
                                        <label class="merge-select-all">
                                            <input type="checkbox" checked={isAllCandidatesSelected} onchange={handleToggleSelectAllCandidates} />
                                            Select all
                                        </label>
                                    </template>
                                    <div class="merge-list">
                                        <template for:each={mergeRows} for:item="cand">
                                            <div key={cand.alumniId} class="merge-item">
                                                <input type="checkbox" class="merge-item-check" data-id={cand.alumniId} checked={cand.selected} onchange={handleToggleCandidate} />
                                                <div class="avatar-circle">{cand.initials}</div>
                                                <div class="info">
                                                    <div class="nm">{cand.name}
                                                        <template lwc:if={cand.matchLabel}><span class="merge-match-badge">{cand.matchLabel}</span></template>
                                                    </div>
                                                    <div class="det">{cand.detail}</div>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                    <div class="merge-foot" style="justify-content:flex-end">
                                        <button class="merge-btn merge-btn-primary" disabled={isCompareDisabled} onclick={handleCompareSelected}>{compareButtonLabel}</button>
                                    </div>
                                </div>
                            </template>
                        </template>
                                    </template>

                                    <template lwc:if={isLeadTabActivity}>
                                        <div class="detail-card">
                                            <div class="dc-title">Activity Timeline</div>
                                            <template lwc:if={hasTimelineRows}>
                                                <div class="ltl">
                                                    <template for:each={timelineRows} for:item="t">
                                                        <div class={t.nodeClass} key={t.key}>
                                                            <span class="ltl-node"></span>
                                                            <div class="ltl-title">{t.title}</div>
                                                            <div class="ltl-meta"><span class="ltl-who">{t.actor}</span><span>·</span><span>{t.dateLabel}</span></div>
                                                            <template lwc:if={t.hasBody}><div class="ltl-body">{t.body}</div></template>
                                                        </div>
                                                    </template>
                                                </div>
                                            </template>
                                            <template lwc:else>
                                                <div class="empty-state">No activity recorded yet.</div>
                                            </template>
                                        </div>
                                    </template>

                                    <template lwc:if={isLeadTabComm}>
                                        <div class="detail-card">
                                            <div class="dc-title">Communicate</div>
                                            <div class="comm-channels">
                                                <button class={chanEmail} data-ch="email" onclick={handleCommChannel}>Email</button>
                                                <button class={chanSms} data-ch="sms" onclick={handleCommChannel}>SMS</button>
                                                <button class={chanCall} data-ch="call" onclick={handleCommChannel}>Log call</button>
                                                <button class={chanNote} data-ch="note" onclick={handleCommChannel}>Note</button>
                                            </div>
                                            <div class="comm-composer">
                                                <div class="cc-field">
                                                    <label class="cc-label">{commSubjectLabel}</label>
                                                    <input class="cc-input" value={commSubject} oninput={handleCommSubjectInput} placeholder="Short summary" />
                                                </div>
                                                <div class="cc-field">
                                                    <label class="cc-label">{commBodyLabel}</label>
                                                    <textarea class="cc-area" oninput={handleCommBodyInput} placeholder="What was said…">{commBody}</textarea>
                                                </div>
                                                <div class="cc-foot">
                                                    <span class="cc-hint">Recorded on this lead's activity as a Task.</span>
                                                    <button class="merge-btn merge-btn-primary" disabled={isCommDisabled} onclick={handleLogComm}>{commLogButtonLabel}</button>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="detail-card">
                                            <div class="dc-title">Outreach Log · {commCount}</div>
                                            <template lwc:if={hasCommLog}>
                                                <template for:each={commLogRows} for:item="c">
                                                    <div class="comm-logrow" key={c.key}>
                                                        <div class={c.iconClass}></div>
                                                        <div class="clr-meat">
                                                            <div class="clr-l1">{c.title}<span class="pill neutral">{c.channel}</span></div>
                                                            <template lwc:if={c.hasBody}><div class="clr-body">{c.body}</div></template>
                                                            <div class="clr-l2">by {c.actor} · {c.dateLabel} · {c.status}</div>
                                                        </div>
                                                    </div>
                                                </template>
                                            </template>
                                            <template lwc:else>
                                                <div class="empty-state">No communications logged yet.</div>
                                            </template>
                                        </div>
                                    </template>

                                    <template lwc:if={isLeadTabOwner}>
                                        <div class="detail-card">
                                            <div class="dc-title">Change Owner</div>
                                            <div class="owner-current">
                                                <div class="avatar-circle">{ownerInitials}</div>
                                                <div class="oc-meat">
                                                    <div class="oc-name">{ownerName}<template lwc:if={ownerTypeLabel}><span class="pill neutral">{ownerTypeLabel}</span></template></div>
                                                    <div class="oc-sub">Current owner</div>
                                                </div>
                                            </div>
                                            <div class="oa-search">
                                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
                                                <input value={ownerSearchTerm} oninput={handleOwnerSearch} placeholder="Search people &amp; queues" />
                                            </div>
                                            <template lwc:if={hasOwnerOptions}>
                                                <div class="oa-list">
                                                    <template for:each={ownerOptionRows} for:item="o">
                                                        <div class={o.itemClass} key={o.id} data-id={o.id} onclick={handleSelectNewOwner}>
                                                            <div class={o.avatarClass}>{o.initials}</div>
                                                            <div class="oa-meat"><div class="oa-name">{o.name}</div><div class="oa-sub">{o.subtitle}</div></div>
                                                            <template lwc:if={o.showCheck}><span class="oa-check">✓</span></template>
                                                        </div>
                                                    </template>
                                                </div>
                                            </template>
                                            <template lwc:else>
                                                <div class="empty-state">No matching people or queues.</div>
                                            </template>
                                            <input class="cc-input" style="margin-top:12px" value={ownerReason} oninput={handleOwnerReasonInput} placeholder="Reason for change (optional) — added to activity" />
                                            <div class="cc-foot">
                                                <span class="cc-hint">Reassigns ownership and logs the change to activity.</span>
                                                <button class="merge-btn merge-btn-primary" disabled={isReassignDisabled} onclick={handleReassign}>Reassign</button>
                                            </div>
                                        </div>
                                    </template>

                                    <template lwc:if={isLeadTabHistory}>
                                        <div class="detail-card">
                                            <div class="dc-title">Field Update History</div>
                                            <template lwc:if={hasHistoryRows}>
                                                <table class="history-table">
                                                    <thead><tr><th>Date</th><th>Field</th><th>Previous Value</th><th>New Value</th><th>Source</th><th>Updated By</th></tr></thead>
                                                    <tbody>
                                                        <template for:each={historyRows} for:item="h">
                                                            <tr key={h.key}>
                                                                <td>{h.dateLabel}</td>
                                                                <td>{h.field}</td>
                                                                <td>{h.previousValue}</td>
                                                                <td>{h.newValue}</td>
                                                                <td>{h.sourceTag}</td>
                                                                <td>{h.updatedBy}</td>
                                                            </tr>
                                                        </template>
                                                    </tbody>
                                                </table>
                                            </template>
                                            <template lwc:else>
                                                <div class="empty-state">No field updates recorded yet.</div>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </template>

    <!-- ───── Alumni 360 full-screen view (replaces the row modal) ───────── -->
    <template lwc:if={showAlumni360}>
        <div class="alumni360-fullscreen">
            <div class="alumni360-topbar">
                <button type="button" class="alumni360-back" onclick={handleClose360} aria-label="Back to Master Records">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
                    <span>Back to Master Records</span>
                </button>
                <span class="alumni360-title">Alumni 360</span>
            </div>
            <div class="alumni360-shell">
                <c-ken-admin-alumni360 record-id={selectedAlumniId} initial-tab={alumni360Tab}
                    onclose={handleClose360} ontabchange={handleAlumni360TabChange}></c-ken-admin-alumni360>
            </div>
        </div>
    </template>
</template>
