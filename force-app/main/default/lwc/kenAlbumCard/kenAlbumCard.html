<template>
    <div class="album-card">
        <template if:true={isOwner}>
            <button
                class="menu-button"
                type="button"
                onclick={handleMenuClick}
                title="More options"
            >
                <lightning-icon
                    icon-name="utility:threedots"
                    size="x-small"
                    alternative-text="Menu"
                    class="menu-icon"
                ></lightning-icon>
            </button>

            <template if:true={showMenu}>
                <div class="menu-dropdown">
                    <div
                        class="menu-item"
                        data-action="edit"
                        onclick={handleMenuAction}
                    >
                        Edit
                    </div>
                    <div
                        class="menu-item"
                        data-action="delete"
                        onclick={handleMenuAction}
                    >
                        Delete
                    </div>
                </div>
            </template>
        </template>

        <!-- Album Header -->
        <div class="album-header">
            <h3 class="album-name" onclick={handleAlbumClick}>{albumName}</h3>
            <p class="album-date">Last updated on: {lastUpdatedDate}</p>
        </div>

        <!-- Cover is the album's most recent upload, resolved in Apex. Three
             distinct states: a real image, document art when the newest upload
             is a file, and the "No files yet" art only when the album is
             genuinely empty. -->
        <div class="album-cover" onclick={handleAlbumClick}>
            <img
                src={coverImageUrl}
                alt={albumName}
                class="cover-image"
                data-cover-image="true"
            />
            <template if:true={showCoverFileName}>
                <div class="cover-filename-badge">{coverFileName}</div>
            </template>
        </div>

        <!-- Album Footer -->
        <div class="album-footer">
            <div class="owner-info">
                <div class="owner-avatar-container">
                    <img
                        src={ownerProfileImageUrl}
                        alt={ownerName}
                        class="owner-avatar"
                        data-profile-image="true"
                        onerror={handleAvatarError}
                    />
                </div>
                <span class="owner-name">{ownerName}</span>
                <template if:true={isLinked}>
                    <lightning-icon
                        icon-name="utility:new_window"
                        size="xx-small"
                        class="linked-icon"
                        alternative-text="Linked to external folder"
                        title="Linked to external folder"
                    ></lightning-icon>
                </template>
            </div>
            <template if:true={hasPhotos}>
                <div class="collaborators-info">
                    <lightning-icon
                        icon-name="utility:image"
                        size="xx-small"
                        class="collaborators-icon"
                    ></lightning-icon>
                    <span class="collaborators-count">{photoCountLabel}</span>
                </div>
            </template>
        </div>
    </div>
</template>
