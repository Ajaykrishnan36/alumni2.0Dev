<template>
    <template if:true={showModal}>
        <div class="modal-overlay" onclick={handleOverlayClick}>
            <div class="modal-container" onclick={handleModalClick}>
                <div class="modal-content">
                    <h2 class="modal-title">Create new album</h2>

                    <div class="mode-tabs">
                        <div
                            class={nameTabClass}
                            data-mode="name"
                            onclick={handleModeSelect}
                        >
                            Create Album
                        </div>
                        <div
                            class={linkTabClass}
                            data-mode="link"
                            onclick={handleModeSelect}
                        >
                            Paste Drive Link
                        </div>
                    </div>

                    <div class="form-container">
                        <!-- Album Name -->
                        <template if:true={isNameMode}>
                            <div class="form-field">
                                <label class="field-label">Album name<span class="required">*</span></label>
                                <lightning-input
                                    type="text"
                                    label="Album name"
                                    variant="label-hidden"
                                    placeholder="Name your album"
                                    value={albumName}
                                    onchange={handleAlbumNameChange}
                                    required
                                ></lightning-input>
                            </div>
                        </template>

                        <!-- Drive Link -->
                        <template if:true={isLinkMode}>
                            <div class="form-field">
                                <label class="field-label">Drive link<span class="required">*</span></label>
                                <lightning-input
                                    type="url"
                                    label="Drive link"
                                    variant="label-hidden"
                                    placeholder="https://drive.google.com/..."
                                    value={driveLink}
                                    onchange={handleDriveLinkChange}
                                    required
                                ></lightning-input>
                                <template if:true={showLinkError}>
                                    <p class="field-error">Please enter a valid link starting with http:// or https://.</p>
                                </template>
                                <p class="field-hint">The album is created as "Untitled Folder" — you can rename it anytime from the album's Edit menu.</p>
                            </div>
                        </template>
                    </div>

                    <!-- Action Buttons -->
                    <div class="modal-actions">
                        <lightning-button
                            variant="neutral"
                            label="Cancel"
                            onclick={handleCancel}
                            class="cancel-button"
                        ></lightning-button>
                        <lightning-button
                            variant="brand"
                            label="Create"
                            onclick={handleCreate}
                            class="create-button"
                            disabled={isFormInvalid}
                        ></lightning-button>
                    </div>
                </div>
            </div>
        </div>
    </template>
</template>
