<template>
    <header class="re-head">
        <div>
            <h1 class="re-title">Registered Events</h1>
            <p class="re-crumb">Home &rsaquo; Events</p>
        </div>
    </header>

    <div class="re-bar">
        <nav class="tabs">
            <template for:each={tabs} for:item="t">
                <button key={t.key} type="button" class={t.cssClass} data-key={t.key} onclick={handleTab}>{t.label}</button>
            </template>
        </nav>
        <div class="re-search">
            <svg class="re-search__icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="search" class="re-search__input" placeholder="Search" value={searchTerm} oninput={handleSearch}/>
            <svg class="re-search__mic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
        </div>
    </div>

    <template lwc:if={hasEvents}>
        <div class="cards">
            <template for:each={visibleEvents} for:item="e">
                <article key={e.id} class="card">
                    <div class="card__img">
                        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#9aa0a6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><path d="M21 15l-5-5L5 21"></path></svg>
                    </div>

                    <div class="card__body">
                        <h3 class="card__title">{e.title}</h3>
                        <p class="card__meta">{e.metaLine}</p>
                        <div class="card__stats">
                            <span class="stat">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path></svg>
                                Participants: <b>{e.participants}</b>
                            </span>
                            <span class="stat">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg>
                                Amount Paid: <b>{e.amountPaid}</b>
                            </span>
                        </div>
                    </div>

                    <div class="card__right">
                        <!-- status badge -->
                        <template lwc:if={e.isUpcoming}>
                            <span class="badge badge--live"><span class="dot"></span>Happening now!</span>
                        </template>
                        <template lwc:elseif={e.isCancelled}>
                            <span class="badge badge--cancel">
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>
                                {e.statusLabel}
                            </span>
                        </template>
                        <template lwc:elseif={e.isCompleted}>
                            <span class="badge badge--done">
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                Completed
                            </span>
                        </template>

                        <!-- actions -->
                        <div class="card__actions">
                            <template lwc:if={e.isUpcoming}>
                                <button type="button" class="btn btn--outline" data-id={e.id} onclick={handleJoin}>
                                    Join Event
                                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2"></rect></svg>
                                </button>
                                <button type="button" class="btn btn--primary" data-id={e.id} onclick={handleViewDetails}>View Details</button>
                            </template>
                            <template lwc:elseif={e.isCancelled}>
                                <button type="button" class="btn btn--primary" data-id={e.id} onclick={handleViewDetails}>View Details</button>
                            </template>
                            <template lwc:elseif={e.isCompleted}>
                                <button type="button" class="btn btn--outline" data-id={e.id} onclick={handleFeedback}>Submit Feedback</button>
                                <button type="button" class="btn btn--primary" data-id={e.id} onclick={handleViewDetails}>View Details</button>
                            </template>
                        </div>
                    </div>
                </article>
            </template>
        </div>
    </template>

    <template lwc:else>
        <div class="re-empty">
            <div class="re-empty__icon">🗓️</div>
            <h3>Nothing here yet</h3>
            <p>{emptyText}</p>
        </div>
    </template>
</template>
