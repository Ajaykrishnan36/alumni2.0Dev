<template>
    <div class="calendar-wrapper">
      <!-- Loading Spinner - Show only when calendar is loading -->
      <template if:true={isCalendarLoading}>
        <div class="loading-container">
          <div class="loading-content">
            <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
          </div>
        </div>
      </template>
  
      <!-- Calendar Content - Always rendered to ensure DOM elements exist -->
      <div class="calendar-controls">
        <div class="header-left">
          <div class="view-switcher">
            <button class={dayButtonClass} onclick={switchToDay}>Day</button>
            <button class={weekButtonClass} onclick={switchToWeek}>Week</button>
            <button class={monthButtonClass} onclick={switchToMonth}>Month</button>
          </div>
        </div>

        <div class="header-right">
          <div class="date-picker-wrapper">
             <input type="date" onchange={handleDateChange} class="date-picker-hidden-input" />
             <span class="date-display-text">{headerDateText}</span>
             <svg width="18" height="18" viewBox="0 0 24 24" fill="none" class="calendar-icon" xmlns="http://www.w3.org/2000/svg">
               <path d="M19 4H18V2H16V4H8V2H6V4H5C3.89 4 3 4.9 3 6V20C3 21.1 3.89 22 5 22H19C20.1 22 21 21.1 21 20V6C21 4.9 20.1 4 19 4ZM19 20H5V10H19V20ZM19 8H5V6H19V8Z" fill="#999999"/>
             </svg>
          </div>
          <button class="schedule-call-btn" onclick={handleScheduleCall}>Schedule a Call</button>
        </div>
      </div>
  
      <!-- Week Sub Header -->
      <template if:true={isWeekView}>
        <div class="week-sub-header">
           <button onclick={previousWeek} class="week-nav-btn">
             <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M15.41 7.41L14 6L8 12L14 18L15.41 16.59L10.83 12L15.41 7.41Z" fill="#0070d2"/>
             </svg>
           </button>
           <span class="week-range-text">{weekRangeText}</span>
           <button onclick={nextWeek} class="week-nav-btn">
             <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M8.59 16.59L10 18L16 12L10 6L8.59 7.41L13.17 12L8.59 16.59Z" fill="#0070d2"/>
             </svg>
           </button>
        </div>
      </template>

      <!-- Calendar Container - Always present in DOM -->
      <div class="slds-p-horizontal_small calendar-container" style={calendarContainerStyle}>
        <!-- Calendar element - always present in DOM -->
        <div lwc:dom="manual" class="calendar" style="margin-top: 10px;"></div>
      </div>

      <!-- Schedule a Call Modal -->
      <template if:true={showScheduleModal}>
        <c-ken-schedule-call-modal
            mentor-options={mentorOptions}
            mentee-options={menteeOptions}
            initial-date={scheduleModalInitialDate}
            is-submitting={isSubmittingCallRequest}
            onclose={handleCloseScheduleModal}
            onshowtoast={handleShowToast}
            onsendrequest={handleSendRequest}>
        </c-ken-schedule-call-modal>
      </template>

      <c-ken-toast-notification
          is-visible={showToast}
          toast-title={toastTitle}
          toast-message={toastMessage}
          toast-variant={toastVariant}>
      </c-ken-toast-notification>

    </div>
  </template>
