<template>

    <!-- ── Gate Pass Type Selector Modal ──────────────────────────────── -->
    <template if:true={showPassTypeModal}>
        <div class="gp-modal-overlay" onclick={handleClosePassModal}>
            <div class="gp-modal" onclick={stopProp}>

                <!-- Header -->
                <div class="gp-modal-header">
                    <div class="gp-modal-title-wrap">
                        <span class="gp-modal-badge">
                            <lightning-icon icon-name="utility:shield" size="xx-small"></lightning-icon>
                            Gate Pass
                        </span>
                        <h2 class="gp-modal-title">Who needs the gate pass?</h2>
                        <p class="gp-modal-subtitle">Select the type to continue with your request</p>
                    </div>
                    <button type="button" class="gp-modal-close" onclick={handleClosePassModal}>✕</button>
                </div>

                <!-- Type Selector -->
                <template if:true={showPassTypeSelector}>
                    <div class="gp-type-cards">
                        <button type="button" class="gp-type-card" onclick={handleSelectStudent}>
                            <div class="gp-type-icon gp-icon-student">
                                <lightning-icon icon-name="standard:user" size="large" variant="inverse"></lightning-icon>
                            </div>
                            <h3 class="gp-type-title">Student</h3>
                            <p class="gp-type-desc">I am the student requesting a gate pass for myself</p>
                            <span class="gp-type-cta">Continue as Student →</span>
                        </button>
                        <button type="button" class="gp-type-card" onclick={handleSelectVisitor}>
                            <div class="gp-type-icon gp-icon-visitor">
                                <lightning-icon icon-name="standard:contact" size="large" variant="inverse"></lightning-icon>
                            </div>
                            <h3 class="gp-type-title">Visitor</h3>
                            <p class="gp-type-desc">I am requesting a pass for a visitor (parent, guardian or relative)</p>
                            <span class="gp-type-cta">Continue as Visitor →</span>
                        </button>
                    </div>
                </template>

                <!-- Visitor Form -->
                <template if:true={showVisitorInModal}>
                    <c-ken-visitor-pass-form
                        onvisitorready={handleVisitorReady}
                        onback={handleVisitorBackInModal}>
                    </c-ken-visitor-pass-form>
                </template>

            </div>
        </div>
    </template>

    <div class="request-service-container">
        <header class="page-header">
            <h1 class="service-header">Request for a Service</h1>
            <c-ken-sns-breadcrumb items={crumbs}></c-ken-sns-breadcrumb>
        </header>
        <div class="service-container">
            <div class="service-grid">
                <template for:each={serviceData} for:item="service">

                        data-service-id={service.serviceId} data-offering-id={service.id}>

                                    fill="#B7202E" />
                            </svg>
                        </div>
                        <h3 class="service-title">{service.title}</h3>
                        <p class="service-description">{service.description}</p>
                    </button>
                </template>
            </div>
        </div>
    </div>
</template>
