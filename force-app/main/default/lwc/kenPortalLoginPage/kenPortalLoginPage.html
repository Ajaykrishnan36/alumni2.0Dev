<template>
	<template if:true={redirectingToReset}>
		<div class="portal-login-fullscreen-spinner">
			<lightning-spinner alternative-text="Redirecting..." size="medium" variant="brand"></lightning-spinner>
		</div>
	</template>
	<template if:false={redirectingToReset}>
	<div class="login-page-wrapper" style={heroBgStyle}>
		<div class="page-bg-blur"></div>
		<template if:false={isMobile}>
			<div class="hero-image-full">
				<img src={carouselImage} class="hero-image-full-img" alt="Login background" />
				<div class="hero-image-full-overlay">
					<img src={KenLogo} class="hero-logo" alt="Institution logo" />
					<div class="overlay-bottom">
						<div class="overlay-text-large">Together, we empower the future</div>
						<div class="overlay-underline"></div>
						<div class="overlay-text-bottom">Connect • Collaborate • Give Back</div>
					</div>
				</div>
			</div>
			<div class="hero-blur-veil"></div>
		</template>
		<div class="login-card-layer">
			<div class={containerClass}>
				<template if:true={isMobile}>
					<img src={KenLogo} class="mobile-hero-logo" alt="Institution logo" />
				</template>
				<template if:true={isLoginPage}>
					<c-ken-login-page start-url={startUrl} onsignup={handleSignup}
						onforgotpassword={handleForgotPassword} onresendverifyemail={handleResendVerificationLink}>
					</c-ken-login-page>
				</template>
			</div>
		</div>
	</div>
	</template>
</template>
