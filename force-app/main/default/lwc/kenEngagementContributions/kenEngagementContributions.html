<template>
	<div class="engagement-container">
		<div class="form-container">
			<div class="form-scroll">
				<h2 class="section-title">What do you want to do on the platform? This helps us personalize your experience.</h2>
				<div class="engagement-cards-grid">
					<template for:each={engagementOptions} for:item="option">
						<div key={option.id} class="engagement-card-wrapper" onclick={handleCardClick} onkeydown={handleCardKeyDown} data-option-id={option.id} role="button" tabindex="0">
							<div class="card-dark-container">
								<div class="card-image-container">
									<img src={option.image} alt={option.name} class="card-image" onerror={handleImageError} />
									<div class="image-gradient-overlay"></div>
								</div>
								<div class="card-content-overlay">
									<lightning-input
										type="checkbox"
										checked={option.checked}
										onchange={handleOptionChange}
										data-option-id={option.id}
										variant="label-hidden"
										class="card-checkbox">
									</lightning-input>
									<span class="card-label">{option.name}.</span>
								</div>
							</div>
						</div>
					</template>
				</div>
			</div>
		</div>

		<div class="form-actions">
			<button type="button" class="previous-button" onclick={handlePrevious}>Previous Step</button>
			<button type="button" class="save-next-button" onclick={handleSaveAndNext}>Save & Next</button>
		</div>
	</div>
</template>
