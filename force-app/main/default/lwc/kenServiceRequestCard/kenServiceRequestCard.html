<template>
    <button type="button" class="service-card" onclick={handleCardClick} aria-label="Request for a Service">
        <div class="service-card__pattern"></div>

        <div class="card-header">
            <p class="card-title">Request for a Service</p>
            <span class="arrow-circle">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M5 12H19M19 12L13 6M19 12L13 18" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </span>
        </div>

        <div class="card-chips">
            <template for:each={chips} for:item="chip">
                <span key={chip} class="card-chip">{chip}</span>
            </template>
        </div>

        <div class="card-icon">
            <svg width="56" height="56" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M4 14V11C4 6.582 7.582 3 12 3C16.418 3 20 6.582 20 11V14"
                      stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.5" stroke-linecap="round"/>
                <rect x="2" y="13" width="4" height="7" rx="1.5"
                      stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.5"/>
                <rect x="18" y="13" width="4" height="7" rx="1.5"
                      stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.5"/>
                <path d="M18 20V20.5C18 21.328 17.328 22 16.5 22H13"
                      stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
        </div>
    </button>
</template>
