<template>
    <div class="photo-upload-page">
        <div class="page-container">
            <div class="upload-section">
                <template if:true={hasNoImages}>
                    <div
                        class="upload-area"
                        data-upload-area="true"
                        ondrop={handleDrop}
                        ondragover={handleDragOver}
                        ondragleave={handleDragLeave}
                        onclick={handleUploadClick}
                    >
                        <div class="upload-placeholder">
                            <lightning-icon
                                icon-name="utility:file"
                                size="large"
                                class="upload-icon"
                            ></lightning-icon>
                            <p class="upload-text">Drag and drop your photos or files here</p>
                            <p class="upload-info">Max file size 16 mb</p>
                            <input
                                type="file"
                                class="file-input"
                                multiple
                                data-file-input="true"
                                onchange={handleFileSelect}
                            />
                            <lightning-button
                                variant="brand"
                                label="Choose File"
                                icon-name="utility:upload"
                                onclick={handleChooseFileClick}
                                class="upload-button"
                            ></lightning-button>
                        </div>
                    </div>
                </template>

                <template if:true={hasImages}>
                    <div class="uploaded-images-container">
                        <div class="uploaded-images-list">
                            <template for:each={uploadedImages} for:item="image">
                                <div key={image.id} class="image-card">
                                    <template if:true={image.isImage}>
                                        <img src={image.preview} alt={image.name} class="card-image" />
                                    </template>
                                    <template if:false={image.isImage}>
                                        <div class="card-file-placeholder">
                                            <lightning-icon icon-name="doctype:attachment" size="large"></lightning-icon>
                                            <p class="card-file-name">{image.name}</p>
                                        </div>
                                    </template>
                                    <button
                                        class="delete-image-btn"
                                        type="button"
                                        data-image-id={image.id}
                                        onclick={handleRemoveImage}
                                        title="Delete image"
                                    >
                                        <lightning-icon
                                            icon-name="utility:delete"
                                            size="x-small"
                                        ></lightning-icon>
                                    </button>
                                </div>
                            </template>
                        </div>
                        <lightning-button
                            variant="brand"
                            label="Add More Files"
                            icon-name="utility:add"
                            onclick={handleUploadClick}
                            class="add-more-button"
                        ></lightning-button>
                        <input
                            type="file"
                            class="file-input"
                            multiple
                            data-file-input="true"
                            onchange={handleFileSelect}
                        />
                    </div>
                </template>

                <div class="page-actions">
                    <lightning-button
                        variant="neutral"
                        label="Cancel"
                        onclick={handleCancel}
                        class="cancel-button"
                    ></lightning-button>
                    <lightning-button
                        variant="brand"
                        label={postButtonLabel}
                        onclick={handlePost}
                        class="post-button"
                        disabled={isPostDisabled}
                    ></lightning-button>
                </div>
            </div>
        </div>
    </div>
</template>
