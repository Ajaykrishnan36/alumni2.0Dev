<template>
  <div class={mobileChatContainerClass} role="application" aria-label="Chat">
    <!-- List View -->
    <template if:true={isListViewModel}>
      <div class="mobile-list-view">
        <div class="chat-tabs">
          <button
            type="button"
            class="chat-tab"
            data-tab="individuals"
            aria-pressed={isIndividuals}
            onclick={handleTabChange}
          >
            Individuals
          </button>
          <button
            type="button"
            class="chat-tab"
            data-tab="groups"
            aria-pressed={isGroups}
            onclick={handleTabChange}
          >
            Groups
          </button>
        </div>
        <div class="chat-search-wrap">
          <span class="chat-search-icon" aria-hidden="true">
            <lightning-icon
              icon-name="utility:search"
              size="x-small"
            ></lightning-icon>
          </span>
          <input
            type="search"
            class="chat-search-input"
            placeholder="Search"
            value={searchTerm}
            oninput={handleSearchInput}
            aria-label="Search conversations"
          />
          <!-- Same as desktop: mic optional -->
          <!-- <button type="button" class="chat-mic-btn" aria-label="Voice input" title="Voice input">
                        <lightning-icon icon-name="utility:record" size="x-small"></lightning-icon>
                    </button> -->
        </div>
        <div class="chat-list" role="list">
          <template for:each={filteredList} for:item="item">
            <div
              key={item.key}
              role="listitem"
              class={item.cardClass}
              data-id={item.id}
              onclick={handleChatSelect}
            >
              <template if:true={item.pillTag}>
                <span class="chat-pill">{item.pillTag}</span>
              </template>
              <div class="chat-card-avatar">
                <img src={item.avatarUrl} alt="" class="chat-avatar-img" />
              </div>
              <div class="chat-card-body">
                <div class="chat-card-name">{item.name}</div>
                <div class="chat-card-preview">
                  <template if:true={item.lastIsAttachment}>
                    <span class="chat-card-clip" aria-hidden="true">
                      <lightning-icon
                        icon-name="utility:attach"
                        size="xx-small"
                      ></lightning-icon>
                    </span>
                  </template>
                  {item.lastMessage}
                </div>
              </div>
              <div class="chat-card-time">
                {item.lastTime}
                <template if:true={item.unread}>
                  <span class="chat-unread-dot" title="Unread messages"></span>
                </template>
              </div>
            </div>
          </template>
        </div>
      </div>
    </template>

    <!-- Chat Detail View (full screen) -->
    <template if:true={isChatViewModel}>
      <div class="mobile-chat-view">
        <header class="chat-header">
          <button
            type="button"
            class="chat-back-btn"
            onclick={handleBack}
            aria-label="Back to conversations"
            title="Back"
          >
            <lightning-icon
              icon-name="utility:chevronleft"
              size="small"
            ></lightning-icon>
          </button>
          <div class="chat-header-left">
            <div class="chat-header-avatar">
              <img src={selectedChat.avatarUrl} alt="" />
            </div>
            <div class="chat-header-info">
              <h2 class="chat-header-name">{selectedChat.name}</h2>
              <span class="chat-header-status">
                <template if:true={showHeaderPresenceDot}>
                  <span class="status-dot" aria-hidden="true"></span>
                </template>
                {chatHeaderSubline}
              </span>
            </div>
          </div>
          <button
            type="button"
            class="chat-header-action"
            aria-label="More options"
            title="More options"
          >
            <lightning-icon
              icon-name="utility:info"
              size="small"
            ></lightning-icon>
          </button>
        </header>
        <div
          class="chat-messages"
          role="log"
          aria-live="polite"
          onscroll={handleMessagesScroll}
        >
          <template for:each={currentMessages} for:item="msg">
            <template if:true={msg.dateLabel}>
              <div key={msg.key} class="chat-date-sep">{msg.dateLabel}</div>
            </template>
            <div
              key={msg.key}
              class="chat-msg-row"
              data-outgoing={msg.isOutgoing}
            >
              <template if:false={msg.isOutgoing}>
                <div class="chat-msg-avatar chat-msg-avatar-left">
                  <img src={msg.avatarUrl} alt="" />
                </div>
              </template>
              <div class="chat-msg-bubble">
                <div class="chat-msg-line">
                  <span class="chat-msg-text">{msg.text}</span>
                  <span class="chat-msg-time">
                    {msg.time}
                    <template if:true={msg.showTick}>
                      <span class={msg.tickClass} aria-hidden="true"
                        >&#10003;&#10003;</span>
                    </template>
                  </span>
                </div>
                <template if:true={msg.hasFiles}>
                  <div class="chat-msg-files">
                    <template for:each={msg.files} for:item="f">
                      <div key={f.key} class="chat-msg-file-item">
                        <!-- An image opens in place; a document downloads.
                                                     No target="_blank": the URL answers Content-Disposition: attachment, so the
                                                     browser saves the file and stays on the page. Opening a tab for it left an
                                                     empty about:blank sitting there after every download. -->
                        <template if:true={f.hasThumb}>
                          <button
                            type="button"
                            class="chat-msg-image"
                            title={f.name}
                            data-src={f.previewSrc}
                            data-name={f.name}
                            onclick={handleOpenPreview}
                          >
                            <img
                              src={f.previewSrc}
                              alt={f.name}
                              loading="lazy"
                            />
                          </button>
                        </template>
                        <template if:false={f.hasThumb}>
                          <template if:true={f.canPreview}>
                            <a
                              href={f.href}
                              rel="noopener"
                              download={f.name}
                              class="chat-msg-file"
                              title={f.name}
                            >
                              <span class="chat-msg-file-ext"
                                >{f.extLabel}</span>
                              <span class="chat-msg-file-body">
                                <span class="chat-msg-file-name">{f.name}</span>
                                <span class="chat-msg-file-size"
                                  >{f.sizeLabel}</span>
                              </span>
                            </a>
                          </template>
                          <!-- No URL behind it, so it names the file rather than pretending to open. -->
                          <template if:false={f.canPreview}>
                            <span
                              class="chat-msg-file chat-msg-file-dead"
                              title={f.name}
                            >
                              <span class="chat-msg-file-ext"
                                >{f.extLabel}</span>
                              <span class="chat-msg-file-body">
                                <span class="chat-msg-file-name">{f.name}</span>
                                <span class="chat-msg-file-size"
                                  >{f.sizeLabel}</span>
                              </span>
                            </span>
                          </template>
                        </template>
                      </div>
                    </template>
                  </div>
                </template>
              </div>
              <template if:true={msg.isOutgoing}>
                <div class="chat-msg-avatar chat-msg-avatar-right">
                  <img src={msg.avatarUrl} alt="" />
                </div>
              </template>
            </div>
          </template>
        </div>
        <div class="chat-composer-wrap">
          <template if:true={hasPendingFiles}>
            <div class="chat-pending-files">
              <template for:each={decoratedPendingFiles} for:item="f">
                <div key={f.key} class="chat-pending-file" title={f.name}>
                  <span class="chat-pending-icon" aria-hidden="true">
                    <lightning-icon
                      icon-name="utility:attach"
                      size="xx-small"
                    ></lightning-icon>
                  </span>
                  <span class="chat-pending-name">{f.name}</span>
                  <span class="chat-pending-size">{f.sizeLabel}</span>
                  <button
                    type="button"
                    class="chat-pending-remove"
                    data-key={f.key}
                    onclick={handleRemovePending}
                    aria-label="Remove attachment"
                    title="Remove"
                  >
                    &times;
                  </button>
                </div>
              </template>
            </div>
          </template>
          <template if:true={isUploading}>
            <div class="chat-upload-status" role="status">
              Uploading&hellip;
            </div>
          </template>
          <div class="chat-composer">
            <input
              type="file"
              class="chat-file-input"
              multiple
              onchange={handleFilesSelected}
              tabindex="-1"
              aria-hidden="true"
            />
            <button
              type="button"
              class="chat-composer-attach"
              onclick={handleAttachClick}
              aria-label="Attach file"
              title="Attach"
            >
              <svg
                class="chat-icon"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path
                  d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"
                />
              </svg>
            </button>
            <input
              type="text"
              class="chat-composer-input"
              placeholder="Type a message"
              value={newMessageText}
              oninput={handleComposerInput}
              onkeydown={handleComposerKeyDown}
              aria-label="Message input"
            />
            <button
              type="button"
              class="chat-composer-send"
              onclick={handleSend}
              disabled={sendDisabled}
              aria-label="Send message"
              title="Send"
            >
              <svg
                class="chat-icon"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="currentColor"
                aria-hidden="true"
              >
                <path
                  d="M3.4 20.4l17.45-7.48a1 1 0 000-1.84L3.4 3.6a1 1 0 00-1.39 1.19l2.1 6.3a1 1 0 00.84.68l9.4 1.02a.21.21 0 010 .42l-9.4 1.02a1 1 0 00-.84.68l-2.1 6.3A1 1 0 003.4 20.4z"
                />
              </svg>
            </button>
          </div>
        </div>
      </div>
    </template>

    <!-- Full-size preview. Clicking an image opens this rather than navigating to the file,
             so the viewer stays in the conversation. -->
    <template if:true={hasFilePreview}>
      <div
        class="chat-lightbox"
        role="dialog"
        aria-modal="true"
        aria-label={previewFile.name}
        onclick={handleClosePreview}
      >
        <img
          src={previewFile.src}
          alt={previewFile.name}
          class="chat-lightbox-img"
        />
        <button
          type="button"
          class="chat-lightbox-close"
          onclick={handleClosePreview}
          aria-label="Close preview"
          title="Close"
        >
          &times;
        </button>
      </div>
    </template>
  </div>
</template>
