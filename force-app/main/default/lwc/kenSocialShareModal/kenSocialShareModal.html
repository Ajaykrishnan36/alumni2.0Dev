    class="share-modal-backdrop"
    role="dialog"
    aria-modal="true"
    aria-label="Share post"
    onclick={handleBackdropClick}

    <div class="share-modal-card" onclick={stopPropagation}>

        <h2 class="share-modal-title">Share to</h2>

          class="close-btn"
          aria-label="Close"
