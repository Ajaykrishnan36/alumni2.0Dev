<template>
	<header class="registration-header">
		<div class="header-left">
			<img src={kenLogo} class="ken-logo" alt="Ken42 Logo" />
		</div>
		<div class="header-right">
			<button type="button" class="logout-button" onclick={handleLogout}>
				<span>Logout</span>
				<svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
					<path d="M9 21H5C4.46957 21 3.96086 20.7893 3.58579 20.4142C3.21071 20.0391 3 19.5304 3 19V5C3 4.46957 3.21071 3.96086 3.58579 3.58579C3.96086 3.21071 4.46957 3 5 3H9M16 17L21 12M21 12L16 7M21 12H9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
				</svg>
			</button>
			<div class="user-info">
				<div class="user-avatar">
					<template if:true={showAvatarImage}>
						<img src={profileImageUrl} style="border-radius: 50% !important;height: 40px; width: 40px;" alt="Profile" onerror={handleImageError} />
					</template>
					<template if:false={showAvatarImage}>
						<span>{initials}</span>
					</template>
				</div>
				<span class="user-name">{displayName}</span>
			</div>
		</div>
	</header>
</template>
