<template>
	<div class="reset-page-wrapper" style={heroBgStyle}>
		<div class="page-bg-blur"></div>
		<template if:false={isMobile}>
			<div class="hero-image-full">
				<img src={carouselImage} class="hero-image-full-img" alt="Reset password background" />
				<div class="hero-image-full-overlay">
					<img src={KenLogo} class="hero-logo" alt="Institution logo" />
					<div class="overlay-bottom">
						<div class="overlay-text-large">Together, we empower the future</div>
						<div class="overlay-underline"></div>
						<div class="overlay-text-bottom">Connect • Collaborate • Give Back</div>
					</div>
				</div>
			</div>
			<div class="hero-blur-veil"></div>
		</template>
		<div class="reset-card-layer">
			<div class={containerClass}>
				<template if:true={isMobile}>
					<img src={KenLogo} class="mobile-hero-logo" alt="Institution logo" />
				</template>
				<c-ken-reset-password-page start-url={startUrl} onlogin={handleLogin} onregister={handleRegister}></c-ken-reset-password-page>
			</div>
		</div>
	</div>
</template>
