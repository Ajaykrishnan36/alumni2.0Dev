<template>
    <div class={composerClass}>
        <p class="composer-label">Share your Thoughts</p>

        <template if:false={isExpanded}>
            <input
                type="text"
                class="composer-collapsed-input"
                placeholder="What's on your mind?"
                onfocus={handleFocus} />
        </template>

        <template if:true={isExpanded}>
            <div class="rich-text-wrap">
                <c-ken-rich-text-editor
                    value={body}
                    placeholder="What's on your mind?"
                    allow-images="true"
                    show-image-button="true"
                    image-busy={isUploading}
                    onimageselect={handleImageSelect}
                    onchange={handleRichTextChange}>
                </c-ken-rich-text-editor>
            </div>

            <div class="composer-footer">
                <div class="footer-left">
                    <button type="button" class="pill-btn" onclick={handleOpenPoll}>
                        <svg class="poll-glyph" viewBox="0 0 16 16" width="15" height="15" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
                            <line x1="2" y1="4"  x2="14" y2="4"></line>
                            <line x1="2" y1="8"  x2="10" y2="8"></line>
                            <line x1="2" y1="12" x2="6"  y2="12"></line>
                        </svg>
                        <span>Create a Poll</span>
                    </button>

                    <button type="button" class={commentsToggleClass} onclick={handleToggleCommentsSetting}
                        aria-pressed={commentsEnabled}>
                        <lightning-icon icon-name="utility:comments" size="x-small"></lightning-icon>
                        <span>{commentsToggleLabel}</span>
                    </button>

                    <template if:true={isUploading}>
                        <span class="upload-status">
                            <lightning-spinner alternative-text="Uploading" size="x-small"></lightning-spinner>
                            <span>Uploading…</span>
                        </span>
                    </template>
                </div>

                <div class="footer-right">
                    <span class="char-counter">{counterLabel}</span>
                    <button type="button" class="btn btn-secondary" onclick={handleCancel} disabled={isPosting}>
                        Cancel
                    </button>
                    <button type="button" class="btn btn-primary" onclick={handleSubmit} disabled={postDisabled}>
                        <template if:true={isPosting}>Posting…</template>
                        <template if:false={isPosting}>Post</template>
                    </button>
                </div>
            </div>
        </template>

        <template if:true={showPollModal}>
            <c-ken-group-poll-modal
                group-id={groupId}
                onclose={handleClosePoll}
                oncreated={handlePollCreated}>
            </c-ken-group-poll-modal>
        </template>
    </div>
</template>
