<template>
    <div class="profile-header">
        <!-- Left Section: Profile Image and Info -->
        <div class="header-left">
            <div class="profile-image-container">
                <img src={displayImage} alt={name} class="profile-image" onerror={handleImageError} />
                <template if:true={isOnline}>
                    <div class="online-indicator"></div>
                </template>
            </div>
            <div class="profile-info">
                <div class="profile-top-info">
                    <h1 class="profile-name">{name}</h1>
                    <p class="profile-title">{title}</p>
                    <div class="location-info">
                        <lightning-icon icon-name="utility:location" size="xx-small" class="location-icon"></lightning-icon>
                        <span class="location-text">{location}</span>
                    </div>
                </div>
                <div class="company-info">
                    <img src={companyLogo} alt={company} class="company-logo" onerror={handleCompanyLogoError} />
                    <span class="company-location">{company}, {location}</span>
                </div>
            </div>
        </div>
        
        <!-- Middle Section: Batch, Expertise, Email, Current Location, Phone, Social -->
        <div class="header-middle">
            <div class="details-grid">
                <div class="detail-item detail-item-col1-row1">
                    <span class="detail-label">Batch of:</span>
                    <span class="detail-value">{batch}</span>
                </div>
                <div class="detail-item detail-item-col2-row1">
                    <span class="detail-label">Email:</span>
                    <span class="detail-value">{email}</span>
                </div>
                <div class="detail-item detail-item-col3-row1">
                    <span class="detail-label">Current Location:</span>
                    <span class="detail-value">{location}</span>
                </div>
                <div class="detail-item detail-item-col1-row2">
                    <span class="detail-label">Expertise:</span>
                    <span class="detail-value">{expertise}</span>
                </div>
                <div class="detail-item detail-item-col2-row2">
                    <span class="detail-label">Phone number:</span>
                    <span class="detail-value">{phone}</span>
                </div>
                <div class="detail-item detail-item-col3-row2">
                    <span class="detail-label">Social connect:</span>
                    <span class="detail-value">
                        <a href={linkedin} target="_blank" class="social-link">
                            <div class="linkedin-icon-wrapper">
                                <lightning-icon icon-name="utility:linkedin" size="x-small" class="linkedin-icon"></lightning-icon>
                            </div>
                        </a>
                    </span>
                </div>
            </div>
        </div>

        <template if:true={willingToHelp}>
            <div class="willing-to-help-badge">Willing to help</div>
        </template>
        
        <button class="connect-button">Connect +</button>
    </div>
</template>
