<template>
    <!-- Profile Page -->
    <template if:true={showProfilePage}>
        <c-ken-profile-page profile-id={selectedAlumniId} onback={handleBackFromProfile}></c-ken-profile-page>
    </template>

    <!-- Network Page -->
    <template if:false={showProfilePage}>
        <div class="network-page">
            <div class={networkContainerClass}>
                <!-- Mobile: full list view (tab title + search/sort/filter + 2-col grid) -->
                <template if:true={showMobileListFullView}>
                    <div class="main-content main-content-mobile-full">
                        <template if:false={isNoResults}>
                            <c-ken-network-list-mobile alumni={filteredAlumni} active-tab-label={activeTabLabel}
                                onback={handleMobileListBack} onsearch={handleSearch}
                                onsortclick={handleSortClick} onsortchange={handleSortChange}
                                onfiltersclick={handleFiltersClick}
                                onprofileclick={handleProfileClick}></c-ken-network-list-mobile>
                        </template>
                        <template if:true={isNoResults}>
                            <div class="network-empty-state">
                                <div class="network-empty-content">
                                    <img src={emptyStateImageUrl} alt="No data found" class="network-empty-img" />
                                    <h2 class="network-empty-title">{emptyStateTitle}</h2>
                                    <p class="network-empty-desc">{emptyStateDescription}</p>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>

                <!-- Main Content Area (hidden on mobile when full list is shown) -->
                <template if:false={showMobileListFullView}>
                    <div class="main-content">
                        <!-- Tabs and Search Filter Row -->
                        <div class="tabs-search-row">
                            <!-- Tabs -->
                            <c-ken-tabs-section active-tab={activeTab} ontabchange={handleTabChange}
                                class="tabs-wrapper"></c-ken-tabs-section>

                            <!-- Search and Filter Bar (hidden on mobile via .controls-row) -->
                            <div class="controls-row search-filter-bar">
                                <button class="filter-btn map-view-btn" onclick={handleMapViewOpen}>
                                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5S10.62 6.5 12 6.5s2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                                    </svg>
                                    <span>Map view</span>
                                </button>
                                <c-ken-search-bar placeholder="Search" onsearch={handleSearch}></c-ken-search-bar>
                                <div class="filter-buttons">
                                    <div class="sort-by-wrapper">
                                        <button class="filter-btn sort-toggle-btn" onclick={handleSortClick}>
                                            <span>Sort by</span>
                                            <svg class={sortIconClass} width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                                                <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/>
                                            </svg>
                                        </button>
                                    </div>
                                    <button class="filter-btn" data-filter-btn="true" onclick={handleFiltersClick}>
                                        <lightning-icon icon-name="utility:filterList" size="x-small"
                                            class="filter-icon"></lightning-icon>
                                        <span>Filters</span>
                                        <template if:true={activeFilterCount}>
                                            <span class="filter-count-badge">{activeFilterCount}</span>
                                        </template>
                                        <lightning-icon icon-name="utility:down" size="xx-small"
                                            class="dropdown-icon"></lightning-icon>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <!-- Alumni Grid (mobile: 2 cols, first 4 cards + View More) -->
                        <template if:true={isNoResults}>
                            <div class="network-empty-state">
                                <div class="network-empty-content">
                                    <img src={emptyStateImageUrl} alt="No data found" class="network-empty-img" />
                                    <h2 class="network-empty-title">{emptyStateTitle}</h2>
                                    <p class="network-empty-desc">{emptyStateDescription}</p>
                                </div>
                            </div>
                        </template>
                        <template if:false={isNoResults}>
                            <template if:false={showNearbyEmpty}>
                                <div class="alumni-grid">
                                    <template for:each={mobileVisibleAlumni} for:item="alumni">
                                        <c-ken-alumni-card key={alumni.id} record-id={alumni.id} name={alumni.name} title={alumni.title}
                                            company={alumni.company} graduation-year={alumni.graduationYear} education={alumni.education}
                                            location={alumni.location} batch={alumni.batch} profile-image={alumni.profileImage}
                                            linkedin={alumni.linkedin}
                                            willing-to-help={alumni.willingToHelp} is-mentor={alumni.isMentor} is-my-mentor={alumni.isMyMentor} is-online={alumni.isOnline}
                                            presence-status={alumni.presenceStatus}
                                            compact={isMobile}
                                            onprofileclick={handleProfileClick}></c-ken-alumni-card>
                                    </template>
                                </div>
                                <template if:true={showViewMoreButton}>
                                    <button type="button" class="view-all-mobile" onclick={handleViewMore}>View More</button>
                                </template>
                            </template>
                            <template if:true={showNearbyEmpty}>
                                <div class="network-empty-state">
                                    <div class="network-empty-content">
                                        <img src={emptyStateImageUrl} alt="No data found" class="network-empty-img" />
                                        <h2 class="network-empty-title">{emptyStateTitle}</h2>
                                        <p class="network-empty-desc">{emptyStateDescription}</p>
                                    </div>
                                </div>
                            </template>
                        </template>
                    </div>
                </template>

                <!-- Right Sidebar -->
                <div class="sidebar">
                    <!-- Alumni Spotlight Widget -->
                    <div class="sidebar-widget spotlight-widget">
                        <c-ken-alumni-spotlight></c-ken-alumni-spotlight>
                    </div>

                            </div>
                            <p class="coming-soon-text">Coming Soon</p>
                        </div>
                    </div>

                    <!-- Invite Friends Widget -->
                    <div class="sidebar-widget invite-widget">
                        <h3 class="widget-title">Invite Friends</h3>
                        <p class="invite-text">Know alumni not here yet? Share your invite link to invite them onboard.
                        </p>
                        <div class="invite-input-container">
                            <input type="text" value={inviteUrl} readonly class="invite-input" />
                            <div class="copy-btn-wrap">
                                <button class="copy-btn" onclick={handleCopyLink} aria-label="Copy invite link">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                                        xmlns="http://www.w3.org/2000/svg">
                                        <g clip-path="url(#clip0_16432_3607)">
                                            <path
                                                d="M15 20H5V7C5 6.45 4.55 6 4 6C3.45 6 3 6.45 3 7V20C3 21.1 3.9 22 5 22H15C15.55 22 16 21.55 16 21C16 20.45 15.55 20 15 20ZM20 16V4C20 2.9 19.1 2 18 2H9C7.9 2 7 2.9 7 4V16C7 17.1 7.9 18 9 18H18C19.1 18 20 17.1 20 16ZM18 16H9V4H18V16Z"
                                                fill="white" />
                                        </g>
                                        <defs>
                                            <clipPath id="clip0_16432_3607">
                                                <rect width="24" height="24" fill="white" />
                                            </clipPath>
                                        </defs>
                                    </svg>
                                </button>
                                <template if:true={copySuccess}>
                                    <span class="copy-success-msg">Copied!</span>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- User Not Found Modal -->
            <c-ken-user-not-found-modal show-modal={showUserNotFoundModal} user-name={selectedUserName}
                batch={selectedUserBatch} profile-image={selectedUserProfileImage}
                onclose={handleCloseUserNotFoundModal}></c-ken-user-not-found-modal>

            <!-- Filters Popup -->
            <template if:true={showFiltersPopup}>
                <div class="filters-overlay" onclick={handleFiltersOverlayClick}>
                    <div class="filters-popup" onclick={handleFiltersPopupClick}>
                        <h2 class="filters-title">Filters</h2>

                        <!-- Toggle Switch -->
                        <div class="toggle-section">
                            <label class="toggle-label" onclick={handleToggleClick}>
                                <input type="checkbox" class="toggle-input" checked={showMentorsNearMe} />
                                <span class="toggle-slider"></span>
                            </label>
                            <span class="toggle-text">Show mentors near me</span>
                        </div>

                        <!-- Filter Dropdowns -->
                        <div class="filters-content">
                            <div class="filter-field">
                                <c-ken-searchable-select placeholder="Company"
                                    value={selectedFilters.company} options={companyOptions} data-field="company"
                                    onchange={handleFilterValueChange} class="filter-select"></c-ken-searchable-select>
                            </div>
                            <div class="filter-field">
                                <c-ken-searchable-select placeholder="Industry"
                                    value={selectedFilters.industry} options={industryOptions} data-field="industry"
                                    onchange={handleFilterValueChange} class="filter-select"></c-ken-searchable-select>
                            </div>
                            <div class="filter-field">
                                <c-ken-searchable-select placeholder="Job function"
                                    value={selectedFilters.jobFunction} options={jobFunctionOptions} data-field="jobFunction"
                                    onchange={handleFilterValueChange} class="filter-select"></c-ken-searchable-select>
                            </div>
                            <div class="filter-field">
                                <c-ken-searchable-select placeholder="Program last attended"
                                    value={selectedFilters.programLastAttended} options={programLastAttendedOptions} data-field="programLastAttended"
                                    onchange={handleFilterValueChange} class="filter-select"></c-ken-searchable-select>
                            </div>
                            <div class="filter-field">
                                <c-ken-searchable-select placeholder="Specialisation"
                                    value={selectedFilters.specialisation} options={specialisationOptions} data-field="specialisation"
                                    onchange={handleFilterValueChange} class="filter-select"></c-ken-searchable-select>
                            </div>
                            <div class="filter-field">
                                <c-ken-searchable-select placeholder="Graduation year"
                                    value={selectedFilters.graduationYear} options={graduationYearOptions} data-field="graduationYear"
                                    onchange={handleFilterValueChange} class="filter-select"></c-ken-searchable-select>
                            </div>
                            <div class="filter-field">
                                <c-ken-searchable-select placeholder="City / Town"
                                    value={selectedFilters.currentCity} options={currentCityOptions} data-field="currentCity"
                                    onchange={handleFilterValueChange} class="filter-select"></c-ken-searchable-select>
                            </div>
                        </div>

                        <!-- Action Buttons (sticky on mobile) -->
                        <div class="filters-actions">
                            <button class="reset-filters-btn" onclick={handleResetFilters}>Reset</button>
                            <button class="apply-filters-btn" onclick={handleApplyFilters}>Apply</button>
                        </div>
                    </div>
                </div>
            </template>

            <template if:true={showMapModal}>
                <div class="filters-overlay map-modal-overlay" onclick={handleMapModalClose}>
                    <div class="map-modal" onclick={handleMapModalClick}>
                        <button class="map-modal-close" onclick={handleMapModalClose} title="Close">
                            <lightning-icon icon-name="utility:close" size="x-small"></lightning-icon>
                        </button>
                        <c-ken-alumni-map map-height={mapModalHeight}></c-ken-alumni-map>
                    </div>
                </div>
            </template>
        </div>
    </template>
</template>
