<template>
    <template if:true={showAccessGate}>
        <div class="ken-access-gate" style="position:fixed;inset:0;background:#ffffff;z-index:99999;display:flex;align-items:center;justify-content:center;">
            <template if:true={accessDenied}>
                <div style="text-align:center;font-family:'General Sans',sans-serif;max-width:360px;padding:24px;">
                    <h2 style="font-size:20px;font-weight:600;color:#1f2333;margin:0 0 8px;">Access denied</h2>
                    <p style="font-size:14px;color:#6b7280;margin:0;">Creating groups is currently turned off. Taking you back&hellip;</p>
                </div>
            </template>
        </div>
    </template>
    <div class="create-group-page">
        <!-- Spinner overlay -->
        <template if:true={showSpinner}>
            <div class="spinner-overlay">
                <lightning-spinner alternative-text="Loading" size="medium" variant="brand"></lightning-spinner>
            </div>
        </template>

        <!-- Success toast -->
        <c-ken-toast-notification
            is-visible={showSuccessToast}
            toast-variant="success"
            toast-title="Group Submitted!"
            toast-message="Your group has been submitted for approval. Redirecting...">
        </c-ken-toast-notification>

        <template if:false={showSuccessToast}>
        <div class="component-container">
            <!-- Header with 3-step stepper -->
            <div class="component-header">
                <div class="stepper-container">
                    <div class="stepper">
                        <template for:each={stepperItems} for:item="step">
                            <div key={step.number} class="stepper-item-wrapper">
                                <div class="stepper-item">
                                    <div class={step.statusClass}>
                                        <div class="step-icon">
                                            <template if:true={step.isCompleted}>
                                                <span>&#10003;</span>
                                            </template>
                                            <template if:false={step.isCompleted}>
                                                <span>{step.number}</span>
                                            </template>
                                        </div>
                                        <span class="step-label">{step.label}</span>
                                    </div>
                                </div>
                                <template if:false={step.isLast}>
                                    <div class={step.lineClass}></div>
                                </template>
                            </div>
                        </template>
                    </div>
                    <div class="progress-container">
                        <div class="progress-bar">
                            <div class="progress-fill" style={progressFillStyle}></div>
                        </div>
                        <div class="step-indicator">{stepIndicatorLabel}</div>
                    </div>
                </div>
            </div>

            <div class="component-content">
                <!-- Step 1: Setup Group -->
                <template if:true={isStep1Active}>
                    <div class="step-content step-content-step1">
                        <h2 class="step-title step-title-step1">1. Setup Group</h2>

                        <!-- Cover Photo (Optional) - from kenEventSetup -->
                        <div class="cover-photo-section">
                            <label class="cover-photo-label">Cover Photo <span class="optional-label">(Optional)</span></label>
                            <template if:false={hasCoverPhoto}>
                                <div class="upload-area" onclick={handleCoverPhotoUploadScreen}>
                                    <button type="button" class="upload-button">
                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" style="margin-right: 6px;" xmlns="http://www.w3.org/2000/svg">
                                            <path fill-rule="evenodd" clip-rule="evenodd"
                                                d="M11.2929 3.29289C11.6834 2.90237 12.3166 2.90237 12.7071 3.29289L17.7071 8.29289C18.0976 8.68342 18.0976 9.31658 17.7071 9.70711C17.3166 10.0976 16.6834 10.0976 16.2929 9.70711L13 6.41421V16C13 16.5523 12.5523 17 12 17C11.4477 17 11 16.5523 11 16V6.41421L7.70711 9.70711C7.31658 10.0976 6.68342 10.0976 6.29289 9.70711C5.90237 9.31658 5.90237 8.68342 6.29289 8.29289L11.2929 3.29289ZM4 16C4.55228 16 5 16.4477 5 17V19C5 19.2652 5.10536 19.5196 5.29289 19.7071C5.48043 19.8946 5.73478 20 6 20H18C18.2652 20 18.5196 19.8946 18.7071 19.7071C18.8946 19.5196 19 19.2652 19 19V17C19 16.4477 19.4477 16 20 16C20.5523 16 21 16.4477 21 17V19C21 19.7957 20.6839 20.5587 20.1213 21.1213C19.5587 21.6839 18.7957 22 18 22H6C5.20435 22 4.44129 21.6839 3.87868 21.1213C3.31607 20.5587 3 19.7957 3 19V17C3 16.4477 3.44772 16 4 16Z"
                                                fill="#545454" />
                                        </svg>
                                        Choose a cover photo (Optional)
                                    </button>
                                    <div class="upload-divider"></div>
                                    <div class="upload-info">
                                        <p>Max image size: 5 MB | Image format: PNG, JPEG</p>
                                    </div>
                                </div>
                            </template>
                            <template if:true={hasCoverPhoto}>
                                <div class="image-preview">
                                    <img src={coverImageUrl} alt="Cover photo" class="cover-image" />
                                    <div class="image-actions">
                                        <button type="button" class="delete-image" onclick={handleDeleteCoverImage}>
                                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                                                <path d="M4.99935 15.8333C4.99935 16.75 5.74935 17.5 6.66602 17.5H13.3327C14.2493 17.5 14.9993 16.75 14.9993 15.8333V5.83333H4.99935V15.8333ZM6.66602 7.5H13.3327V15.8333H6.66602V7.5ZM12.916 3.33333L12.0827 2.5H7.91602L7.08268 3.33333H4.16602V5H15.8327V3.33333H12.916Z" fill="#962121" />
                                            </svg>
                                        </button>
                                        <button type="button" class="change-image" onclick={handleCoverPhotoUploadScreen}>Choose a different picture</button>
                                    </div>
                                </div>
                            </template>
                            <input type="file" accept="image/png,image/jpeg,image/jpg" class="hidden-file-input" onchange={handleCoverPhotoUpload} />
                        </div>

                        <!-- Group Name & Add Tags row -->
                        <div class="form-row">
                            <div class="form-field">
                                <label class="field-label">Group Name<span class="required-asterisk">*</span></label>
                                <input type="text" class="form-input" placeholder="Group name will be visible in the platform"
                                    value={groupName} oninput={handleGroupNameChange} maxlength="50" />
                                <div class="field-footer">
                                    <div class="error-message" if:true={validationErrors.groupName}>{validationErrors.groupName}</div>
                                    <span class="char-count">{groupNameCount}/{groupNameLimit}</span>
                                </div>
                            </div>
                            <div class="form-field">
                                <label class="field-label">Add Tags (Optional)</label>
                                <input type="text" class="form-input" placeholder="Add tags"
                                    value={tagsInput} oninput={handleTagsInputChange} maxlength="100" />
                                <div class="field-footer">
                                    <div class="error-message" if:true={validationErrors.tagsInput}>{validationErrors.tagsInput}</div>
                                    <span class="char-count">{tagsCount}/{tagsLimit}</span>
                                </div>
                            </div>
                        </div>

                        <!-- Who can join this group? & Category row -->
                        <div class="form-row">
                            <div class="form-field">
                                <label class="field-label">Who can join this group?<span class="required-asterisk">*</span></label>
                                <div class="radio-group">
                                    <label class="radio-option">
                                        <input type="radio" name="whoCanJoin" value="public" checked={isPublicSelected} onchange={handleWhoCanJoinChange} />
                                        <span>Public - Anyone can join</span>
                                    </label>
                                    <label class="radio-option">
                                        <input type="radio" name="whoCanJoin" value="private" checked={isPrivateSelected} onchange={handleWhoCanJoinChange} />
                                        <span>Private - Users must request to join</span>
                                    </label>
                                </div>
                            </div>
                            <div class="form-field">
                                <label class="field-label">Category<span class="required-asterisk">*</span></label>
                                <select class="form-input" onchange={handleCategoryChange}>
                                    <template for:each={categoryOptions} for:item="opt">
                                        <option key={opt.value} value={opt.value} selected={opt.selected}>{opt.label}</option>
                                    </template>
                                </select>
                                <div class="field-footer">
                                    <div class="error-message" if:true={validationErrors.category}>{validationErrors.category}</div>
                                </div>
                            </div>
                        </div>

                        <!-- Group Description (Optional) -->
                        <div class="form-field">
                            <label class="field-label">Group Description (Optional)</label>
                            <c-ken-rich-text-editor
                                value={groupDescription}
                                placeholder="Enter a brief description"
                                max-length="1000"
                                onchange={handleGroupDescriptionChange}>
                            </c-ken-rich-text-editor>
                            <div class="field-footer">
                                <div class="error-message" if:true={validationErrors.groupDescription}>{validationErrors.groupDescription}</div>
                            </div>
                        </div>

                        <!-- Rules (Optional) -->
                        <div class="form-field">
                            <label class="field-label">Rules (Optional)</label>
                            <c-ken-rich-text-editor
                                value={rules}
                                placeholder="Enter the rules to be followed by the participants"
                                max-length="1000"
                                onchange={handleRulesChange}>
                            </c-ken-rich-text-editor>
                            <div class="field-footer">
                                <div class="error-message" if:true={validationErrors.rules}>{validationErrors.rules}</div>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- Step 2: Target Audience -->
                <template if:true={isStep2Active}>
                    <c-ken-target-audience
                        parent-object-type="Group"
                        parent-record-id={groupIdForAudience}
                        onaudiencechange={handleAudienceChange}>
                    </c-ken-target-audience>
                </template>

                <!-- Step 3: Summary -->
                <template if:true={isStep3Active}>
                    <div class="step-content summary-step-content">
                        <div class="summary-layout">
                            <div class="summary-left-column">
                                <div class="summary-card">
                                    <div class="summary-card-header">
                                        <h3 class="summary-card-title">Setup Group</h3>
                                        <button type="button" class="edit-details-link" onclick={handleEditStep1}>Edit Details</button>
                                    </div>
                                    <div class="summary-card-body">
                                        <div class="summary-field">
                                            <label class="summary-field-label">Group Name*</label>
                                            <div class="summary-field-value"><template if:true={hasGroupName}>{groupName}</template><template if:false={hasGroupName}>--</template></div>
                                        </div>
                                        <div class="summary-field">
                                            <label class="summary-field-label">Add Tags (Optional)</label>
                                            <div class="summary-field-value"><template if:true={hasTags}>{tagsDisplay}</template><template if:false={hasTags}>--</template></div>
                                        </div>
                                        <div class="summary-field">
                                            <label class="summary-field-label">Who can join this group?*</label>
                                            <div class="summary-field-value">{whoCanJoinLabel}</div>
                                        </div>
                                        <div class="summary-field">
                                            <label class="summary-field-label">Category</label>
                                            <div class="summary-field-value">{categoryLabel}</div>
                                        </div>
                                        <div class="summary-field">
                                            <label class="summary-field-label">Group Description (Optional)</label>
                                            <div class="summary-field-value"><template if:true={hasGroupDescription}><lightning-formatted-rich-text value={groupDescription}></lightning-formatted-rich-text></template><template if:false={hasGroupDescription}>--</template></div>
                                        </div>
                                        <div class="summary-field">
                                            <label class="summary-field-label">Rules (Optional)</label>
                                            <div class="summary-field-value"><template if:true={hasRules}><lightning-formatted-rich-text value={rules}></lightning-formatted-rich-text></template><template if:false={hasRules}>--</template></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="summary-right-column">
                                <div class="summary-card">
                                    <div class="summary-card-header">
                                        <h3 class="summary-card-title">Target Audience</h3>
                                        <button type="button" class="edit-details-link" onclick={handleEditStep2}>Edit Details</button>
                                    </div>
                                    <div class="summary-card-body">
                                        <template if:true={hasSelectedAudience}>
                                            <template for:each={audienceSummaryItems} for:item="aud">
                                                <div key={aud.id} class="audience-group">
                                                    <div class="audience-group-header" data-id={aud.id} onclick={handleToggleAudienceSummary}>
                                                        <svg class={aud.caretClass} width="12" height="8" viewBox="0 0 12 8" fill="none" xmlns="http://www.w3.org/2000/svg">
                                                            <path d="M1.41 7.41L6 2.83L10.59 7.41L12 6L6 0L0 6L1.41 7.41Z" fill="#585A64"/>
                                                        </svg>
                                                        <span class="group-name">{aud.title}</span>
                                                    </div>
                                                    <div class="audience-tags">
                                                        <span class="audience-tag audience-tag-primary">{aud.roleTag}</span>
                                                        <span class="audience-tag audience-tag-secondary">{aud.membersTag}</span>
                                                    </div>
                                                    <template if:true={aud.expanded}>
                                                        <template if:true={aud.hasCriteria}>
                                                            <div class="audience-filter-criteria">
                                                                <template for:each={aud.criteria} for:item="crit">
                                                                    <div key={crit.label} class="filter-criteria-section">
                                                                        <label class="filter-criteria-label">{crit.label}</label>
                                                                        <div class="filter-criteria-tags">
                                                                            <template for:each={crit.values} for:item="val">
                                                                                <span key={val} class="audience-tag audience-tag-secondary">{val}</span>
                                                                            </template>
                                                                        </div>
                                                                    </div>
                                                                </template>
                                                            </div>
                                                        </template>
                                                        <template if:false={aud.hasCriteria}>
                                                            <div class="summary-empty">No filters</div>
                                                        </template>
                                                    </template>
                                                </div>
                                            </template>
                                        </template>
                                        <template if:false={hasSelectedAudience}>
                                            <div class="summary-empty">--</div>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Footer -->
            <div class="component-footer">
                <div class="button-group">
                    <template if:true={isStep1Active}>
                        <button type="button" class="secondary-button" onclick={handleCancel} disabled={isNextDisabled}>Cancel</button>
                        <button type="button" class="btn btn-primary" onclick={handleNextStep} disabled={isNextDisabled}>{nextButtonLabel}</button>
                    </template>
                    <template if:true={isStep2Active}>
                        <button type="button" class="secondary-button" onclick={handlePreviousStep} disabled={isNextDisabled}>Back</button>
                        <button type="button" class="btn btn-primary" onclick={handleNextStep} disabled={isNextDisabled}>{nextButtonLabel}</button>
                    </template>
                    <template if:true={isStep3Active}>
                        <button type="button" class="secondary-button" onclick={handlePreviousStep} disabled={isSubmitDisabled}>Back</button>
                        <button type="button" class="btn btn-primary" onclick={handleSubmit} disabled={isSubmitDisabled}>{submitButtonLabel}</button>
                    </template>
                </div>
            </div>
        </div>
        </template>
    </div>

</template>
