<template>
  <div class={rootClass} role="application" aria-label="Chat">
    <template if:true={hasError}>
      <div class="chat-error" role="alert">{errorMessage}</div>
    </template>
    <!-- The two panels are their own row, so an error banner stacks above them instead of
             becoming a third column beside them. -->
    <div class="chat-body">
      <!-- Left panel - not rendered in single-thread mode -->
      <template if:true={showRail}>
        <aside
          class="chat-left-panel"
          role="navigation"
          aria-label="Conversations"
        >
          <div class="chat-tabs">
            <button
              type="button"
              class="chat-tab"
              data-tab="individuals"
              aria-pressed={isIndividuals}
              onclick={handleTabChange}
            >
              Individuals
            </button>
            <button
              type="button"
              class="chat-tab"
              data-tab="groups"
              aria-pressed={isGroups}
              onclick={handleTabChange}
            >
              Groups
            </button>
          </div>
          <div class="chat-search-wrap">
            <span class="chat-search-icon" aria-hidden="true">
              <lightning-icon
                icon-name="utility:search"
                size="x-small"
              ></lightning-icon>
            </span>
            <input
              type="search"
              class="chat-search-input"
              placeholder="Search"
              value={searchTerm}
              oninput={handleSearchInput}
              aria-label="Search conversations"
            />
            <!-- Voice search is in the design but not built; a dead mic button is worse than none. -->
          </div>
          <div class="chat-list" role="list">
            <template for:each={filteredList} for:item="item">
              <div
                key={item.key}
                role="listitem"
                class={item.cardClass}
                data-id={item.id}
                data-selected={item.isSelected}
                onclick={handleChatSelect}
              >
                <template if:true={item.pillTag}>
                  <span class="chat-pill">{item.pillTag}</span>
                </template>
                <div class="chat-avatar-wrap">
                  <div class="chat-card-avatar">
                    <img src={item.avatarUrl} alt="" class="chat-avatar-img" />
                  </div>
                  <template if:true={item.online}>
                    <span class="chat-online-dot" title="Online"></span>
                  </template>
                </div>
                <div class="chat-card-body">
                  <div class="chat-card-name">{item.name}</div>
                  <div class="chat-card-preview">
                    <template if:true={item.lastIsAttachment}>
                      <span class="chat-card-clip" aria-hidden="true">
                        <lightning-icon
                          icon-name="utility:attach"
                          size="xx-small"
                        ></lightning-icon>
                      </span>
                    </template>
                    {item.lastMessage}
                  </div>
                </div>
                <div class="chat-card-time">
                  {item.lastTime}
                  <template if:true={item.unread}>
                    <span
                      class="chat-unread-dot"
                      title="Unread messages"
                    ></span>
                  </template>
                </div>
              </div>
            </template>
          </div>
        </aside>
      </template>
      <!-- Right panel -->
      <main class="chat-right-panel" role="region" aria-label="Conversation">
        <template if:true={hasSelectedChat}>
          <template if:true={showThreadHeader}>
            <header class="chat-header">
              <div class="chat-header-left">
                <div class="chat-header-avatar">
                  <img src={selectedChat.avatarUrl} alt="" />
                </div>
                <div class="chat-header-info">
                  <h2 class="chat-header-name">{selectedChat.name}</h2>
                  <span class="chat-header-status">
                    <template if:true={showHeaderPresenceDot}>
                      <span class="status-dot" aria-hidden="true"></span>
                    </template>
                    {chatHeaderSubline}
                  </span>
                </div>
              </div>
            </header>
          </template>
          <div
            class="chat-messages"
            role="log"
            aria-live="polite"
            onscroll={handleMessagesScroll}
          >
            <template for:each={currentMessages} for:item="msg">
              <template if:true={msg.dateLabel}>
                <div key={msg.key} class="chat-date-sep">{msg.dateLabel}</div>
              </template>
              <div
                key={msg.key}
                class={msg.rowClass}
                data-outgoing={msg.isOutgoing}
              >
                <!-- The gutter is always present, so a run's later bubbles line up with
                                 the first one instead of sliding under its avatar. -->
                <div class="chat-msg-gutter">
                  <template if:true={msg.showAvatar}>
                    <div class="chat-msg-avatar">
                      <template if:true={msg.avatarUrl}>
                        <img src={msg.avatarUrl} alt="" />
                      </template>
                      <template if:false={msg.avatarUrl}>
                        <span class="chat-msg-avatar-initial"
                          >{msg.avatarInitial}</span>
                      </template>
                    </div>
                  </template>
                </div>
                <div class="chat-msg-block">
                  <template if:true={msg.showSenderName}>
                    <div class="chat-msg-sender">{msg.senderName}</div>
                  </template>
                  <div class="chat-msg-bubble">
                    <div class="chat-msg-line">
                      <span class={msg.textClass}>{msg.displayText}</span>
                      <span class="chat-msg-time">
                        <template if:true={msg.isEdited}>
                          <span class="chat-msg-edited-tag">edited</span>
                        </template>
                        <template if:true={msg.canManage}>
                          <span class="chat-msg-menu-wrap">
                            <button
                              type="button"
                              class={msg.kebabClass}
                              data-uid={msg.id}
                              onclick={handleToggleMessageMenu}
                              title="Message options"
                              aria-label="Message options"
                              aria-haspopup="true"
                            >
                              <lightning-icon
                                icon-name="utility:threedots_vertical"
                                size="xx-small"
                              ></lightning-icon>
                            </button>
                            <template if:true={msg.menuOpen}>
                              <div class="chat-msg-menu" role="menu">
                                <button
                                  type="button"
                                  class="chat-msg-menu-item"
                                  data-uid={msg.id}
                                  onclick={handleEditMessage}
                                  role="menuitem"
                                >
                                  <lightning-icon
                                    icon-name="utility:edit"
                                    size="xx-small"
                                  ></lightning-icon>
                                  <span>Edit</span>
                                </button>
                                <button
                                  type="button"
                                  class="chat-msg-menu-item"
                                  data-uid={msg.id}
                                  onclick={handleDeleteMessage}
                                  role="menuitem"
                                >
                                  <lightning-icon
                                    icon-name="utility:delete"
                                    size="xx-small"
                                  ></lightning-icon>
                                  <span>Delete</span>
                                </button>
                              </div>
                            </template>
                          </span>
                        </template>
                        {msg.time}
                        <template if:true={msg.showTick}>
                          <span class={msg.tickClass} aria-hidden="true"
                            >&#10003;&#10003;</span>
                        </template>
                      </span>
                    </div>
                    <template if:true={msg.hasFiles}>
                      <div class="chat-msg-files">
                        <template for:each={msg.files} for:item="f">
                          <div key={f.key} class="chat-msg-file-item">
                            <!-- An image opens in place; a document downloads.
                                                         No target="_blank": the URL answers Content-Disposition: attachment, so the
                                                         browser saves the file and stays on the page. Opening a tab for it left an
                                                         empty about:blank sitting there after every download. -->
                            <template if:true={f.hasThumb}>
                              <button
                                type="button"
                                class="chat-msg-image"
                                title={f.name}
                                data-src={f.previewSrc}
                                data-name={f.name}
                                onclick={handleOpenPreview}
                              >
                                <img
                                  src={f.previewSrc}
                                  alt={f.name}
                                  loading="lazy"
                                />
                              </button>
                            </template>
                            <template if:false={f.hasThumb}>
                              <template if:true={f.canPreview}>
                                <a
                                  href={f.href}
                                  rel="noopener"
                                  download={f.name}
                                  class="chat-msg-file"
                                  title={f.name}
                                >
                                  <span class="chat-msg-file-ext"
                                    >{f.extLabel}</span>
                                  <span class="chat-msg-file-body">
                                    <span class="chat-msg-file-name"
                                      >{f.name}</span>
                                    <span class="chat-msg-file-size"
                                      >{f.sizeLabel}</span>
                                  </span>
                                </a>
                              </template>
                              <!-- No URL behind it, so it names the file rather than pretending to open. -->
                              <template if:false={f.canPreview}>
                                <span
                                  class="chat-msg-file chat-msg-file-dead"
                                  title={f.name}
                                >
                                  <span class="chat-msg-file-ext"
                                    >{f.extLabel}</span>
                                  <span class="chat-msg-file-body">
                                    <span class="chat-msg-file-name"
                                      >{f.name}</span>
                                    <span class="chat-msg-file-size"
                                      >{f.sizeLabel}</span>
                                  </span>
                                </span>
                              </template>
                            </template>
                          </div>
                        </template>
                      </div>
                    </template>
                  </div>
                </div>
              </div>
            </template>
          </div>
          <div class="chat-composer-wrap">
            <template if:true={isEditing}>
              <div class="chat-editing-banner">
                <lightning-icon
                  icon-name="utility:edit"
                  size="xx-small"
                ></lightning-icon>
                <span class="chat-editing-label">Editing message</span>
                <button
                  type="button"
                  class="chat-editing-cancel"
                  onclick={handleCancelEdit}
                  aria-label="Cancel edit"
                  title="Cancel"
                >
                  &times;
                </button>
              </div>
            </template>
            <!-- Attached and waiting for Send. Shown above the field so the row reads as
                         part of the message being written, not as something already sent. -->
            <template if:true={hasPendingFiles}>
              <div class="chat-pending-files">
                <template for:each={decoratedPendingFiles} for:item="f">
                  <div key={f.key} class="chat-pending-file" title={f.name}>
                    <span class="chat-pending-icon" aria-hidden="true">
                      <lightning-icon
                        icon-name="utility:attach"
                        size="xx-small"
                      ></lightning-icon>
                    </span>
                    <span class="chat-pending-name">{f.name}</span>
                    <span class="chat-pending-size">{f.sizeLabel}</span>
                    <button
                      type="button"
                      class="chat-pending-remove"
                      data-key={f.key}
                      onclick={handleRemovePending}
                      aria-label="Remove attachment"
                      title="Remove"
                    >
                      &times;
                    </button>
                  </div>
                </template>
              </div>
            </template>
            <template if:true={isUploading}>
              <div class="chat-upload-status" role="status">
                Uploading&hellip;
              </div>
            </template>
            <div class="chat-composer">
              <input
                type="file"
                class="chat-file-input"
                multiple
                onchange={handleFilesSelected}
                tabindex="-1"
                aria-hidden="true"
              />
              <!-- Paperclip inside the field, Send as its own filled button beside it. -->
              <div class="chat-composer-field">
                <input
                  type="text"
                  class="chat-composer-input"
                  placeholder="Type a message"
                  value={newMessageText}
                  oninput={handleComposerInput}
                  onkeydown={handleComposerKeyDown}
                  aria-label="Message input"
                />
                <button
                  type="button"
                  class="chat-composer-attach"
                  onclick={handleAttachClick}
                  disabled={isEditing}
                  aria-label="Attach file"
                  title="Attach"
                >
                  <svg
                    class="chat-icon"
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="1.6"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                  >
                    <path
                      d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"
                    />
                  </svg>
                </button>
              </div>
              <button
                type="button"
                class="chat-composer-send"
                onclick={handleSend}
                disabled={sendDisabled}
                aria-label="Send message"
                title="Send"
              >
                <svg
                  class="chat-icon"
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="currentColor"
                  aria-hidden="true"
                >
                  <path
                    d="M3.4 20.4l17.45-7.48a1 1 0 000-1.84L3.4 3.6a1 1 0 00-1.39 1.19l2.1 6.3a1 1 0 00.84.68l9.4 1.02a.21.21 0 010 .42l-9.4 1.02a1 1 0 00-.84.68l-2.1 6.3A1 1 0 003.4 20.4z"
                  />
                </svg>
              </button>
            </div>
          </div>
        </template>
        <template if:false={hasSelectedChat}>
          <div class="chat-placeholder">
            <p>Select a conversation</p>
          </div>
        </template>
      </main>
    </div>

    <!-- Full-size preview. Clicking an image opens this rather than navigating to the file,
             so the viewer stays in the conversation. -->
    <template if:true={hasFilePreview}>
      <div
        class="chat-lightbox"
        role="dialog"
        aria-modal="true"
        aria-label={previewFile.name}
        onclick={handleClosePreview}
      >
        <img
          src={previewFile.src}
          alt={previewFile.name}
          class="chat-lightbox-img"
        />
        <button
          type="button"
          class="chat-lightbox-close"
          onclick={handleClosePreview}
          aria-label="Close preview"
          title="Close"
        >
          &times;
        </button>
      </div>
    </template>

    <!-- Delete-message confirmation -->
    <template if:true={pendingDeleteMessage}>
      <div class="chat-confirm-overlay" onclick={handleCancelDelete}>
        <div class="chat-confirm-card" onclick={stopPropagation}>
          <p class="chat-confirm-text">Delete this message?</p>
          <div class="chat-confirm-actions">
            <button
              type="button"
              class="chat-confirm-cancel"
              onclick={handleCancelDelete}
            >
              Cancel
            </button>
            <button
              type="button"
              class="chat-confirm-delete"
              onclick={handleConfirmDelete}
              disabled={isDeletingMessage}
            >
              Delete
            </button>
          </div>
        </div>
      </div>
    </template>
  </div>
</template>
