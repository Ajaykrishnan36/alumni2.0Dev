<template>
    <div class="personal-details-container">
        <h1 class="header-title">Personal Details</h1>

        <template if:true={error}>
            <div class="error-banner">{error}</div>
        </template>

        <template if:true={isLoading}>
            <div class="loading-spinner">
                <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
            </div>
        </template>

        <template if:true={isSaving}>
            <div class="loading-spinner">
                <lightning-spinner alternative-text="Saving" size="medium"></lightning-spinner>
            </div>
        </template>

        <template if:false={isLoading}>
            <!-- Basic Details Card -->
            <div class="card">
                <h2 class="section-title">Basic Details</h2>

                <div class="profile-pic-section">
                    <div class="profile-pic-wrapper">
                        <img src={profilePic} alt="Profile" class="profile-img">
                        <button class="edit-pic-btn" onclick={handleEditPicture}>
                            <lightning-icon icon-name="utility:edit" size="xx-small"></lightning-icon>
                        </button>
                    </div>
                    <div class="pic-info">
                        <h3>Edit profile picture</h3>
                        <p>PNG or JPG (Max 5 MB)</p>
                    </div>
                </div>

                <div class="basic-details-form">
                    <div class="form-group half-width">
                        <label class="field-label">First Name</label>
                        <input type="text" class="text-input" value={firstName} data-field="firstName" oninput={handleFieldChange} />
                    </div>
                    <div class="form-group half-width">
                        <label class="field-label">Last Name</label>
                        <input type="text" class="text-input" value={lastName} data-field="lastName" oninput={handleFieldChange} />
                    </div>

                    <div class="form-group half-width">
                        <label class="field-label">{emailFieldLabel}</label>
                        <template if:false={isVerifyingEmail}>
                            <div class="input-wrapper disabled-wrapper">
                                <input type="email" class="text-input" value={email} disabled />
                                <template if:true={emailVerified}>
                                    <span class="verified-tick" data-tooltip="Verified" title="Verified">
                                        <svg viewBox="0 0 24 24" width="18" height="18" role="img"
                                            aria-label="Verified" focusable="false">
                                            <circle cx="12" cy="12" r="10" fill="#17794A"/>
                                            <path d="M7.6 12.3l3 3 5.9-6.2" fill="none" stroke="#ffffff"
                                                stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
                                        </svg>
                                    </span>
                                </template>
                                <template if:false={emailVerified}>
                                    <button class="input-suffix-text-btn verify-cta" onclick={handleVerifyEmail}
                                        disabled={isVerifyBusy}>Verify</button>
                                </template>
                                <button class="icon-action" data-tooltip="Request to Change"
                                    title="Request to Change" aria-label="Request to Change"
                                    onclick={handleRequestEmailChange}>
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                        stroke-linecap="round" stroke-linejoin="round" focusable="false"
                                        aria-hidden="true">
                                        <path d="M12 20h9"/>
                                        <path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/>
                                    </svg>
                                </button>
                            </div>
                        </template>
                        <template if:true={isVerifyingEmail}>
                            <div class="input-wrapper otp-wrapper">
                                <input type="text" class="text-input otp-entry" inputmode="numeric" maxlength="6"
                                    placeholder="Enter 6-digit code" value={otpCode} oninput={handleOtpInput}
                                    onkeydown={handleOtpKeyDown} />
                                <button class="input-suffix-text-btn verify-cta" onclick={handleConfirmOtp}
                                    disabled={isConfirmDisabled}>Confirm</button>
                                <button class="input-suffix-text-btn" onclick={handleCancelVerify}>Cancel</button>
                            </div>
                        </template>
                        <template if:true={emailVerifyMessage}>
                            <div class={emailVerifyMessageClass}>{emailVerifyMessage}</div>
                        </template>
                    </div>

                    <div class="form-group half-width">
                        <label class="field-label">{phoneFieldLabel}</label>
                        <template if:false={isVerifyingPhone}>
                            <template if:true={isPhoneEditable}>
                                <div class="input-wrapper otp-wrapper">
                                    <input type="tel" class="text-input" inputmode="numeric" maxlength="15"
                                        placeholder="Enter your mobile number" value={phoneDraft}
                                        oninput={handlePhoneDraftInput} onkeydown={handlePhoneDraftKeyDown} />
                                    <button class="input-suffix-text-btn verify-cta" onclick={handleSaveAndVerifyPhone}
                                        disabled={isSavePhoneDisabled}>Save &amp; Verify</button>
                                </div>
                            </template>
                            <template if:false={isPhoneEditable}>
                                <div class="input-wrapper disabled-wrapper">
                                    <input type="text" class="text-input" value={phone} disabled />
                                    <template if:true={phoneVerified}>
                                        <span class="verified-tick" data-tooltip="Verified" title="Verified">
                                        <svg viewBox="0 0 24 24" width="18" height="18" role="img"
                                            aria-label="Verified" focusable="false">
                                            <circle cx="12" cy="12" r="10" fill="#17794A"/>
                                            <path d="M7.6 12.3l3 3 5.9-6.2" fill="none" stroke="#ffffff"
                                                stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
                                        </svg>
                                    </span>
                                    </template>
                                    <template if:false={phoneVerified}>
                                        <button class="input-suffix-text-btn verify-cta" onclick={handleVerifyPhone}
                                            disabled={isVerifyBusy}>Verify</button>
                                    </template>
                                    <button class="icon-action" data-tooltip="Request to Change"
                                        title="Request to Change" aria-label="Request to Change"
                                        onclick={handleRequestPhoneChange}>
                                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                            stroke-linecap="round" stroke-linejoin="round" focusable="false"
                                            aria-hidden="true">
                                            <path d="M12 20h9"/>
                                            <path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/>
                                        </svg>
                                    </button>
                                </div>
                            </template>
                        </template>
                        <template if:true={isVerifyingPhone}>
                            <div class="input-wrapper otp-wrapper">
                                <input type="text" class="text-input otp-entry" inputmode="numeric" maxlength="6"
                                    placeholder="Enter 6-digit code" value={otpCode} oninput={handleOtpInput}
                                    onkeydown={handleOtpKeyDown} />
                                <button class="input-suffix-text-btn verify-cta" onclick={handleConfirmOtp}
                                    disabled={isConfirmDisabled}>Confirm</button>
                                <button class="input-suffix-text-btn" onclick={handleCancelVerify}>Cancel</button>
                            </div>
                        </template>
                        <template if:true={phoneVerifyMessage}>
                            <div class={phoneVerifyMessageClass}>{phoneVerifyMessage}</div>
                        </template>
                    </div>

                    <div class="form-group half-width">
                        <label class="field-label">Current City</label>
                        <input type="text" class="text-input" value={city} data-field="city" oninput={handleFieldChange} />
                    </div>
                    <div class="form-group half-width">
                        <label class="field-label">Country of Residence</label>
                        <input type="text" class="text-input" value={country} data-field="country" oninput={handleFieldChange} />
                    </div>
                </div>
            </div>

            <!-- Personalize Based on Interest Card -->
            <div class="card">
                <h2 class="section-title">Personalize Based on Interest</h2>

                <div class="interests-grid">
                    <template for:each={interests} for:item="interest">
                        <div key={interest.id} class="interest-card" onclick={toggleInterest} data-id={interest.id}>
                            <img src={interest.img} alt="" class="interest-bg-img" />
                            <div class="interest-overlay"></div>
                            <div class="interest-checkbox-container">
                                <div class={interest.checkboxClass}>
                                    <lightning-icon icon-name="utility:check" size="xx-small" if:true={interest.selected}></lightning-icon>
                                </div>
                                <span class="interest-label">{interest.label}</span>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <!-- Social Media Card -->
            <div class="card">
                <h2 class="section-title">Social Media</h2>

                <div class="basic-details-form">
                    <div class="form-group half-width">
                        <label class="field-label">Linkedin Profile Link</label>
                        <input type="text" class="text-input" value={linkedin} data-field="linkedin" oninput={handleFieldChange} />
                    </div>
                    <div class="form-group half-width">
                        <label class="field-label">Twitter (X) Profile Link</label>
                        <input type="text" class="text-input" value={twitter} data-field="twitter" oninput={handleFieldChange} />
                    </div>
                </div>
            </div>

            <!-- Footer Actions -->
            <div class="footer-actions">
                <button class="btn btn-outline" onclick={handleDiscard} disabled={isSaving}>Discard Changes</button>
                <button class="btn btn-primary" onclick={handleSave} disabled={isSaving}>Save Changes</button>
            </div>
        </template>
    </div>

    <c-ken-status-popup visible={showSuccessPopup} message={successPopupMessage} variant="success"></c-ken-status-popup>

    <template if:true={showNeedHelpModal}>
        <c-ken-need-help-modal onclose={handleNeedHelpClose} onsubmit={handleNeedHelpSubmit}></c-ken-need-help-modal>
    </template>
</template>
