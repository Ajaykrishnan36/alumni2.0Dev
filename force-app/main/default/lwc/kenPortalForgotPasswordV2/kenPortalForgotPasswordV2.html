<template>
    <div class="page">
        <!-- LEFT: Brand / hero panel (violet) -->
        <aside class="hero">
            <h1 class="hero__institute">{institutionName}</h1>
            <div class="hero__bottom">
                <div class="hero__scrollbar"></div>
                <p class="hero__eyebrow">Experience Connections</p>
                <h2 class="hero__title">That Elevate Your Journey</h2>
                <p class="hero__tagline">Connect &bull; Collaborate &bull; Give Back</p>
            </div>
        </aside>

        <!-- RIGHT: Card -->
        <section class="card">
            <div class="card__logo">
                <template lwc:if={institutionLogoUrl}>
                    <img src={institutionLogoUrl} alt="Institution Logo" />
                </template>
                <template lwc:else>
                    <span>Institution Logo</span>
                </template>
            </div>

            <!-- STAGE 1: enter email -->
            <template lwc:if={isEmailStage}>
                <h2 class="card__title">Forgot your password?</h2>
                <p class="card__subtitle">Enter the email associated with your account and we'll send you a 6-digit verification code.</p>
                <form class="form" onsubmit={handleRequest}>
                    <div class="field">
                        <label>Email Address</label>
                        <input type="email" placeholder="you@example.com" value={email} oninput={handleEmailInput} autocomplete="username" />
                    </div>
                    <template lwc:if={error}><p class="form-error">{error}</p></template>
                    <button type="submit" class="btn btn--primary btn--block" disabled={isLoading}>
                        <template lwc:if={isLoading}>Sending…</template>
                        <template lwc:else>Send code</template>
                    </button>
                </form>
                <p class="login-link">Remembered it? <a href="#login" onclick={handleBackToLogin}>Back to Login</a></p>
            </template>

            <!-- STAGE 2: enter OTP + new password -->
            <template lwc:elseif={isResetStage}>
                <h2 class="card__title">Enter code &amp; new password</h2>
                <p class="card__subtitle">We sent a 6-digit code to <strong>{maskedEmail}</strong>. Enter it below with your new password.</p>
                <form class="form" onsubmit={handleReset}>
                    <div class="field">
                        <label>Verification code</label>
                        <input type="text" inputmode="numeric" maxlength="6" placeholder="6-digit code" value={otp} oninput={handleOtpInput} />
                    </div>
                    <div class="field">
                        <label>New password</label>
                        <input type="password" placeholder="At least 8 characters" value={newPassword} oninput={handleNewPassword} autocomplete="new-password" />
                    </div>
                    <div class="field">
                        <label>Confirm new password</label>
                        <input type="password" placeholder="Re-enter new password" value={confirmPassword} oninput={handleConfirmPassword} autocomplete="new-password" />
                    </div>
                    <template lwc:if={error}><p class="form-error">{error}</p></template>
                    <button type="submit" class="btn btn--primary btn--block" disabled={resetDisabled}>
                        <template lwc:if={isLoading}>Resetting…</template>
                        <template lwc:else>Verify &amp; reset password</template>
                    </button>
                </form>
                <p class="login-link">
                    <a href="#resend" onclick={handleResend} aria-disabled={resendDisabled}>{resendLabel}</a>
                    &nbsp;&middot;&nbsp;
                    <a href="#edit" onclick={handleEditEmail}>Change email</a>
                </p>
            </template>

            <!-- STAGE 3: success -->
            <template lwc:else>
                <div class="success">
                    <div class="success__ico" aria-hidden="true">&#10003;</div>
                    <h2 class="card__title">Password updated</h2>
                    <p class="card__subtitle">Your password has been reset. You can now sign in with your new password.</p>
                    <button type="button" class="btn btn--primary" onclick={handleBackToLogin}>Back to Login</button>
                </div>
            </template>
        </section>
    </div>
</template>
