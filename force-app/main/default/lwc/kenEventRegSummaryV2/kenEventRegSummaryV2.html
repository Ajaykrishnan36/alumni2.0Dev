<template>
    <header class="sm-head">
        <div>
            <h1 class="sm-title">Registration Summary</h1>
            <p class="sm-crumb">Home &rsaquo; Registered events</p>
        </div>
        <button type="button" class="back-btn" onclick={handleBack}>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Back
        </button>
    </header>

    <!-- Event card header -->
    <div class="sm-card-head">
        <h2 class="sm-event">{event.title}</h2>
        <div class="sm-meta">
            <span class="fmeta"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>{event.dateLabel}</span>
            <span class="fmeta"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"></path></svg>{event.formatLong}</span>
            <span class="fmeta"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"></path></svg>{event.language}</span>
            <template lwc:if={isCancelled}>
                <span class="cancel-flag">Event Cancelled by Host</span>
            </template>
            <template lwc:else>
                <button type="button" class="btn btn--danger" onclick={openCancel}>Cancel Registration</button>
            </template>
        </div>
    </div>

    <div class="sm-grid">
        <!-- Participant Details -->
        <section class="panel">
            <div class="panel__head">
                <h3 class="panel__title">Participant Details</h3>
                <div class="mini-search">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="search" placeholder="Search"/>
                </div>
            </div>
            <div class="tbl-wrap">
                <table class="tbl">
                    <thead>
                        <tr>
                            <th>Name</th><th>Contact</th><th>Type</th><th>Meals</th><th>Dietary Pref.</th><th>Custom Survey</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={participants} for:item="p">
                            <tr key={p.id}>
                                <td class="td-name">{p.name}</td>
                                <td class="td-contact">
                                    <span>{p.email}</span>
                                    <span class="muted">{p.phone}</span>
                                </td>
                                <td><span class={p.typePillClass}>{p.type}</span></td>
                                <td>
                                    <span class={p.mealsToggleClass}><span class="toggle__knob"></span></span>
                                </td>
                                <td>{p.diet}</td>
                                <td>
                                    <div class="survey-cell">
                                        <template lwc:if={p.surveyIsFill}>
                                            <button type="button" class="link-btn" onclick={handleSurvey}>Fill</button>
                                        </template>
                                        <template lwc:elseif={p.surveyIsDone}>
                                            <span class="chip chip--green">Completed</span>
                                        </template>
                                        <template lwc:else>
                                            <span class="muted">N/A</span>
                                        </template>
                                        <button type="button" class="icon-btn" title="Share" onclick={handleShare}>
                                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
            <div class="pager">
                <button type="button" class="pager__btn">&lsaquo; Previous</button>
                <span class="pager__pages">1 &nbsp; 2 &nbsp; … &nbsp; 8</span>
                <button type="button" class="pager__btn">Next &rsaquo;</button>
            </div>
        </section>

        <!-- Right rail -->
        <aside class="rail">
            <div class="rail__block">
                <h4 class="rail__h">Registered Sessions</h4>
                <ul class="sess-list">
                    <template for:each={sessions} for:item="s">
                        <li key={s.id} class="sess-row">
                            <div>
                                <p class="sess-row__day">{s.dayLabel}</p>
                                <p class="sess-row__title">{s.title}</p>
                            </div>
                            <span class="sess-row__price">{s.price}</span>
                        </li>
                    </template>
                </ul>
            </div>
            <div class="rail__block">
                <h4 class="rail__h">Payment Summary</h4>
                <div class="pay-row"><span>Session Fee</span><span>{payment.sessionFee}</span></div>
                <div class="pay-row pay-row--total"><span>Total Payable</span><span>{payment.totalPayable}</span></div>
                <button type="button" class="invoice-link" onclick={handleInvoice}>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    Download Invoice
                </button>
            </div>
        </aside>
    </div>

    <!-- ===== Cancellation modals ===== -->
    <template lwc:if={hasModal}>
        <div class="modal-backdrop" onclick={handleBackdrop}>
            <!-- Modal 1: bulk-booking warning -->
            <template lwc:if={isWarn}>
                <div class="modal modal--sm" onclick={stop}>
                    <div class="modal__icon">
                        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                    </div>
                    <h3 class="modal__title">Please note, this is a bulk booking!</h3>
                    <p class="modal__body">Cancelling will affect all participants and sessions registered under this booking. Are you sure you want to continue?</p>
                    <div class="modal__actions">
                        <button type="button" class="btn btn--outline" onclick={closeModal}>No</button>
                        <button type="button" class="btn btn--danger" onclick={confirmWarn}>Yes</button>
                    </div>
                </div>
            </template>

            <!-- Modal 2: select sessions to cancel -->
            <template lwc:elseif={isSelect}>
                <div class="modal modal--md" onclick={stop}>
                    <button type="button" class="modal__close" onclick={closeModal}>×</button>
                    <h3 class="modal__title">Select events that you want to cancel</h3>
                    <p class="modal__sub">Select the workshops that you would like to attend</p>

                    <label class="chk chk--all">
                        <input type="checkbox" checked={cancelAll} onchange={toggleAll}/>
                        <span>Cancel all events</span>
                    </label>

                    <div class="chk-list">
                        <template for:each={selectItems} for:item="i">
                            <label key={i.id} class="chk">
                                <input type="checkbox" data-id={i.id} checked={i.checked} onchange={toggleItem}/>
                                <span class="chk__main">
                                    <span class="chk__label">{i.label}</span>
                                    <span class="chk__sub">{i.sub}</span>
                                </span>
                                <span class="chk__price">{i.price}</span>
                            </label>
                        </template>
                    </div>

                    <div class="modal__actions">
                        <button type="button" class="btn btn--danger" disabled={cancelDisabled} onclick={doCancel}>Cancel Now</button>
                    </div>
                </div>
            </template>
        </div>
    </template>
</template>
