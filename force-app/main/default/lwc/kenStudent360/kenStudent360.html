                                    <div class="icon-list-row"><lightning-icon icon-name="utility:warning" size="x-small" class="amber-icon"></lightning-icon><div><strong>Mess</strong><p>Re-initiate at final semester</p></div><span class="status-pill status-pill--warn">Pending</span></div>
                                    <div class="icon-list-row"><lightning-icon icon-name="utility:success" size="x-small" class="green-icon"></lightning-icon><div><strong>Finance</strong><p>All instalments to date paid</p></div><span class="status-pill status-pill--good">Cleared</span></div>
                                    <div class="icon-list-row"><lightning-icon icon-name="utility:warning" size="x-small" class="amber-icon"></lightning-icon><div><strong>Lab / dept.</strong><p>Re-initiate at final semester</p></div><span class="status-pill status-pill--warn">Pending</span></div>
                                    <div class="icon-list-row"><lightning-icon icon-name="utility:info" size="x-small"></lightning-icon><div><strong>IT assets</strong><p>Re-initiate at final semester</p></div><span class="status-pill status-pill--muted">Not Initiated</span></div>

                <section class="rail-card rail-card--attention">
                    <div class="rail-card__head">
                        <h3>Needs attention</h3>
                        <span class="status-pill status-pill--warn">3 Open</span>
                    </div>
                    <template for:each={attentionItems} for:item="item">
                        <article key={item.id} class="attention-item">
                            <div><lightning-icon icon-name={item.iconName} size="x-small"></lightning-icon></div>
                            <div><strong>{item.title}</strong><a>{item.action} ›</a></div>
                        </article>
                    </template>
                </section>

                <section class="rail-card">
                    <div class="rail-card__head"><h3>Recent activity</h3></div>
                    <template for:each={activityItems} for:item="activity">
                        <article key={activity.id} class="activity-item">
                            <div><lightning-icon icon-name={activity.iconName} size="x-small"></lightning-icon></div>
                            <strong>{activity.title}</strong>
                            <span>{activity.when}</span>
                        </article>
                    </template>
                </section>

                <section class="rail-card">
                    <div class="rail-card__head"><h3>Quick actions</h3></div>
                    <div class="quick-actions">
                        <button><lightning-icon icon-name="utility:comments" size="x-small"></lightning-icon><span>Send Message</span></button>
                        <button><lightning-icon icon-name="utility:add" size="x-small"></lightning-icon><span>Add Note</span></button>
                        <button><lightning-icon icon-name="utility:case" size="x-small"></lightning-icon><span>Raise Case</span></button>
                        <button><lightning-icon icon-name="utility:upload" size="x-small"></lightning-icon><span>Upload Document</span></button>
                        <button><lightning-icon icon-name="utility:pulse" size="x-small"></lightning-icon><span>Update Risk Status</span></button>
                    </div>
                </section>

                <section class="rail-card">
                    <div class="rail-card__head"><h3>Record health</h3></div>
                    <template for:each={healthItems} for:item="item">
                        <article key={item.id} class="health-item">
                            <lightning-icon icon-name={item.iconName} size="x-small" class={item.iconClass}></lightning-icon>
                            <strong>{item.title}</strong>
                            <span>{item.note}</span>
                        </article>
                    </template>
                </section>
            </aside>
        </section>
    </main>
</template>
