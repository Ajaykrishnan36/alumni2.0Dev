<template>
    <div class={appClass} data-brand={brand} data-view={view}>
        <aside class="a2-sidebar">
            <a class="a2-profile" href="/my-profile" title="View my profile">
                <div class="a2-profile__avatar">{userInitials}</div>
                <div class="a2-profile__main">
                    <div class="a2-profile__name-row">
                        <span class="a2-profile__name">{userName}</span>
                        <button type="button" class="a2-profile__gear" title="Settings" onclick={handleGearClick}>&#9881;</button>
                    </div>
                    <p class="a2-profile__meta">{profileMeta}</p>
                    <div class="a2-profile__chips">
                        <template lwc:if={showLocationChip}>
                            <span class="a2-profile__chip">{userLocation}</span>
                        </template>
                        <template lwc:if={showRoleChip}>
                            <span class="a2-profile__chip">{userTitleCompany}</span>
                        </template>
                    </div>
                </div>
            </a>
            <nav class="a2-nav">
                <a class={homeNavClass} href="/">
                    <span class="a2-nav__icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v9a2 2 0 0 1-2 2h-4v-7H10v7H6a2 2 0 0 1-2-2z"></path></svg>
                    </span>
                    <span class="a2-nav__label">Home</span>
                </a>
                <a class={eventsNavClass} href="/events">
                    <span class="a2-nav__icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19 4H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path><path d="M16 2v4M8 2v4M3 10h18"></path></svg>
                    </span>
                    <span class="a2-nav__label">Events</span>
                </a>
                <a class={jobsNavClass} href="/jobs">
                    <span class="a2-nav__icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"></rect><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><path d="M3 13h18"></path></svg>
                    </span>
                    <span class="a2-nav__label">Jobs</span>
                </a>
                <a class={networkNavClass} href="/network">
                    <span class="a2-nav__icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"></circle><circle cx="17" cy="8" r="3"></circle><path d="M3 20c0-3 2-5 6-5s6 2 6 5"></path><path d="M14 20c0-2.5 2-4.5 5-4.5"></path></svg>
                    </span>
                    <span class="a2-nav__label">Network</span>
                </a>
                <a class={mentorshipNavClass} href="/mentorship">
                    <span class="a2-nav__icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="3"></circle><path d="M5 21c0-4 3-7 7-7s7 3 7 7"></path><path d="M16 5l3-2 0 4-3 0z"></path></svg>
                    </span>
                    <span class="a2-nav__label">Mentorship</span>
                </a>
                <a class={givingNavClass} href="/giving">
                    <span class="a2-nav__icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                    </span>
                    <span class="a2-nav__label">Giving</span>
                </a>
                <a class={groupsNavClass} href="/groups">
                    <span class="a2-nav__icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"></circle><circle cx="17" cy="9" r="2.6"></circle><path d="M2 20c0-3.3 3-6 7-6s7 2.7 7 6"></path><path d="M15 20c0-2.4 2-4.4 5-4.4"></path></svg>
                    </span>
                    <span class="a2-nav__label">Groups</span>
                </a>
                <a class={feedbackNavClass} href="/feedback">
                    <span class="a2-nav__icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="2"></rect><path d="M7 10h10M7 13h6"></path><path d="M9 18l-2 3v-3"></path></svg>
                    </span>
                    <span class="a2-nav__label">Feedback &amp; Survey</span>
                    <template lwc:if={showFeedbackDot}>
                        <span class="a2-nav__dot" title="Unread items"></span>
                    </template>
                </a>
                <a class={businessNavClass} href="/business">
                    <span class="a2-nav__icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"></rect><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><path d="M3 13h18"></path><circle cx="12" cy="13" r="1" fill="currentColor"></circle></svg>
                    </span>
                    <span class="a2-nav__label">Business Directory</span>
                </a>
                <a class={supportNavClass} href="/support">
                    <span class="a2-nav__icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="2"></rect><path d="M9 10c0-1.5 1.3-2.5 3-2.5s3 1 3 2.5c0 1.5-2 2-2 3.5"></path><circle cx="13" cy="16" r="0.8" fill="currentColor"></circle></svg>
                    </span>
                    <span class="a2-nav__label">Service &amp; Support</span>
                </a>
            </nav>
            <div class="a2-brand">
                <div class="a2-brand__logo">{brandLogoLetter}</div>
                <div class="a2-brand__text">
                    <p class="a2-brand__name">{brandName}</p>
                    <p class="a2-brand__sub">Powered by Ken42</p>
                </div>
            </div>
        </aside>

        <div class="a2-main">
            <header class="a2-topbar">
                <h1 class="a2-topbar__title">{topbarTitle}</h1>
                <div class="a2-topbar__search">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" onclick={handleGlobalSearchClick} style="cursor:pointer;"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" placeholder="Search alumni, ask KAI, or start an action..." value={globalSearchTerm} oninput={handleGlobalSearchInput} onkeydown={handleGlobalSearchKey}/>
                    <span class="a2-topbar__kai">&#10022; KAI</span>
                </div>
                <div class="a2-topbar__icons">
                    <a class="a2-icon-btn" href="/calendar" title="Calendar">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                    </a>
                    <a class="a2-icon-btn" href="/chat" title="Chat">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    </a>
                    <a class="a2-icon-btn" href="/settings" title="Settings">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                    </a>
                    <button type="button" class="a2-icon-btn a2-bell-btn" title="Notifications" onclick={handleBellClick}>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                        <template lwc:if={hasNotifCount}>
                            <span class="a2-dot a2-dot--count">{notifCountLabel}</span>
                        </template>
                    </button>
                    <template lwc:if={showNotifications}>
                        <c-ken-notifications-popover-v2
                            onclose={handleCloseNotifications}
                            onprocessed={handleNotifProcessed}>
                        </c-ken-notifications-popover-v2>
                    </template>
                    <button class="a2-icon-btn a2-icon-btn--logout" title="Sign out" onclick={handleLogout} type="button">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                    </button>
                </div>
            </header>
            <div class="a2-content">
                <slot></slot>
            </div>
        </div>

        <template lwc:if={hasRail}>
            <aside class="a2-right-rail">
                <slot name="rail"></slot>
            </aside>
        </template>
    </div>
</template>
