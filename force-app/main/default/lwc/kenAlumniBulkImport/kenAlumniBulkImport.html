<template>
    <section class="upload-stage">
        <div class="section-title upload-stage-title">Bulk Import Alumni Records</div>
        <div class="import-controls">
            <div class="upload-layout">
                <div class="file-area">
                    <div class="file-card">
                        <div class="provider-group upload-provider-group">
                            <div class="field-group">
                                <label class="field-label">Data Source</label>
                                <lightning-combobox
                                    variant="label-hidden"
                                    name="dataSource"
                                    label="Data Source"
                                    value={selectedDataSource}
                                    placeholder="Select data source"
                                    options={dataSourceOptions}
                                    onchange={handleDataSourceChange}
                                ></lightning-combobox>
                            </div>
                        </div>
                        <template if:false={hasFile}>
                            <div class="file-content">
                                <div class="file-icon" aria-hidden="true">
                                    <lightning-icon icon-name="doctype:csv" size="medium"></lightning-icon>
                                </div>
                                <div class="file-meta">
                                    <div class="file-title">Drag and drop CSV file here</div>
                                    <div class="file-subtitle">or choose a file to continue.</div>
                                </div>
                                <div class="file-actions">
                                    <input id="alumniImportFileInput" class="hidden-input" type="file" accept=".csv"
                                        onchange={handleFileChange} />
                                    <label for="alumniImportFileInput" class="file-button">Choose file</label>
                                </div>
                            </div>
                        </template>
                        <template if:true={hasFile}>
                            <div class="selected-file-card">
                                <div class="selected-file-main">
                                    <div class="file-icon" aria-hidden="true">
                                        <lightning-icon icon-name="doctype:csv" size="medium"></lightning-icon>
                                    </div>
                                    <div class="selected-file-copy">
                                        <span class="selected-file-name">{fileName}</span>
                                        <div class="selected-file-meta">
                                            <span class="selected-file-count">{rows.length} rows</span>
                                        </div>
                                    </div>
                                </div>
                                <lightning-button-icon
                                    class="selected-file-delete"
                                    icon-name="utility:delete"
                                    alternative-text="Remove file"
                                    title="Remove file"
                                    onclick={handleDeleteFile}
                                    variant="bare">
                                </lightning-button-icon>
                            </div>
                        </template>
                    </div>
                </div>
                <div class="action-panel">
                    <div class="actions">
                        <lightning-button label="Download Template" icon-name="utility:download"
                            onclick={handleDownloadTemplate} stretch></lightning-button>
                        <lightning-button label="View Help" icon-name="utility:info"
                            onclick={handleOpenHelp} stretch></lightning-button>
                        <template if:true={hasFailures}>
                            <lightning-button label="Download Failed" icon-name="utility:download"
                                onclick={handleDownloadFailed} stretch></lightning-button>
                        </template>
                        <lightning-button class="import-button" label="Import" variant="brand" icon-name="utility:upload"
                            onclick={handleImport} disabled={importDisabled} stretch></lightning-button>
                    </div>
                    <template if:true={showStatus}>
                        <div class="batch-status">
                            Status: {jobStatus} - Processed {processedDisplay}/{totalRecords} - Skipped {failedCount}
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </section>

    <template if:true={hasFailures}>
        <section class="import-section slds-m-top_medium">
            <div class="section-title">Skipped Rows ({failedCount})</div>
            <div class="preview">
                <div class="failures-header">
                    <span>{processedSuccess} row(s) imported. The rows below were skipped — fix them and re-import.</span>
                    <div class="failures-actions">
                        <lightning-button label="Download Failed" icon-name="utility:download"
                            onclick={handleDownloadFailed} disabled={failedDownloadDisabled}></lightning-button>
                        <lightning-button label="Dismiss" onclick={handleDismissResults}></lightning-button>
                    </div>
                </div>
                <div class="preview-table-wrap">
                    <table class="preview-table">
                        <thead>
                            <tr>
                                <th>Row</th>
                                <th>Reason</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={failureList} for:item="failure">
                                <tr key={failure.key}>
                                    <td>{failure.rowLabel}</td>
                                    <td>{failure.message}</td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </template>

    <template if:true={showPreview}>
        <section class="import-section slds-m-top_medium" data-preview-section>
            <div class="section-title">Import Preview</div>
            <div class="preview">
                <div class="preview-header">
                    <div class="preview-title">Preview</div>
                    <div class="preview-meta">Showing {displayedRows.length} of {filteredRows.length}</div>
                </div>
                <template if:true={hasFile}>
                    <div class="preview-controls">
                        <div class="search-group">
                            <lightning-icon icon-name="utility:search" size="x-small" class="search-icon"></lightning-icon>
                            <input class="search-input" type="search" placeholder="Search..." oninput={handleSearchChange} />
                        </div>
                        <div class="page-size-group">
                            <label class="page-size-label">Rows:</label>
                            <select class="page-size-select" onchange={handlePageSizeChange} value={pageSizeValue}>
                                <option value="10">10</option>
                                <option value="5">5</option>
                                <option value="25">25</option>
                                <option value="2147483647">All</option>
                            </select>
                        </div>
                    </div>
                </template>
                <div class="sort-status" if:true={sortActive}>Sorted by {sortStatusText}</div>
                <div class="preview-table-wrap">
                    <table class="preview-table">
                        <thead>
                            <tr>
                                <template for:each={previewHeaders} for:item="header">
                                    <th key={header.field} data-field={header.field} class="sortable" onclick={handleSort}>{header.label}</th>
                                </template>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={previewRowValues} for:item="row">
                                <tr key={row.rowKey}>
                                    <template for:each={row.cells} for:item="cell">
                                        <td key={cell.key}>{cell.value}</td>
                                    </template>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
                <div class="pagination">
                    <lightning-button class="page-btn" label="Previous" onclick={handlePrevPage}
                        disabled={prevDisabled}></lightning-button>
                    <span class="page-info">Page {currentPage} of {totalPages}</span>
                    <lightning-button class="page-btn" label="Next" onclick={handleNextPage}
                        disabled={nextDisabled}></lightning-button>
                </div>
            </div>
        </section>
    </template>

    <template if:true={showHelpModal}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="alumni-import-help-heading"
            class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container import-help-modal">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title="Close" onclick={handleCloseHelp}>
                        <lightning-icon icon-name="utility:close" alternative-text="Close" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="alumni-import-help-heading" class="slds-text-heading_medium">Alumni Bulk Import Help</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium import-help-content">
                    <ul class="import-help-list">
                        <li><span>Data Source</span> tags every imported record for traceability (Historic Records or Old Portal Migration).</li>
                        <li><span>Email</span> is required and is the unique key — rows with a blank or invalid email are skipped.</li>
                        <li>If an alumni with the same email already exists, the record is <span>updated, not duplicated</span>, and flagged as a possible duplicate.</li>
                        <li><span>Registration Number</span> distinguishes multiple programs for the same person.</li>
                        <li><span>Program</span> accepts a program record Id or a program name. A name that matches a program record is stored as that record's Id; any other value is kept as plain text.</li>
                        <li><span>Status</span> sets the alumni's registration stage — one of Unregistered, Verified, Registered, or Initial Login Done.</li>
                        <li><span>Year of Enrollment</span> is a 4-digit year and must be earlier than the Year of Graduation.</li>
                        <li><span>Specialization</span> must match an existing picklist value; an unknown value skips the row.</li>
                        <li><span>Nationality, Gender and Blood Group</span> must match an existing picklist value where the org defines one; an unknown value skips the row.</li>
                        <li><span>Personal &amp; contact</span> columns (Date of Birth, Nationality, Gender, Blood Group, LinkedIn URL, Languages Known, Address) populate the alumni's profile and the Alumni 360 Overview.</li>
                        <li><span>Current Company / Designation / Location</span> create the alumnus's current job in their career history (Alumni 360 Career tab).</li>
                        <li><span>Education</span> uses separate columns per level — <span>10th, 12th, Bachelors, Masters</span>. Fill in only the levels you have; each becomes one education record on Alumni 360 &gt; Academic Record.</li>
                        <li><span>Grade Type</span> columns must be one of: <span>Percentage, CGPA, GPA, Letter Grade</span>.</li>
                        <li><span>Date</span> columns (Date of Birth, Employment Start Date) use <span>YYYY-MM-DD</span> (DD/MM/YYYY is also accepted).</li>
                        <li>Partial data is fine — missing optional columns do not block the import.</li>
                    </ul>
                    <p class="import-help-legend"><abbr class="import-help-required" title="Required column">*</abbr> indicates a required column. All other columns are optional.</p>
                    <div class="import-help-example-title">Example row</div>
                    <div class="import-help-table-wrap">
                        <table class="import-help-table">
                            <thead>
                                <tr>
                                    <template for:each={helpExampleHeaders} for:item="header">
                                        <th key={header.key}>{header.label}<template if:true={header.required}><abbr class="import-help-required" title="Required column">*</abbr></template></th>
                                    </template>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <template for:each={helpExampleRow} for:item="cell">
                                        <td key={cell.key}>{cell.value}</td>
                                    </template>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Close" onclick={handleCloseHelp}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
