<template>
  <template if:true={showLoader}>
    <div class="loading-spinner">
      <lightning-spinner
        alternative-text={loadingText}
        size="medium"
      ></lightning-spinner>
    </div>
  </template>

  <div class="profile-page">
    <!-- Profile Header (same as kenAlumniDetailView) -->
    <c-ken-profile-header
      name={profileData.name}
      title={profileData.title}
      company={profileData.company}
      location={profileData.location}
      profile-image={profileData.profileImage}
      is-online={profileData.isOnline}
      batch={profileData.batch}
      expertise={profileData.expertise}
      education={educationLine}
      email={profileData.email}
      phone={profileData.phone}
      linkedin={profileData.linkedin}
      willing-to-help={profileData.willingToHelp}
      is-my-profile={isMyProfile}
      onopenchat={handleMessage}
      oneditprofile={navigateToSettings}
    ></c-ken-profile-header>

    <!-- Stepper Tabs -->
    <div class="ken-tabs">
      <button class={personalDetailsTabClass} onclick={selectPersonalDetails}>
        Personal Details
      </button>
      <button class={educationCareerTabClass} onclick={selectEducationCareer}>
        Education & Career
      </button>
      <button class={achievementsTabClass} onclick={selectAchievements}>
        Achievements
      </button>
      <button class={engagementTabClass} onclick={selectEngagement}>
        Engagement
      </button>
      <button class={supportTabClass} onclick={selectSupport}>Support</button>
      <!-- Payments tab hidden until real payment data is wired up. The panel below
                 and its handlers are left intact - restore by putting this button back:
                 <button class={paymentsTabClass} onclick={selectPayments}>Payments</button> -->
    </div>

    <!-- Chatbox Overlay -->
    <template if:true={showChatbox}>
      <div class={chatContainerClass}>
        <div class="chatbox-header">
          <div class="chat-user-info">
            <div class="chat-avatar-container">
              <img
                src={profileData.profileImage}
                alt={profileData.name}
                class="chat-avatar"
                onerror={handleImageError}
              />
              <template if:true={profileData.isOnline}>
                <span class="chat-online-indicator"></span>
              </template>
            </div>
            <span class="chat-username">{profileData.name}</span>
          </div>
          <div class="chat-actions">
            <button
              class="chat-action-btn"
              onclick={handleToggleExpand}
              title="Expand/Contract"
            >
              <lightning-icon
                icon-name={chatExpandIcon}
                size="x-small"
              ></lightning-icon>
            </button>
            <button
              class="chat-action-btn"
              onclick={handleCloseChat}
              title="Close"
            >
              <lightning-icon
                icon-name="utility:close"
                size="x-small"
              ></lightning-icon>
            </button>
          </div>
        </div>

        <div class="chatbox-body">
          <template for:each={displayMessages} for:item="msg">
            <template if:true={msg.isDateSeparator}>
              <div class="timeline-separator" key={msg.id}>
                <span class="timeline-date">{msg.dateLabel}</span>
              </div>
            </template>
            <template if:true={msg.isReceived}>
              <div class="message received" key={msg.id}>
                <div class="message-bubble received-bubble">
                  <p>{msg.text}</p>
                  <span class="message-time">{msg.time}</span>
                </div>
              </div>
            </template>
            <template if:true={msg.isSent}>
              <div class="message sent" key={msg.id}>
                <div class="sent-user-row">
                  <span>You</span>
                  <div class="sent-avatar-placeholder"></div>
                </div>
                <div class="message-bubble sent-bubble">
                  <p>{msg.text}</p>
                  <span class="message-time">{msg.time}</span>
                </div>
              </div>
            </template>
          </template>
        </div>

        <div class="chatbox-footer">
          <div class="chat-input-wrapper">
            <input
              type="text"
              placeholder="Type here"
              class="chat-input"
              value={messageInput}
              oninput={handleInputChange}
              onkeyup={handleInputKeyup}
            />
            <button class="attach-btn">
              <lightning-icon
                icon-name="utility:attach"
                size="x-small"
                class="attach-icon"
              ></lightning-icon>
            </button>
          </div>
          <button class="send-btn" onclick={handleSendMessage}>
            <lightning-icon
              icon-name="utility:send"
              size="x-small"
              class="send-icon"
            ></lightning-icon>
          </button>
        </div>
      </div>
    </template>

    <!-- Main Content -->
    <!-- ============ PERSONAL DETAILS ============ -->
    <template if:true={isPersonalDetails}>
      <div class="profile-content personal-details-grid">
        <!-- Row 1: Alumna Snapshot / Record Health -->
        <div class="section info-group">
          <div class="section-header-row">
            <div class="card-heading">
              <p class="section-title">{alumnaSnapshotGroup.title}</p>
            </div>
            <template if:true={alumnaSnapshotGroup.showEditButton}>
              <button
                type="button"
                class="ken-edit-icon-btn"
                onclick={navigateToSettings}
                title="Edit in Settings"
              >
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 20 20"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M11.7167 7.51667L12.4833 8.28333L4.93333 15.8333H4.16667V15.0667L11.7167 7.51667ZM14.7167 2.5C14.5083 2.5 14.2917 2.58333 14.1333 2.74167L12.6083 4.26667L15.7333 7.39167L17.2583 5.86667C17.5833 5.54167 17.5833 5.01667 17.2583 4.69167L15.3083 2.74167C15.1417 2.575 14.9333 2.5 14.7167 2.5ZM11.7167 5.15833L2.5 14.375V17.5H5.625L14.8417 8.28333L11.7167 5.15833Z"
                    fill="var(--primary-color)"
                  />
                </svg>
              </button>
            </template>
          </div>
          <template if:true={alumnaSnapshotGroup.note}>
            <p class="info-group-note">{alumnaSnapshotGroup.note}</p>
          </template>
          <div class="personal-info-grid">
            <template for:each={alumnaSnapshotGroup.fields} for:item="f">
              <div class="personal-info-field" key={f.key}>
                <span class="personal-info-label">{f.label}</span>
                <span class={f.valueClass}>{f.value}</span>
              </div>
            </template>
          </div>
        </div>

        <div class="section">
          <div class="section-header-row">
            <div class="card-heading">
              <span class="card-heading-icon">
                <svg
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="var(--primary-color)"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <circle cx="12" cy="12" r="10" />
                  <path d="m9 12 2 2 4-4" />
                </svg>
              </span>
              <p class="section-title">Record Health</p>
            </div>
          </div>
          <template if:true={hasRecordHealth}>
            <div class="record-health-list">
              <template for:each={recordHealthDisplay} for:item="h">
                <div class="record-health-item" key={h.key}>
                  <template if:true={h.ok}>
                    <svg
                      width="16"
                      height="16"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="#047857"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <circle cx="12" cy="12" r="10" />
                      <path d="m9 12 2 2 4-4" />
                    </svg>
                  </template>
                  <template if:false={h.ok}>
                    <svg
                      width="16"
                      height="16"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="#b45309"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <circle cx="12" cy="12" r="10" />
                      <path d="M12 8v4M12 16h.01" />
                    </svg>
                  </template>
                  <span class="record-health-label">{h.label}</span>
                  <template if:true={h.missingNote}>
                    <span class="record-health-note">{h.missingNote}</span>
                  </template>
                </div>
              </template>
            </div>
          </template>
        </div>

        <!-- Row 2: Personal Details / Recent Activity -->
        <div class="section info-group">
          <div class="section-header-row">
            <div class="card-heading">
              <p class="section-title">{personalDetailsGroup.title}</p>
            </div>
            <template if:true={personalDetailsGroup.showEditButton}>
              <button
                type="button"
                class="ken-edit-icon-btn"
                onclick={navigateToSettings}
                title="Edit in Settings"
              >
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 20 20"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M11.7167 7.51667L12.4833 8.28333L4.93333 15.8333H4.16667V15.0667L11.7167 7.51667ZM14.7167 2.5C14.5083 2.5 14.2917 2.58333 14.1333 2.74167L12.6083 4.26667L15.7333 7.39167L17.2583 5.86667C17.5833 5.54167 17.5833 5.01667 17.2583 4.69167L15.3083 2.74167C15.1417 2.575 14.9333 2.5 14.7167 2.5ZM11.7167 5.15833L2.5 14.375V17.5H5.625L14.8417 8.28333L11.7167 5.15833Z"
                    fill="var(--primary-color)"
                  />
                </svg>
              </button>
            </template>
          </div>
          <template if:true={personalDetailsGroup.note}>
            <p class="info-group-note">{personalDetailsGroup.note}</p>
          </template>
          <div class="personal-info-grid">
            <template for:each={personalDetailsGroup.fields} for:item="f">
              <div class="personal-info-field" key={f.key}>
                <span class="personal-info-label">{f.label}</span>
                <span class={f.valueClass}>{f.value}</span>
              </div>
            </template>
          </div>
        </div>

        <template if:true={hasRecentActivity}>
          <div class="section">
            <div class="section-header-row">
              <div class="card-heading">
                <span class="card-heading-icon">
                  <svg
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="var(--primary-color)"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <circle cx="12" cy="12" r="9" />
                    <path d="M12 7v5l3 3" />
                  </svg>
                </span>
                <p class="section-title">Recent Activity</p>
              </div>
            </div>
            <div class="recent-activity-list">
              <template for:each={recentActivityDisplay} for:item="a">
                <div class="recent-activity-item" key={a.key}>
                  <lightning-icon
                    icon-name={a.iconName}
                    size="x-small"
                    class="recent-activity-icon"
                  ></lightning-icon>
                  <span class="recent-activity-title">{a.title}</span>
                  <span class="recent-activity-when">{a.when_x}</span>
                </div>
              </template>
            </div>
          </div>
        </template>

        <!-- Row 3: Contact Details / LinkedIn Sync -->
        <div class="section info-group">
          <div class="section-header-row">
            <div class="card-heading">
              <p class="section-title">{contactDetailsGroup.title}</p>
            </div>
            <template if:true={contactDetailsGroup.showEditButton}>
              <button
                type="button"
                class="ken-edit-icon-btn"
                data-focus="linkedin"
                onclick={navigateToSettings}
                title="Edit in Settings"
              >
                <svg
                  width="20"
                  height="20"
                  viewBox="0 0 20 20"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M11.7167 7.51667L12.4833 8.28333L4.93333 15.8333H4.16667V15.0667L11.7167 7.51667ZM14.7167 2.5C14.5083 2.5 14.2917 2.58333 14.1333 2.74167L12.6083 4.26667L15.7333 7.39167L17.2583 5.86667C17.5833 5.54167 17.5833 5.01667 17.2583 4.69167L15.3083 2.74167C15.1417 2.575 14.9333 2.5 14.7167 2.5ZM11.7167 5.15833L2.5 14.375V17.5H5.625L14.8417 8.28333L11.7167 5.15833Z"
                    fill="var(--primary-color)"
                  />
                </svg>
              </button>
            </template>
          </div>
          <template if:true={contactDetailsGroup.note}>
            <p class="info-group-note">{contactDetailsGroup.note}</p>
          </template>
          <div class="personal-info-grid">
            <template for:each={contactDetailsGroup.fields} for:item="f">
              <div class="personal-info-field" key={f.key}>
                <span class="personal-info-label">{f.label}</span>
                <span class={f.valueClass}>{f.value}</span>
              </div>
            </template>
          </div>
        </div>

        <template if:true={isMyProfile}>
          <c-ken-linked-in-sync-button
            class="linkedin-sync-card"
            record-id={profileData.accountId}
            show-setup-link
            data-focus="linkedin"
            onsynccomplete={handleLinkedInSyncComplete}
            onsetupclick={navigateToSettings}
          ></c-ken-linked-in-sync-button>
        </template>
      </div>
    </template>

    <!-- ============ EDUCATION & CAREER ============ -->
    <template if:true={isEducationCareer}>
      <div class="profile-content achievements-tab-content">
        <div class="left-column achievements-column-full">
          <div class="section personal-details-section">
            <div class="personal-details-content">
              <div class="section-header-row">
                <h3 class="subsection-title">Career</h3>
                <template if:true={isMyProfile}>
                  <button
                    type="button"
                    class="ken-edit-icon-btn ken-add-btn"
                    onclick={openAddExperience}
                  >
                    <svg
                      width="20"
                      height="20"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="var(--primary-color)"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <line x1="12" y1="5" x2="12" y2="19"></line>
                      <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                  </button>
                </template>
              </div>
              <div class="experience-list">
                <template if:true={hasExperienceRecords}>
                  <template for:each={profileData.experience} for:item="exp">
                    <c-ken-experience-card
                      key={exp.id}
                      record-id={exp.id}
                      position={exp.position}
                      company={exp.company}
                      employment-type={exp.employmentType}
                      location={exp.location}
                      work-type={exp.workType}
                      duration={exp.duration}
                      is-current={exp.isCurrentJob}
                      company-logo={exp.companyLogo}
                      description={exp.description}
                      is-my-profile={isMyProfile}
                      onedit={handleEditExperience}
                      ondelete={handleDeleteExperience}
                    ></c-ken-experience-card>
                  </template>
                </template>
                <template if:false={hasExperienceRecords}>
                  <div class="empty-state">
                    <span class="empty-state-icon">
                      <svg
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      >
                        <rect x="2" y="7" width="20" height="14" rx="2" />
                        <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" />
                      </svg>
                    </span>
                    <p class="empty-state-text">
                      No experience records added yet.
                    </p>
                  </div>
                </template>
              </div>
            </div>
          </div>

          <div class="section personal-details-section">
            <div class="personal-details-content">
              <div class="section-header-row">
                <h3 class="subsection-title">Educational Background</h3>
                <template if:true={isMyProfile}>
                  <button
                    type="button"
                    class="ken-edit-icon-btn ken-add-btn"
                    onclick={openAddEducation}
                  >
                    <svg
                      width="20"
                      height="20"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="var(--primary-color)"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <line x1="12" y1="5" x2="12" y2="19"></line>
                      <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                  </button>
                </template>
              </div>
              <div class="education-list">
                <template if:true={hasEducationRecords}>
                  <template for:each={profileData.education} for:item="edu">
                    <c-ken-education-card
                      key={edu.id}
                      record-id={edu.id}
                      degree={edu.degree}
                      institution={edu.institution}
                      program={edu.programName}
                      duration={edu.duration}
                      score={edu.score}
                      logo={edu.logo}
                      is-my-profile={isMyProfile}
                      onedit={handleEditEducation}
                      ondelete={handleDeleteEducation}
                    ></c-ken-education-card>
                  </template>
                </template>
                <template if:false={hasEducationRecords}>
                  <div class="empty-state">
                    <span class="empty-state-icon">
                      <svg
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.5"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      >
                        <path d="M22 10v6M2 10l10-5 10 5-10 5-10-5z" />
                        <path d="M6 12v5c3 3 9 3 12 0v-5" />
                      </svg>
                    </span>
                    <p class="empty-state-text">
                      No education records added yet.
                    </p>
                  </div>
                </template>
              </div>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- ============ ACHIEVEMENTS ============ -->
    <template if:true={isAchievements}>
      <div class="profile-content achievements-tab-content">
        <div class="left-column achievements-column-full">
          <div class="section personal-details-section">
            <div class="personal-details-content">
              <div class="section-header-row">
                <h3 class="subsection-title">Achievements</h3>
                <template if:true={isMyProfile}>
                  <button
                    type="button"
                    class="ken-edit-icon-btn ken-add-btn"
                    onclick={openAddAchievement}
                  >
                    <svg
                      width="20"
                      height="20"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="var(--primary-color)"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <line x1="12" y1="5" x2="12" y2="19"></line>
                      <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                  </button>
                </template>
              </div>
              <div class="achievements-list">
                <template if:true={hasAchievementRecords}>
                  <template for:each={profileData.achievements} for:item="ach">
                    <c-ken-achievement-card
                      key={ach.id}
                      record-id={ach.id}
                      type={ach.type}
                      title={ach.title}
                      meta={ach.meta}
                      description={ach.description}
                      is-my-profile={isMyProfile}
                      onedit={handleEditAchievement}
                      ondelete={handleDeleteAchievement}
                    ></c-ken-achievement-card>
                  </template>
                </template>
                <template if:false={hasAchievementRecords}>
                  <p class="empty-record-note">No achievements added yet.</p>
                </template>
              </div>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- ============ ENGAGEMENT ============ -->
    <template if:true={isEngagement}>
      <div class="kpi-row">
        <div class="kpi-card">
          <span class="kpi-label">Events Attended</span>
          <span class="kpi-value">{engagementData.eventsAttendedCount}</span>
        </div>
        <div class="kpi-card">
          <span class="kpi-label">Active Mentees</span>
          <span class="kpi-value">{engagementData.activeMenteesCount}</span>
        </div>
        <div class="kpi-card">
          <span class="kpi-label">Total Referrals</span>
          <span class="kpi-value">{engagementData.totalReferralsCount}</span>
        </div>
        <div class="kpi-card">
          <span class="kpi-label">Talks on Campus</span>
          <span class="kpi-value">{engagementData.talksOnCampusCount}</span>
        </div>
      </div>

      <div class="profile-content">
        <div class="left-column">
          <div class="section">
            <div class="section-header-row">
              <div class="card-heading">
                <span class="card-heading-icon">
                  <svg
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="var(--primary-color)"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <rect x="3" y="4" width="18" height="18" rx="2" />
                    <path d="M16 2v4M8 2v4M3 10h18" />
                  </svg>
                </span>
                <h3 class="subsection-title">Events Attended</h3>
              </div>
            </div>
            <div class="education-list">
              <template if:true={hasEventsAttended}>
                <template
                  for:each={engagementData.eventsAttended}
                  for:item="ev"
                >
                  <div class="record-card" key={ev.id}>
                    <div>
                      <div class="record-card-title">{ev.title}</div>
                      <div class="record-card-meta">
                        {ev.details} · {ev.when_x}
                      </div>
                    </div>
                  </div>
                </template>
              </template>
              <template if:false={hasEventsAttended}>
                <div class="empty-state">
                  <span class="empty-state-icon">
                    <svg
                      width="20"
                      height="20"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.5"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <rect x="3" y="4" width="18" height="18" rx="2" />
                      <path d="M16 2v4M8 2v4M3 10h18" />
                    </svg>
                  </span>
                  <p class="empty-state-text">No events attended yet.</p>
                </div>
              </template>
            </div>
          </div>
        </div>

        <div class="right-column">
          <div class="section">
            <div class="section-header-row">
              <div class="card-heading">
                <span class="card-heading-icon">
                  <svg
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="var(--primary-color)"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                    <circle cx="9" cy="7" r="4" />
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                    <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                  </svg>
                </span>
                <p class="section-title">Mentorship</p>
              </div>
            </div>
            <div class="education-list">
              <template if:true={hasMentorship}>
                <template for:each={mentorshipRows} for:item="m">
                  <div class="record-card record-card-avatar" key={m.id}>
                    <span class="avatar-chip">{m.initials}</span>
                    <div class="record-card-row">
                      <div class="record-card-title">{m.name}</div>
                      <span class={m.statusTone}>{m.status}</span>
                    </div>
                    <div class="record-card-meta">
                      {m.sessions} · Since {m.since}
                    </div>
                  </div>
                </template>
              </template>
              <template if:false={hasMentorship}>
                <div class="empty-state">
                  <span class="empty-state-icon">
                    <svg
                      width="20"
                      height="20"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.5"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                      <circle cx="9" cy="7" r="4" />
                      <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                      <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                    </svg>
                  </span>
                  <p class="empty-state-text">No mentorship activity yet.</p>
                </div>
              </template>
            </div>
          </div>
        </div>
      </div>
    </template>

    <!-- ============ SUPPORT ============ -->
    <template if:true={isSupport}>
      <div class="profile-content achievements-tab-content">
        <div class="left-column achievements-column-full">
          <div class="section">
            <div class="section-header-row">
              <div class="card-heading">
                <span class="card-heading-icon">
                  <svg
                    width="16"
                    height="16"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="var(--primary-color)"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
                    <path
                      d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"
                    />
                  </svg>
                </span>
                <h3 class="subsection-title">My Support Tickets</h3>
              </div>
            </div>
            <div class="support-summary-row">
              <div class="support-summary-field">
                <span class="personal-info-label">Tickets Raised</span>
                <span class="support-summary-value"
                  >{supportData.ticketsRaisedCount}</span
                >
              </div>
              <div class="support-summary-field">
                <span class="personal-info-label">Currently Open</span>
                <span class="support-summary-value"
                  >{supportData.currentlyOpenCount}</span
                >
              </div>
              <div class="support-summary-field">
                <span class="personal-info-label">Avg First Response</span>
                <span class="support-summary-value"
                  >{avgFirstResponseDisplay}</span
                >
              </div>
            </div>
            <div class="education-list">
              <template if:true={hasSupportTickets}>
                <template for:each={supportTicketRows} for:item="ticket">
                  <div class="record-card" key={ticket.caseNumber}>
                    <div class="record-card-row">
                      <div class="record-card-title">{ticket.subject}</div>
                      <template if:true={ticket.priority}>
                        <span class={ticket.priorityTone}
                          >{ticket.priority}</span
                        >
                      </template>
                    </div>
                    <div class="record-card-meta">
                      #{ticket.caseNumber} · {ticket.status} · Opened
                      {ticket.openedDate}
                      <template if:true={ticket.owner}
                        >· Owner {ticket.owner}</template
                      >
                      <template if:true={ticket.closedDate}
                        >· Resolved {ticket.closedDate}</template
                      >
                    </div>
                  </div>
                </template>
              </template>
              <template if:false={hasSupportTickets}>
                <div class="empty-state">
                  <span class="empty-state-icon">
                    <svg
                      width="20"
                      height="20"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.5"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    >
                      <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
                      <path
                        d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"
                      />
                    </svg>
                  </span>
                  <p class="empty-state-text">No support tickets raised yet.</p>
                </div>
              </template>
            </div>
          </div>
        </div>
      </div>
    </template>

    <template if:true={isPayments}>
      <div class="profile-content payments-tab-content">
        <div class="payments-header-row">
          <h3 class="subsection-title">All Payments</h3>
          <div class="payments-search-wrap">
            <lightning-icon
              icon-name="utility:search"
              size="x-small"
              class="payments-search-icon"
            ></lightning-icon>
            <input
              type="text"
              class="payments-search-input"
              placeholder="Search by ID or keyword"
              value={paymentSearchTerm}
              oninput={handlePaymentSearchInput}
            />
          </div>
        </div>

        <!-- Desktop table -->
        <div class="payments-table-wrap payments-desktop-only">
          <table class="payments-table">
            <thead>
              <tr>
                <th>Particulars</th>
                <th>Transaction ID</th>
                <th>Payment Mode</th>
                <th>Currency</th>
                <th>Paid Amount</th>
                <th>Transaction Date</th>
                <th>Receipt</th>
              </tr>
            </thead>
            <tbody>
              <template for:each={filteredPayments} for:item="pay">
                <tr key={pay.id}>
                  <td>{pay.particulars}</td>
                  <td>{pay.transactionId}</td>
                  <td>{pay.paymentMode}</td>
                  <td>{pay.currency}</td>
                  <td>{pay.paidAmount}</td>
                  <td>{pay.transactionDate}</td>
                  <td>
                    <button
                      type="button"
                      class="receipt-download-btn"
                      title="Download receipt"
                    >
                      <lightning-icon
                        icon-name="utility:download"
                        size="x-small"
                      ></lightning-icon>
                    </button>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>

        <!-- Mobile cards -->
        <div class="payments-cards payments-mobile-only">
          <template for:each={filteredPayments} for:item="pay">
            <article key={pay.id} class="payment-card">
              <div class="payment-card__top">
                <div class="payment-card__title-block">
                  <h4 class="payment-card__title">{pay.particulars}</h4>
                  <p class="payment-card__date">{pay.transactionDate}</p>
                </div>
                <button
                  type="button"
                  class="receipt-download-btn"
                  title="Download receipt"
                >
                  <lightning-icon
                    icon-name="utility:download"
                    size="x-small"
                  ></lightning-icon>
                </button>
              </div>
              <div class="payment-card__amount">{pay.paidAmount}</div>
              <div class="payment-card__meta">
                <div class="payment-card__row">
                  <span class="payment-card__label">Transaction ID</span>
                  <span class="payment-card__value payment-card__value--id"
                    >{pay.transactionId}</span
                  >
                </div>
                <div class="payment-card__row">
                  <span class="payment-card__label">Payment Mode</span>
                  <span class="payment-card__value">{pay.paymentMode}</span>
                </div>
                <div class="payment-card__row">
                  <span class="payment-card__label">Currency</span>
                  <span class="payment-card__value">{pay.currency}</span>
                </div>
              </div>
            </article>
          </template>
        </div>
      </div>
    </template>
  </div>

  <!-- About Me Edit Modal (kept for a future bio card; not reachable from any tab today) -->
  <template if:true={showAboutModal}>
    <div class="modal-overlay">
      <div class="modal-content about-me-modal">
        <div class="modal-header">
          <h2>About Me</h2>
          <button
            type="button"
            class="close-modal-btn"
            onclick={closeAboutModal}
            aria-label="Close"
          >
            <lightning-icon
              icon-name="utility:close"
              size="small"
            ></lightning-icon>
          </button>
        </div>
        <div class="modal-body">
          <label class="about-me-label">Tell us about yourself</label>
          <c-ken-rich-text-editor
            value={aboutEditText}
            placeholder="Tell us about yourself"
            max-length="1200"
            onchange={handleAboutChange}
          >
          </c-ken-rich-text-editor>
        </div>
        <div class="modal-footer about-me-footer">
          <button
            type="button"
            class="about-me-discard-btn"
            onclick={handleAboutDiscard}
          >
            Discard Changes
          </button>
          <button
            type="button"
            class="about-me-save-btn"
            onclick={handleAboutSave}
          >
            Save Changes
          </button>
        </div>
      </div>
    </div>
  </template>

  <!-- Add Experience – kenCareerInformationModal -->
  <template if:true={showExperienceModal}>
    <c-ken-career-information-modal
      career-data={experienceModalCareerData}
      modal-title-override={experienceModalTitle}
      onclose={handleCloseExperienceModal}
      onsave={handleSaveExperience}
    >
    </c-ken-career-information-modal>
  </template>

  <!-- Add/Edit Education Modal -->
  <template if:true={showEducationModal}>
    <c-ken-education-information-modal
      education-data={educationModalData}
      modal-title-override={educationModalTitle}
      onclose={handleCloseEducationModal}
      onsave={handleSaveEducation}
    >
    </c-ken-education-information-modal>
  </template>

  <!-- Add/Edit Achievement Modal -->
  <template if:true={showAchievementModal}>
    <c-ken-achievement-information-modal
      achievement-data={achievementModalData}
      modal-title-override={achievementModalTitle}
      onclose={handleCloseAchievementModal}
      onsave={handleSaveAchievement}
    >
    </c-ken-achievement-information-modal>
  </template>

  <c-ken-status-popup
    visible={showSuccessPopup}
    message={successMessage}
    variant="success"
  ></c-ken-status-popup>
</template>
