<template>
    <div class="stepper-wrap">
        <div class="host-stepper">
            <template for:each={stepperItems} for:item="s">
                <div key={s.id} class={s.cls}>
                    <span class="hstep__num">{s.num}</span>
                    <span class="hstep__label">{s.label}</span>
                </div>
            </template>
        </div>
        <template lwc:if={showProgressBar}>
            <div class="progress"><div class="progress__bar" style={progressStyle}></div></div>
        </template>
        <template lwc:if={showCounter}>
            <p class="step-counter">{counterLabel}</p>
        </template>
    </div>
</template>
