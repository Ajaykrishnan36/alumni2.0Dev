<template>
	<div class="employment-container">
		<div class="form-container">
			<template if:false={hasCareerInfo}>
				<div class="empty-state">
			<h2 class="empty-title">Add your Career Information</h2>
			<p class="empty-description">Help us understand your professional background to complete your profile.</p>
			<button type="button" class="add-career-button" onclick={handleAddCareer}>
				<svg width="20" height="20" viewBox="0 0 24 24" fill="none">
					<path d="M12 5V19M5 12H19" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
				</svg>
				<span>Add Career Information</span>
			</button>
			</div>
		</template>

		<template if:true={hasCareerInfo}>
			<div class="career-list">
			<div class="section-header">
				<h2 class="section-title">Work Experiences</h2>
				<button type="button" class="add-career-button-small" onclick={handleAddCareer}>
					<svg width="16" height="16" viewBox="0 0 24 24" fill="none">
						<path d="M12 5V19M5 12H19" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
					</svg>
					<span>Add Career Information</span>
				</button>
			</div>
			<div class="career-items">
				<template for:each={careerInfoList} for:item="career">
					<div key={career.id} class="career-item">
						<div class="career-actions">
							<button type="button" class="icon-btn-plain" onclick={handleDeleteCareer} data-career-id={career.id} aria-label="Delete">
								<lightning-icon icon-name="utility:delete" size="x-small"></lightning-icon>
							</button>
							<button type="button" class="ken-edit-icon-btn" onclick={handleEditCareer} data-career-id={career.id} aria-label="Edit">
								<svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
									<path d="M11.7167 7.51667L12.4833 8.28333L4.93333 15.8333H4.16667V15.0667L11.7167 7.51667ZM14.7167 2.5C14.5083 2.5 14.2917 2.58333 14.1333 2.74167L12.6083 4.26667L15.7333 7.39167L17.2583 5.86667C17.5833 5.54167 17.5833 5.01667 17.2583 4.69167L15.3083 2.74167C15.1417 2.575 14.9333 2.5 14.7167 2.5ZM11.7167 5.15833L2.5 14.375V17.5H5.625L14.8417 8.28333L11.7167 5.15833Z" fill="var(--portal-text-muted, #4B5563)"/>
								</svg>
							</button>
						</div>
						<div class="career-content">
							<p class="career-title">{career.jobTitle}</p>
							<p class="career-company">{career.organization}</p>
							<p class="career-location">{career.location} | {career.employmentType}</p>
							<lightning-formatted-rich-text class="career-description" value={career.roleDescription}></lightning-formatted-rich-text>
						</div>
					</div>
				</template>
			</div>
			</div>
			</template>
		</div>

		<div class="form-actions">
			<button type="button" class="skip-button" onclick={handleSkip}>Skip</button>
			<button type="button" class="previous-button" onclick={handlePrevious}>Previous Step</button>
			<button type="button" class="save-next-button" onclick={handleSaveAndNext} disabled={isSaveNextDisabled}> Save & Next </button>

		</div>
	</div>

	<template if:true={showCareerModal}>
		<c-ken-career-information-modal
			career-data={selectedCareerData}
			onclose={handleCloseCareerModal}
			onsave={handleSaveCareer}>
		</c-ken-career-information-modal>
	</template>

	<template if:true={showDeleteConfirm}>
		<div class="delete-confirm-overlay">
			<div class="delete-confirm-modal">
				<p class="delete-confirm-message">Are you sure you want to delete?</p>
				<div class="delete-confirm-actions">
					<button type="button" class="delete-confirm-no-btn" onclick={handleCancelDeleteCareer}>No</button>
					<button type="button" class="delete-confirm-yes-btn" onclick={handleConfirmDeleteCareer}>Yes</button>
				</div>
			</div>
		</div>
	</template>
</template>
