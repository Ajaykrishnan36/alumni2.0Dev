<template>
    <template if:true={isOpen}>
        <div class="modal-backdrop" onclick={handleBackdropClick}>
            <div class="modal-box" onclick={stopPropagation}>

                <!-- Header -->
                <div class="modal-header">
                    <div class="modal-title-wrap">
                        <h2 class="modal-title">{title}</h2>
                        <span class="modal-count">{filteredCount} {recordLabel}</span>
                    </div>
                    <div class="modal-actions">
                        <button class="export-btn" onclick={handleExportCsv} title="Export as CSV" aria-label="Export as CSV">&#x2193; Export CSV</button>
                        <button class="modal-close" onclick={handleClose} title="Close" aria-label="Close modal">&#x2715;</button>
                    </div>
                </div>

                <!-- Search -->
                <div class="modal-search">
                    <input
                        type="text"
                        class="search-input"
                        placeholder={searchPlaceholder}
                        value={searchTerm}
                        oninput={handleSearch}
                    />
                </div>

                <!-- Body -->
                <div class="modal-body">
                    <template if:true={isLoading}>
                        <div class="loading-state">
                            <div class="spinner"></div>
                            <p>{loadingText}</p>
                        </div>
                    </template>

                    <template if:false={isLoading}>
                        <template if:true={hasRows}>

                            <!-- Events table -->
                            <template if:false={isBookingMode}>
                                <table class="events-table">
                                    <thead>
                                        <tr>
                                            <th class="col-name">Event Name</th>
                                            <th class="col-type">Type</th>
                                            <th class="col-status">Status</th>
                                            <th class="col-date">Start Date</th>
                                            <th class="col-loc">Location</th>
                                            <th class="col-reg">Registrations</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template for:each={pageRows} for:item="r">
                                            <tr key={r.id} class="event-row" data-record-id={r.id} data-object-api="Ken_Event_Master__c" onclick={handleRowClick}>
                                                <td class="col-name name-cell">{r.name}</td>
                                                <td class="col-type type-cell">{r.eventType}</td>
                                                <td class="col-status">
                                                    <span class={r.statusClass}>{r.status}</span>
                                                </td>
                                                <td class="col-date">{r.startDate}</td>
                                                <td class="col-loc">{r.location}</td>
                                                <td class="col-reg reg-cell">{r.registrations}</td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </template>

                            <!-- Bookings table -->
                            <template if:true={isBookingMode}>
                                <table class="events-table">
                                    <thead>
                                        <tr>
                                            <th class="col-attendee">Attendee</th>
                                            <th class="col-event">Event</th>
                                            <th class="col-status">Status</th>
                                            <th class="col-date">Date</th>
                                            <th class="col-count">Attendees</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template for:each={pageRows} for:item="r">
                                            <tr key={r.id} class="event-row" data-record-id={r.id} data-object-api="Ken_Event_Booking__c" onclick={handleRowClick}>
                                                <td class="col-attendee name-cell">{r.attendeeName}</td>
                                                <td class="col-event type-cell">{r.eventName}</td>
                                                <td class="col-status">
                                                    <span class={r.statusClass}>{r.bookingStatus}</span>
                                                </td>
                                                <td class="col-date">{r.bookedDate}</td>
                                                <td class="col-count reg-cell">{r.attendeeCount}</td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </template>

                            <div class="pagination">
                                <button class="page-btn" onclick={prevPage} disabled={isFirstPage}>&#8249; Prev</button>
                                <span class="page-info">{pageInfo}</span>
                                <button class="page-btn" onclick={nextPage} disabled={isLastPage}>Next &#8250;</button>
                            </div>
                        </template>
                        <template if:false={hasRows}>
                            <div class="empty-state">{emptyText}</div>
                        </template>
                    </template>
                </div>

            </div>
        </div>
    </template>
</template>
