<template>
    <div>
        <div class="customTitle">{config.customSectionTitle}</div>

        <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_info infoBanner" role="alert">
            <span class="slds-assistive-text">Info</span>
            <lightning-icon icon-name="utility:info" size="x-small"></lightning-icon>
            <span class="bannerText">
                You can create multiple custom groups. Save Group and then add another group if needed.
            </span>
        </div>

        <div class="groupCard slds-m-top_medium">
            <div class="groupHeader">
                <div class="groupLabel">{groupLabel}</div>
                <button class="slds-button slds-button_outline-brand" type="button" onclick={handleSave}>
                    Save &amp; Add to Audience
                </button>
            </div>

            <div class="slds-m-top_medium fieldStack">
                <template for:each={config.fields} for:item="field">
                    <template if:true={field.isMulti}>
                        <c-ken-multi-select-picklist
                            key={field.key}
                            data-key={field.key}
                            label={field.label}
                            placeholder={field.placeholder}
                            options={field.options}
                            value={field.value}
                            onchange={handleMultiChange}>
                        </c-ken-multi-select-picklist>
                    </template>

                    <template if:true={field.isText}>
                        <lightning-input
                            key={field.key}
                            data-key={field.key}
                            type="search"
                            label={field.label}
                            placeholder={field.placeholder}
                            value={field.value}
                            onchange={handleTextChange}>
                        </lightning-input>
                    </template>
                </template>
            </div>
        </div>
    </div>
</template>
