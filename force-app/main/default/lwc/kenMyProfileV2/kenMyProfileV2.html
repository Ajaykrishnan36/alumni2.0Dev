<template>
    <c-ken42-alumni-shell-v2 active-nav="home">
        <section class="page">
            <!-- ===== PROFILE VIEW ===== -->
            <template lwc:if={isProfileView}>
                <div class="profile-card">
                    <div class="profile-card__avatar">{userInitial}</div>
                    <div class="profile-card__info">
                        <h1 class="profile-card__name">{userFullName} <span class="li-badge">in</span></h1>
                        <template lwc:if={headlineRole}>
                            <p class="profile-card__role">{headlineRole}</p>
                        </template>
                        <template lwc:if={headlineLocation}>
                            <p class="profile-card__loc">📍 {headlineLocation}</p>
                        </template>
                    </div>
                    <div class="profile-card__actions">
                        <button type="button" class="btn btn--primary" onclick={handleViewIdCard}>View Alumni ID Card</button>
                        <button type="button" class="icon-btn icon-btn--blue" onclick={handleOpenResumeBuilder} title="Edit">✎</button>
                    </div>
                </div>

                <div class="tabs-card">
                    <nav class="tabs">
                        <template for:each={tabs} for:item="t">
                            <button key={t.id} type="button" class={t.cssClass} data-id={t.id} onclick={handleTab}>{t.label}</button>
                        </template>
                    </nav>
                </div>

                <!-- ABOUT TAB -->
                <template lwc:if={isAboutTab}>
                    <div class="grid">
                        <div>
                            <div class="card">
                                <div class="card__head">
                                    <h2 class="card__title">Educational Background</h2>
                                    <button type="button" class="add-btn" onclick={handleAddEducation}>+</button>
                                </div>
                                <template lwc:if={isLoading}>
                                    <p class="row__meta">Loading...</p>
                                </template>
                                <template lwc:elseif={hasEducation}>
                                    <template for:each={education} for:item="e">
                                        <div key={e.id} class="rec-card">
                                            <div class="rec-card__logo" aria-hidden="true">
                                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                                    <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
                                                    <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
                                                </svg>
                                            </div>
                                            <div class="rec-card__body">
                                                <h4 class="rec-card__title">{e.degree}</h4>
                                                <p class="rec-card__sub">{e.school}</p>
                                                <template lwc:if={e.fieldOfStudy}>
                                                    <p class="rec-card__sub rec-card__sub--muted">{e.fieldOfStudy}</p>
                                                </template>
                                                <p class="rec-card__meta">{e.dateLabel}<template lwc:if={e.grade}> &middot; {e.grade}</template></p>
                                                <template lwc:if={e.description}>
                                                    <p class="rec-card__desc">{e.description}</p>
                                                </template>
                                            </div>
                                            <div class="rec-card__actions">
                                                <button type="button" class="rec-card__btn" data-id={e.id} onclick={handleEditEducation} title="Edit" aria-label="Edit">
                                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                                                </button>
                                                <button type="button" class="rec-card__btn rec-card__btn--danger" data-id={e.id} onclick={handleDeleteEducation} title="Delete" aria-label="Delete">
                                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                                                </button>
                                            </div>
                                        </div>
                                    </template>
                                </template>
                                <template lwc:else>
                                    <p class="row__meta">No education records yet. Click + to add.</p>
                                </template>
                            </div>

                            <div class="card">
                                <div class="card__head">
                                    <h2 class="card__title">Experience</h2>
                                    <button type="button" class="add-btn" onclick={handleAddEmployment}>+</button>
                                </div>
                                <template lwc:if={isLoading}>
                                    <p class="row__meta">Loading...</p>
                                </template>
                                <template lwc:elseif={hasEmployment}>
                                    <template for:each={employment} for:item="e">
                                        <div key={e.id} class="rec-card">
                                            <div class="rec-card__logo" aria-hidden="true">
                                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6B7280" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                                    <path d="M3 21h18M5 21V7l8-4v18M19 21V11l-6-4"></path>
                                                    <path d="M9 9v.01M9 12v.01M9 15v.01M9 18v.01"></path>
                                                </svg>
                                            </div>
                                            <div class="rec-card__body">
                                                <h4 class="rec-card__title">{e.role}</h4>
                                                <p class="rec-card__sub">{e.company}<template lwc:if={e.employmentType}> &middot; <span class="rec-card__chip">{e.employmentType}</span></template></p>
                                                <p class="rec-card__meta">{e.dateLabel}<template lwc:if={e.location}> &middot; {e.location}</template></p>
                                                <template lwc:if={e.description}>
                                                    <p class="rec-card__desc">{e.description}</p>
                                                </template>
                                            </div>
                                            <div class="rec-card__actions">
                                                <button type="button" class="rec-card__btn" data-id={e.id} onclick={handleEditEmployment} title="Edit" aria-label="Edit">
                                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                                                </button>
                                                <button type="button" class="rec-card__btn rec-card__btn--danger" data-id={e.id} onclick={handleDeleteEmployment} title="Delete" aria-label="Delete">
                                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                                                </button>
                                            </div>
                                        </div>
                                    </template>
                                </template>
                                <template lwc:else>
                                    <p class="row__meta">No experience records yet. Click + to add.</p>
                                </template>
                            </div>
                        </div>
                        <div>
                            <div class="card card--accent">
                                <div class="card__head">
                                    <h2 class="card__title">About</h2>
                                    <button type="button" class="icon-btn icon-btn--blue" onclick={handleOpenResumeEdit} title="Edit About">✎</button>
                                </div>
                                <p class="about-text about-text--wrap">{resumeSummary}</p>
                            </div>
                            <div class="card card--accent">
                                <div class="card__head">
                                    <h2 class="card__title">Basic Info</h2>
                                    <button type="button" class="icon-btn icon-btn--blue" onclick={handleOpenBasicInfoModal} title="Edit Basic Info">✎</button>
                                </div>
                                <template lwc:if={headlineRole}>
                                    <p class="kv">💼  {headlineRole}</p>
                                </template>
                                <template lwc:if={headlineLocation}>
                                    <p class="kv">📍  {headlineLocation}</p>
                                </template>
                                <template lwc:if={userBatch}>
                                    <p class="kv">🎓  Batch {userBatch}</p>
                                </template>
                            </div>
                            <div class="card card--accent">
                                <div class="card__head">
                                    <h2 class="card__title">Contact Details</h2>
                                    <button type="button" class="icon-btn icon-btn--blue" onclick={handleOpenContactModal} title="Edit Contact">✎</button>
                                </div>
                                <template lwc:if={contactPhone}>
                                    <p class="kv">📞  {contactPhone}</p>
                                </template>
                                <template lwc:if={contactEmail}>
                                    <p class="kv">✉  {contactEmail}</p>
                                </template>
                                <template lwc:if={contactLinkedin}>
                                    <p class="kv">🔗  {contactLinkedin}</p>
                                </template>
                            </div>
                        </div>
                    </div>
                </template>

                <!-- ACHIEVEMENTS TAB -->
                <template lwc:if={isAchievementsTab}>
                    <div class="card">
                        <div class="card__head">
                            <h2 class="card__title">Achievements</h2>
                            <button type="button" class="add-btn" onclick={handleAddAchievement}>+</button>
                        </div>
                        <template lwc:if={isLoading}>
                            <p class="ach-row__meta">Loading...</p>
                        </template>
                        <template lwc:elseif={hasAchievements}>
                            <template for:each={achievements} for:item="a">
                                <div key={a.id} class="ach-row">
                                    <div class="ach-row__body">
                                        <p class="ach-row__kind">{a.kind}</p>
                                        <p class="ach-row__title">{a.title}</p>
                                        <p class="ach-row__meta">{a.org} | {a.year}</p>
                                        <template lwc:if={a.description}>
                                            <p class="ach-row__desc ach-row__desc--clamp">{a.description}</p>
                                        </template>
                                    </div>
                                    <div class="row__actions">
                                        <button type="button" data-id={a.id} onclick={handleDeleteAchievement} title="Delete">🗑</button>
                                        <button type="button" data-id={a.id} onclick={handleEditAchievement} title="Edit">✎</button>
                                    </div>
                                </div>
                            </template>
                        </template>
                        <template lwc:else>
                            <p class="ach-row__meta">No achievements yet. Click + to add.</p>
                        </template>
                    </div>
                </template>

                <!-- PAYMENTS TAB -->
                <template lwc:if={isPaymentsTab}>
                    <div class="card">
                        <div class="card__head">
                            <h2 class="card__title">All Payments</h2>
                            <div class="pay-search">
                                <span class="pay-search__icon">🔍</span>
                                <input type="text" placeholder="Search by ID or keyword"/>
                            </div>
                        </div>
                        <template lwc:if={hasPayments}>
                            <table class="pay-table">
                                <thead>
                                    <tr>
                                        <th>Particulars ▾</th>
                                        <th>Transaction ID</th>
                                        <th>Payment Mode ▾</th>
                                        <th>Currency</th>
                                        <th>Paid Amount ↕</th>
                                        <th>Transaction Date ↕</th>
                                        <th>Receipt</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={payments} for:item="p">
                                        <tr key={p.id}>
                                            <td>{p.particulars}</td>
                                            <td class="pay-table__txn">{p.txnId}</td>
                                            <td>{p.mode}</td>
                                            <td>{p.currency}</td>
                                            <td>{p.amount}</td>
                                            <td>{p.date}</td>
                                            <td><button type="button" class="pay-dl" title="Download receipt">⤓</button></td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </template>
                        <template lwc:if={showPaymentsEmpty}>
                            <div class="prof-empty">
                                <div class="prof-empty__icon" aria-hidden="true">💳</div>
                                <h3 class="prof-empty__title">No payments yet</h3>
                                <p class="prof-empty__copy">When you make a contribution or settle a fee, it will appear here.</p>
                            </div>
                        </template>
                    </div>
                </template>
            </template>

            <!-- ===== RESUME BUILDER VIEW ===== -->
            <template lwc:if={isResumeBuilder}>
                <div class="card">
                    <div class="card__head">
                        <h2 class="card__title">Resume Builder</h2>
                        <div>
                            <button type="button" class="btn btn--outline btn--sm" onclick={handleCloseResume}>← Back to profile</button>
                            <button type="button" class="btn btn--primary btn--sm" onclick={handleOpenResumePreview}>Preview →</button>
                        </div>
                    </div>
                    <div class="resume-grid">
                        <div class="resume-edit">
                            <h3 class="resume-h">Edit details</h3>
                            <button type="button" class="btn btn--outline btn--sm" onclick={handleOpenResumeEdit}>Edit basic info</button>
                            <h4 class="resume-sub">Education</h4>
                            <template for:each={education} for:item="e">
                                <p key={e.id} class="resume-line"><strong>{e.degree}</strong> — {e.school} ({e.year})</p>
                            </template>
                            <h4 class="resume-sub">Experience</h4>
                            <template for:each={employment} for:item="e">
                                <p key={e.id} class="resume-line"><strong>{e.role}</strong> — {e.company} ({e.start} – {e.end})</p>
                            </template>
                        </div>
                        <div class="resume-preview">
                            <h2 class="resume-preview__name">{resumeName}</h2>
                            <p class="resume-preview__headline">{resumeHeadline}</p>
                            <p class="resume-preview__summary">{resumeSummary}</p>
                            <h3 class="resume-preview__h">Education</h3>
                            <template for:each={education} for:item="e">
                                <div key={e.id} class="resume-preview__item">
                                    <p><strong>{e.degree}</strong></p>
                                    <p>{e.school}  ·  {e.year}  ·  {e.grade}</p>
                                </div>
                            </template>
                            <h3 class="resume-preview__h">Experience</h3>
                            <template for:each={employment} for:item="e">
                                <div key={e.id} class="resume-preview__item">
                                    <p><strong>{e.role}</strong> — {e.company}</p>
                                    <p class="resume-preview__meta">{e.start} – {e.end}</p>
                                    <p>{e.description}</p>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </template>

            <!-- ===== RESUME PREVIEW (full page) ===== -->
            <template lwc:if={isResumePreview}>
                <div class="card">
                    <div class="card__head">
                        <h2 class="card__title">Resume Preview</h2>
                        <div>
                            <button type="button" class="btn btn--outline btn--sm" onclick={handleOpenResumeBuilder}>← Back to editor</button>
                            <button type="button" class="btn btn--primary btn--sm" onclick={handleDownloadPdf}>Download PDF</button>
                        </div>
                    </div>
                    <div class="resume-page">
                        <h1 class="resume-page__name">{resumeName}</h1>
                        <p class="resume-page__headline">{resumeHeadline}</p>
                        <p class="resume-page__contact">{resumeContact}</p>
                        <hr/>
                        <h3 class="resume-page__h">Summary</h3>
                        <p>{resumeSummary}</p>
                        <h3 class="resume-page__h">Education</h3>
                        <template for:each={education} for:item="e">
                            <div key={e.id} class="resume-page__item">
                                <p><strong>{e.degree}</strong></p>
                                <p>{e.school}  ·  {e.year}  ·  {e.grade}</p>
                            </div>
                        </template>
                        <h3 class="resume-page__h">Experience</h3>
                        <template for:each={employment} for:item="e">
                            <div key={e.id} class="resume-page__item">
                                <p><strong>{e.role}</strong> — {e.company}</p>
                                <p class="resume-page__meta">{e.start} – {e.end}</p>
                                <p>{e.description}</p>
                            </div>
                        </template>
                    </div>
                </div>
            </template>
        </section>

        <!-- ===== EDIT EDUCATION MODAL ===== -->
        <template lwc:if={isEditEducation}>
            <div class="modal-backdrop" onclick={handleBackdropClick}>
                <div class="modal modal--lg edit-form edit-form--modal" onclick={handleStopProp}>
                    <button type="button" class="modal__close" onclick={handleCancelEdit} aria-label="Close">&times;</button>
                    <div class="edit-form__body">
                        <h2 class="modal__title">{editingTitle}</h2>
                        <div class="edit-form__grid">
                            <div class="field">
                                <label>School / University Name<span class="req">*</span></label>
                                <input type="text" data-field="school" value={editingItem.school} oninput={handleEditField} placeholder="e.g. Indian Institute of Technology"/>
                            </div>
                            <div class="field">
                                <label>Degree<span class="req">*</span></label>
                                <input type="text" data-field="degree" value={editingItem.degree} oninput={handleEditField} placeholder="e.g. B.Tech in Computer Science"/>
                            </div>
                            <div class="field field--span-2">
                                <label>Field of Study</label>
                                <input type="text" data-field="fieldOfStudy" value={editingItem.fieldOfStudy} oninput={handleEditField} placeholder="e.g. Computer Science and Engineering"/>
                            </div>
                            <div class="field">
                                <label>Start Year</label>
                                <input type="text" data-field="startYear" value={editingItem.startYear} oninput={handleEditField} placeholder="2018" maxlength="4" inputmode="numeric"/>
                            </div>
                            <div class="field">
                                <label>End Year (or 'Present')</label>
                                <input type="text" data-field="endYear" value={editingItem.endYear} oninput={handleEditField} placeholder="2022 or Present"/>
                            </div>
                            <div class="field">
                                <label>Grade / CGPA</label>
                                <input type="text" data-field="grade" value={editingItem.grade} oninput={handleEditField} placeholder="e.g. 8.4 GPA or 85%"/>
                            </div>
                            <div class="field field--span-2">
                                <label>Description / Activities</label>
                                <textarea data-field="description" oninput={handleEditField} rows="3" placeholder="Coursework, clubs, awards, honors...">{editingItem.description}</textarea>
                            </div>
                        </div>
                        <div class="edit-form__actions">
                            <button type="button" class="btn btn--secondary" onclick={handleCancelEdit}>Cancel</button>
                            <button type="button" class="btn btn--primary" onclick={handleSaveEducation} disabled={isSavingEducation}>{educationSaveLabel}</button>
                        </div>
                    </div>
                </div>
            </div>
        </template>

        <!-- ===== EDIT EMPLOYMENT MODAL ===== -->
        <template lwc:if={isEditEmployment}>
            <div class="modal-backdrop" onclick={handleBackdropClick}>
                <div class="modal modal--lg edit-form edit-form--modal" onclick={handleStopProp}>
                    <button type="button" class="modal__close" onclick={handleCancelEdit} aria-label="Close">&times;</button>
                    <div class="edit-form__body">
                        <h2 class="modal__title">{editingTitle}</h2>
                        <div class="edit-form__grid">
                            <div class="field">
                                <label>Job Title<span class="req">*</span></label>
                                <input type="text" data-field="role" value={editingItem.role} oninput={handleEditField} placeholder="e.g. Senior Software Engineer"/>
                            </div>
                            <div class="field">
                                <label>Employment Type</label>
                                <select data-field="employmentType" onchange={handleEditField}>
                                    <template for:each={employmentTypeOptions} for:item="opt">
                                        <option key={opt.value} value={opt.value} selected={opt.selected}>{opt.label}</option>
                                    </template>
                                </select>
                            </div>
                            <div class="field">
                                <label>Company Name<span class="req">*</span></label>
                                <input type="text" data-field="company" value={editingItem.company} oninput={handleEditField} placeholder="e.g. Acme Corp"/>
                            </div>
                            <div class="field">
                                <label>Location</label>
                                <input type="text" data-field="location" value={editingItem.location} oninput={handleEditField} placeholder="e.g. Bengaluru, India"/>
                            </div>
                            <div class="field">
                                <label>Start Date</label>
                                <input type="text" data-field="start" value={editingItem.start} oninput={handleEditField} placeholder="e.g. Mar 2022"/>
                            </div>
                            <div class="field">
                                <label>End Date</label>
                                <input type="text" data-field="end" value={editingItem.end} oninput={handleEditField} placeholder="e.g. Present" disabled={editingItem.isCurrent}/>
                            </div>
                            <div class="field field--span-2 field--inline">
                                <label class="field__check">
                                    <input type="checkbox" data-field="isCurrent" checked={editingItem.isCurrent} onchange={handleEditField}/>
                                    <span>I currently work here</span>
                                </label>
                            </div>
                            <div class="field field--span-2">
                                <label>Description</label>
                                <textarea data-field="description" oninput={handleEditField} rows="4" placeholder="Key responsibilities, impact, technologies...">{editingItem.description}</textarea>
                            </div>
                        </div>
                        <div class="edit-form__actions">
                            <button type="button" class="btn btn--secondary" onclick={handleCancelEdit}>Cancel</button>
                            <button type="button" class="btn btn--primary" onclick={handleSaveEmployment} disabled={isSavingEmployment}>{employmentSaveLabel}</button>
                        </div>
                    </div>
                </div>
            </div>
        </template>

        <!-- ===== RESUME EDIT MODAL ===== -->
        <template lwc:if={isResumeEdit}>
            <div class="modal-backdrop" onclick={handleBackdropClick}>
                <div class="modal modal--md" onclick={handleStopProp}>
                    <button type="button" class="modal__close" onclick={handleCloseResume}>×</button>
                    <div class="modal__body">
                        <h2 class="modal__title">Edit Resume Details</h2>
                        <label class="field">
                            <span class="field__label">Display name</span>
                            <input type="text" class="input" data-field="resumeName" value={resumeName} oninput={handleResumeField}/>
                        </label>
                        <label class="field">
                            <span class="field__label">Headline</span>
                            <input type="text" class="input" data-field="resumeHeadline" value={resumeHeadline} oninput={handleResumeField}/>
                        </label>
                        <label class="field">
                            <span class="field__label">Summary</span>
                            <textarea class="input" data-field="resumeSummary" value={resumeSummary} oninput={handleResumeField}></textarea>
                        </label>
                        <div class="modal__actions">
                            <button type="button" class="btn btn--outline" onclick={handleCloseResume}>Cancel</button>
                            <button type="button" class="btn btn--primary" onclick={handleSaveResume}>Save</button>
                        </div>
                    </div>
                </div>
            </div>
        </template>

        <!-- ===== ACHIEVEMENT MODAL ===== -->
        <template lwc:if={showAchievementModal}>
            <c-ken-achievement-information-modal-v2
                record-id={editingAchievement.id}
                initial-data={editingAchievement}
                onsave={handleAchievementSave}
                onclose={handleCloseAchievementModal}>
            </c-ken-achievement-information-modal-v2>
        </template>

        <!-- ===== BASIC INFO MODAL ===== -->
        <template lwc:if={showBasicInfoModal}>
            <div class="modal-backdrop" onclick={handleCloseBasicInfoModal}>
                <div class="modal modal--lg edit-form edit-form--modal" onclick={handleStopProp}>
                    <button type="button" class="modal__close" onclick={handleCloseBasicInfoModal} aria-label="Close">&times;</button>
                    <div class="edit-form__body">
                        <h2 class="modal__title">Edit Basic Info</h2>
                        <div class="edit-form__grid">
                            <div class="field">
                                <label>First Name</label>
                                <input type="text" data-field="firstName" value={editingBasicInfo.firstName} oninput={handleBasicInfoField} placeholder="e.g. Priya"/>
                            </div>
                            <div class="field">
                                <label>Last Name <span class="field__required" aria-hidden="true">*</span></label>
                                <input type="text" data-field="lastName" value={editingBasicInfo.lastName} oninput={handleBasicInfoField} placeholder="e.g. Sharma" required/>
                            </div>
                            <div class="field">
                                <label>Title / Role</label>
                                <input type="text" data-field="title" value={editingBasicInfo.title} oninput={handleBasicInfoField} placeholder="e.g. Product Manager"/>
                            </div>
                            <div class="field">
                                <label>Company</label>
                                <input type="text" data-field="company" value={editingBasicInfo.company} oninput={handleBasicInfoField} placeholder="e.g. Acme Corp"/>
                            </div>
                            <div class="field">
                                <label>Location</label>
                                <input type="text" data-field="location" value={editingBasicInfo.location} oninput={handleBasicInfoField} placeholder="e.g. Bengaluru, India"/>
                            </div>
                            <div class="field">
                                <label>Batch (Year of Graduation)</label>
                                <input type="text" data-field="batch" value={editingBasicInfo.batch} oninput={handleBasicInfoField} placeholder="e.g. 2022" maxlength="4" inputmode="numeric"/>
                            </div>
                            <div class="field field--span-2">
                                <label>Expertise / Specialization</label>
                                <input type="text" data-field="expertise" value={editingBasicInfo.expertise} oninput={handleBasicInfoField} placeholder="e.g. Computer Science"/>
                            </div>
                            <div class="field field--span-2">
                                <label>LinkedIn URL</label>
                                <input type="text" data-field="linkedin" value={editingBasicInfo.linkedin} oninput={handleBasicInfoField} placeholder="https://linkedin.com/in/..."/>
                            </div>
                            <div class="field field--span-2 field--inline">
                                <label class="field__check">
                                    <input type="checkbox" data-field="willingToHelp" checked={editingBasicInfo.willingToHelp} onchange={handleBasicInfoField}/>
                                    <span>Willing to help fellow alumni</span>
                                </label>
                            </div>
                        </div>
                        <div class="edit-form__actions">
                            <button type="button" class="btn btn--secondary" onclick={handleCloseBasicInfoModal}>Cancel</button>
                            <button type="button" class="btn btn--primary" onclick={handleSaveBasicInfo} disabled={isSavingBasicInfo}>{basicInfoSaveLabel}</button>
                        </div>
                    </div>
                </div>
            </div>
        </template>

        <!-- ===== CONTACT MODAL ===== -->
        <template lwc:if={showContactModal}>
            <div class="modal-backdrop" onclick={handleCloseContactModal}>
                <div class="modal modal--md edit-form edit-form--modal" onclick={handleStopProp}>
                    <button type="button" class="modal__close" onclick={handleCloseContactModal} aria-label="Close">&times;</button>
                    <div class="edit-form__body">
                        <h2 class="modal__title">Edit Contact Details</h2>
                        <div class="edit-form__grid">
                            <div class="field field--span-2">
                                <label>Email</label>
                                <input type="email" data-field="email" value={editingContact.email} oninput={handleContactField} placeholder="you@example.com"/>
                            </div>
                            <div class="field field--span-2">
                                <label>Phone</label>
                                <input type="tel" data-field="phone" value={editingContact.phone} oninput={handleContactField} placeholder="+91 9876543210"/>
                            </div>
                        </div>
                        <div class="edit-form__actions">
                            <button type="button" class="btn btn--secondary" onclick={handleCloseContactModal}>Cancel</button>
                            <button type="button" class="btn btn--primary" onclick={handleSaveContact} disabled={isSavingContact}>{contactSaveLabel}</button>
                        </div>
                    </div>
                </div>
            </div>
        </template>

        <!-- ===== TOAST ===== -->
        <template lwc:if={toastVisible}>
            <div class="toast">{toastMessage}</div>
        </template>
    </c-ken42-alumni-shell-v2>
</template>
