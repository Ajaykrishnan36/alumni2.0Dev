<template>
    <div class="schedule-list-container">
        <template for:each={groupedSchedule} for:item="group">
            <div key={group.dateValue} class="schedule-date-group">
                <!-- Date header row -->
                <div class="date-header">
                    <h3 class="date-label">{group.dateLabel}</h3>
                    <button type="button" class="schedule-call-btn" onclick={handleScheduleCall}>Schedule A Call</button>
                </div>

                <!-- Session cards list -->
                <div class="session-cards">
                    <template for:each={group.events} for:item="event">
                        <div key={event.id} class="session-card">
                            <div class="card-left">
                                <h4 class="session-title">{event.title}</h4>
                                <div class="mentor-row">
                                    <img src={event.mentorAvatar} alt={event.mentorName} class="mentor-avatar" onerror={handleAvatarError} />
                                    <span class="mentor-name" title={event.mentorName}>{event.mentorName}</span>
                                </div>
                                <div class="time-row">
                                    <svg class="clock-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z" fill="#6c757d"/>
                                    </svg>
                                    <span class="time-text">{event.timeLabel}</span>
                                </div>
                                <template if:true={event.topic}>
                                    <p class="topic-text">Topic: {event.topic}</p>
                                </template>
                                <template if:true={event.note}>
                                    <p class="note-text">{event.note}</p>
                                </template>
                            </div>
                            <div class="card-right">
                                <template if:true={event.isLive}>
                                    <span class="status-pill status-live">• Happening now!</span>
                                </template>
                                <template if:true={event.isPending}>
                                    <span class="status-pill status-pending">Awaiting Approval</span>
                                </template>
                                <template if:true={event.isCompleted}>
                                    <span class="status-pill status-completed">Completed</span>
                                    <button type="button" class="action-btn outlined" onclick={handleLeaveFeedback} data-id={event.id}>Leave Feedback</button>
                                </template>
                                <template if:true={event.isRequested}>
                                    <button type="button" class="action-btn view-request" onclick={handleViewRequest} data-id={event.id}>View Request →</button>
                                </template>
                                <template if:true={event.isUpcoming}>
                                    <span class="status-pill status-upcoming">Upcoming</span>
                                </template>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </template>

        <template if:true={isEmpty}>
            <div class="empty-state">
                <p>No sessions scheduled</p>
            </div>
        </template>

        <template if:true={showScheduleModal}>
            <c-ken-schedule-call-modal onclose={handleCloseScheduleModal} onsendrequest={handleSendRequest}></c-ken-schedule-call-modal>
        </template>
    </div>
</template>
