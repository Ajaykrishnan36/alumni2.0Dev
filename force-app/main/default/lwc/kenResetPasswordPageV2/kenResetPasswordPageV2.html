<template>
    <div class="page">
        <!-- LEFT: Brand / hero panel (violet) -->
        <aside class="hero">
            <h1 class="hero__institute">{institutionName}</h1>
            <div class="hero__bottom">
                <div class="hero__scrollbar"></div>
                <p class="hero__eyebrow">Experience Connections</p>
                <h2 class="hero__title">That Elevate Your Journey</h2>
                <p class="hero__tagline">Connect &bull; Collaborate &bull; Give Back</p>
            </div>
        </aside>

        <!-- RIGHT: Card -->
        <section class="card">
            <div class="card__logo">
                <template lwc:if={institutionLogoUrl}>
                    <img src={institutionLogoUrl} alt="Institution Logo" />
                </template>
                <template lwc:else>
                    <span>Institution Logo</span>
                </template>
            </div>

            <!-- SUCCESS STATE -->
            <template lwc:if={submitted}>
                <div class="success">
                    <div class="success__ico" aria-hidden="true">&#10003;</div>
                    <h2 class="card__title">Password updated</h2>
                    <p class="card__subtitle">Your password has been changed successfully. Redirecting you now…</p>
                </div>
            </template>

            <!-- FORM STATE -->
            <template lwc:else>
                <h2 class="card__title">{title}</h2>
                <p class="card__subtitle">{subtitle}</p>

                <form class="form" onsubmit={handleSubmit}>
                    <div class="field">
                        <label>New Password</label>
                        <div class="pwd">
                            <input data-field="newPassword" type={newType} placeholder="Enter new password"
                                   value={form.newPassword} oninput={handleInput} autocomplete="new-password" />
                            <button type="button" class="pwd__toggle" onclick={toggleNew} aria-label="Toggle password visibility">👁</button>
                        </div>
                    </div>

                    <div class="field">
                        <label>Re-enter New Password</label>
                        <div class="pwd">
                            <input data-field="confirmPassword" type={confirmType} placeholder="Re-enter your new password"
                                   value={form.confirmPassword} oninput={handleInput} autocomplete="new-password" />
                            <button type="button" class="pwd__toggle" onclick={toggleConfirm} aria-label="Toggle password visibility">👁</button>
                        </div>
                    </div>

                    <template lwc:if={errorMessage}>
                        <p class="form-error">{errorMessage}</p>
                    </template>

                    <button type="submit" class="btn btn--primary btn--block" disabled={isLoading}>
                        <template lwc:if={isLoading}>Updating…</template>
                        <template lwc:else>Set new password</template>
                    </button>
                </form>

                <p class="login-link">
                    <a href="#login" onclick={handleBackToLogin}>Back to Login</a>
                </p>
            </template>
        </section>
    </div>
</template>
