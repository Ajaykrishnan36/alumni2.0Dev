<template>
	<div if:true={showSpinner}>
		<lightning-spinner alternative-text="Loading..." variant="brand" size="medium">
		</lightning-spinner>
	</div>
	<div class="bgColor">
		<template if:true={isEventSetup}>
			<div class="custom-file-upload ">
				<lightning-card title="Image Upload">
                    <div class="slds-m-around_medium">
                        <!-- File input: Visible only when no image is selected -->
                        <template if:true={isFileInputVisible}>
                            <input type="file" accept={acceptedBannerFormats} onchange={handleFileChange} />
                        </template>

                        <!-- Display image preview if selected -->
                        <template if:true={imageUrl}>
                            <div class  ="image-preview">
                                <img src={imageUrl} alt="Selected Image" class="slds-image" style="height: 200px; width: 200px; object-fit: contain;"/><br/>
                                <lightning-button variant="destructive" label="Remove" onclick={removeImage}>
                                </lightning-button>
                            </div>
                        </template>
                    </div>
                </lightning-card>
			</div>
		
			<div class="slds-col slds-large-size_12-of-12">
				<template if:true={eventDetails}>
					<div class="slds-grid slds-wrap">
						<div class="slds-col slds-size_1-of-2 slds-p-around slds-p-top_x-small slds-p-bottom_x-small" style="padding: 0.5rem 1rem;">
							
								<lightning-input label="Event Title*" value={eventDetails.eventTitle} onchange={handleInputChange}
									data-id="eventTitle" placeholder="Event Title">
							</lightning-input>
							
						</div>
			
						<div class="slds-col slds-size_1-of-2 slds-p-around slds-p-top_x-small slds-p-bottom_x-small" style="padding: 0.5rem 1rem;">
							<c-ken-event-multi-select-combobox label="Event Type*" showpills="true" onselected={handleCategorySelection}
							placeholder={existingEventType} options={eventCategories} data-id="eventTypeSelect"></c-ken-event-multi-select-combobox>
						</div>
						<div class="slds-col slds-size_1-of-2 slds-p-around slds-p-top_x-small slds-p-bottom_x-small" style="padding: 0.5rem 1rem;">
							<c-ken-event-multi-select-combobox label="Language of delivery*" showpills="true" onselected={handleLanguageSelection}
							placeholder="Select Languages" options={eventLanguages} data-id="languageSelect"></c-ken-event-multi-select-combobox>
						</div>
						<div class="slds-col slds-size_1-of-2 slds-p-around slds-p-top_x-small slds-p-bottom_x-small" style="padding: 0.5rem 1rem;">
							<lightning-input type="number" label="Maximum Number of Participants Allowed*" value={eventDetails.maximumNumberOfParticipants}
								data-id="maximumNumberOfParticipants" onchange={handleInputChange}>
							</lightning-input>
						</div>
						<div class="slds-col slds-size_1-of-2 slds-p-around slds-p-top_x-small slds-p-bottom_x-small" style="padding: 0.5rem 1rem;">
							<lightning-input type="date" label="Select Start Date*" value={eventDetails.startdate}
								data-id="startdate" min={todayDate} onchange={handleInputChange}>
							</lightning-input>
						</div>
						<div class="slds-col slds-size_1-of-2 slds-p-around slds-p-top_x-small slds-p-bottom_x-small" style="padding: 0.5rem 1rem;">
							<lightning-input type="date" label="Select End Date*" value={eventDetails.enddate} data-id="enddate"
								min={todayDate} onchange={handleInputChange}>
							</lightning-input>
						</div>
						<div class="slds-col slds-size_1-of-2 slds-p-around slds-p-top_x-small slds-p-bottom_x-small" style="padding: 0.5rem 1rem;">
							<lightning-textarea label="Description*" value={eventDetails.description} onchange={handleInputChange}
								data-id="description"
								placeholder="Describe your event for the audience. This will be visible on the event page">
							</lightning-textarea>
						</div>
						<div class="slds-col slds-size_1-of-2 slds-p-around slds-p-top_x-small slds-p-bottom_x-small" style="padding: 0.5rem 1rem;">
							<lightning-textarea label="Agenda*" value={eventDetails.agenda} onchange={handleInputChange}
								data-id="agenda"
								placeholder="Describe the agenda of the event.">
							</lightning-textarea>
						</div>
						<div class="slds-col slds-size_1-of-2 slds-p-around slds-p-top_x-small slds-p-bottom_x-small" style="padding: 0.5rem 1rem;">
							<lightning-textarea label="What can the participants expect from the event?*" value={eventDetails.eventExpectations} onchange={handleInputChange}
								data-id="eventExpectations"
								placeholder="Describe the event expectations for the participants.">
							</lightning-textarea>
						</div>
					</div>
				</template>
			</div>
			<div class="custom-flex-container">
				<div class="custom-flex-left">
					<lightning-button class="slds-p-around_xx-small" name="Cancel" label="Cancel"
						onclick={handleCancel}>
					</lightning-button>
				</div>
				<div class="custom-flex">
					<div class="slds-p-around_xx-small">
						<lightning-button variant="brand" label="Save as Draft" onclick={handleSaveAsDraft} style="padding: 0.5rem 1rem;">
						</lightning-button>
					</div>
					<div class="slds-p-around_xx-small">
						<lightning-button variant="brand" type="button" name="save" label="Save and proceed" onclick={handleSave}>
						</lightning-button>
					</div>
				</div>
			</div>
			
		</template>
	</div>
</template>
