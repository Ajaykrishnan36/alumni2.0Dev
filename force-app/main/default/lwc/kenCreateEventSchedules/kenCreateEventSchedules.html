<template>
    <div if:true={showSpinner} class="slds-is-relative">
        <lightning-spinner alternative-text="Loading..." variant="brand" size="medium"></lightning-spinner>
    </div>

    <!-- Schedule Setup Section -->
    <template if:true={eventRecordId}>
        <div class="date-path">
            <!-- Loop through each date in the datePath array -->
            <template if:true={datePath} for:each={datePath} for:item="item">
                <lightning-button key={item.date} class="slds-m-left_x-small" variant={item.variant} label={item.label}
                    data-date={item.date} onclick={handleDateClick}>
                </lightning-button>
            </template>
        </div>

        <template for:each={eventScheduleRecords} for:item="eachEventSchedule" for:index="index">
            <div class="slds-p-around_small" key={eachEventSchedule.uniqueKey}>
                <!-- Session Details -->
                <template lwc:if={eachEventSchedule.isCard}>
                    <lightning-card title={eachEventSchedule.displayTitle} class="event-card">
                        <lightning-button-icon icon-name="utility:edit" alternative-text="Edit"
                            class="slds-m-right_x-small" title="Edit" onclick={handleEditSession} data-id={index}
                            data-type="session" slot="actions">
                        </lightning-button-icon>

                        <lightning-button-icon icon-name="utility:delete" alternative-text="Delete"
                            class="slds-m-right_small" title="Delete" onclick={handleDeleteSession} data-id={index}
                            slot="actions">
                        </lightning-button-icon>

                        <div class="card-content slds-p-around_medium">
                            <div class="slds-grid slds-wrap slds-gutters slds-m-bottom_medium">
                                <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                                    <p class="field-label">Session Title</p>
                                    <p class="field-value">{eachEventSchedule.name}</p>
                                </div>
                                <div class="slds-col slds-size_1-of-2 slds-p-bottom_small">
                                    <p class="field-label">Speaker(s)</p>
                                    <p class="field-value">
                                        <template iterator:it={eachEventSchedule.speakers}>
                                            {it.value.name}
                                            <template if:false={it.last}>, </template>
                                        </template>
                                    </p>
                                </div>
                                <div class="slds-col slds-size_1-of-2">
                                    <p class="field-label">Start Time</p>
                                    <p class="field-value">{eachEventSchedule.startTime}</p>
                                </div>
                                <div class="slds-col slds-size_1-of-2">
                                    <p class="field-label">End Time</p>
                                    <p class="field-value">{eachEventSchedule.endTime}</p>
                                </div>
                            </div>
                        </div>
                    </lightning-card>
                </template>
                <template lwc:else>
                    <div class="custom-container">
                        <strong>Session details</strong>
                        <!-- Session Form Elements -->
                        <div class="slds-grid slds-wrap">
                            <div class="slds-col slds-size_1-of-2" style="padding: 0.5rem 1rem;">
                                <lightning-input label="Session title*" name="name" data-id={index}
                                    data-field="sessionTitle" onchange={handleInputChange}
                                    value={eachEventSchedule.name}></lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-2" style="padding: 0.5rem 1rem;">
                                <lightning-input label="Select start time*" type="time" name="startTime" data-id={index}
                                    data-field="startTime" onchange={handleInputChange}
                                    value={eachEventSchedule.startTime}></lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-2" style="padding: 0.5rem 1rem;">
                                <lightning-input label="Select end time*" type="time" name="endTime" data-id={index}
                                    data-field="endTime" onchange={handleInputChange}
                                    value={eachEventSchedule.endTime}></lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-2" style="padding: 0.5rem 1rem;">
                                <lightning-input label="Agenda" data-id={index} data-field="agenda" name="agenda"
                                    onchange={handleInputChange} value={eachEventSchedule.agenda}></lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-2" style="padding: 0.5rem 1rem;">
                                <label>
                                    Upload brochure for the session (optional)
                                </label><br>

                                <template if:false={eachEventSchedule.sessionBroucher}>
                                    <lightning-button data-type="session" label="Upload Brochure for the session"
                                        data-id={index} onclick={handleOpenFileDialog} icon-name="utility:upload"
                                        icon-position="right">
                                    </lightning-button>
                                    <input type="file" accept={allowedBrochureFileTypes} data-type="session"
                                        data-id={index} style="display:none;" onchange={handleFileChange} />
                                </template>

                                <!-- Display File preview if selected -->
                                <template if:true={eachEventSchedule.sessionBroucher}>
                                    <template lwc:if={eachEventSchedule.isBrochureImageType}>
                                        <div class="image-preview">
                                            <img src={eachEventSchedule.sessionBroucher} data-type="session"
                                                data-id={index} alt="Selected Image"
                                                class="slds-image slds-p-around_xx-small slds-border_thin"
                                                style="max-height: 200px;" /><br />
                                        </div>
                                    </template>
                                    <template lwc:else>
                                        <div>
                                            <lightning-icon icon-name="utility:file" alternative-text="File"
                                                size="medium">
                                            </lightning-icon>
                                            <span
                                                class="slds-text-heading_small slds-p-left_small slds-text-font-weight_bold">{eachEventSchedule.brochureFileName}</span>
                                            <lightning-button-icon data-id={index} data-type="session"
                                                icon-name="utility:download" alternative-text="Download"
                                                title="Download" onclick={downloadFile} class="slds-m-left_small">
                                            </lightning-button-icon>
                                        </div>
                                    </template>
                                    <lightning-button variant="destructive" data-type="session" data-id={index}
                                        label="Remove" onclick={handleRemoveImage}>
                                    </lightning-button>
                                </template>
                            </div>
                        </div>

                        <!-- Speaker Details Section - Replace the existing speaker section -->
                        <div class="custom-container">
                            <strong>Speaker details</strong>
                            <template for:each={eachEventSchedule.speakers} for:item="speaker" for:index="speakerIndex">
                                <template if:true={speaker}>
                                    <div key={speaker.uniqueKey} class="slds-p-around_small">
                                        <div class="slds-grid slds-wrap">
                                            <div class="slds-col slds-size_1-of-2" style="padding: 0.5rem 1rem;">
                                                <lightning-input label="Speaker Name*" name="speakerName"
                                                    data-id={index} data-speaker-index={speakerIndex}
                                                    data-field="speakerName" onchange={handleSpeakerInputChange}
                                                    value={speaker.name} placeholder="Enter speaker name" required>
                                                </lightning-input>
                                            </div>

                                            <div class="slds-col slds-size_1-of-2" style="padding: 0.5rem 1rem;">
                                                <lightning-input label="Description about the speaker"
                                                    name="description" data-id={index} data-speaker-index={speakerIndex}
                                                    onchange={handleSpeakerInputChange}
                                                    placeholder="Help audience get to know the speaker"
                                                    value={speaker.description}>
                                                </lightning-input>
                                            </div>

                                            <div class="slds-col slds-size_1-of-2" style="padding: 0.5rem 1rem;">
                                                <label>
                                                    Image of the speaker (optional)
                                                </label><br>
                                                <template if:false={speaker.speakerImage}>
                                                    <lightning-button data-type="speaker"
                                                        label="Upload image for the speaker"
                                                        data-speaker-index={speakerIndex} data-id={index}
                                                        onclick={handleOpenFileDialog} icon-name="utility:upload"
                                                        icon-position="right">
                                                    </lightning-button>
                                                    <input type="file" accept="image/*" data-type="speaker"
                                                        style="display:none;" data-speaker-index={speakerIndex}
                                                        data-id={index} onchange={handleFileChange} />
                                                </template>

                                                <template if:true={speaker.speakerImage}>
                                                    <div class="image-preview">
                                                        <img src={speaker.speakerImage} data-type="speaker"
                                                            data-speaker-index={speakerIndex}
                                                            data-id={eachEventSchedule.index} alt="Selected Image"
                                                            class="slds-image" style="max-height: 200px;" /><br />
                                                        <lightning-button variant="destructive" data-type="speaker"
                                                            data-speaker-index={speakerIndex}
                                                            data-id={eachEventSchedule.index} label="Remove"
                                                            onclick={handleRemoveImage}>
                                                        </lightning-button>
                                                    </div>
                                                </template>
                                            </div>

                                            <div class="slds-col slds-size_1-of-2" style="padding: 0.5rem 1rem;">
                                                <lightning-button class="removeSpeaker" variant="destructive"
                                                    label="Remove Speaker" data-id={index}
                                                    data-speaker-index={speakerIndex} onclick={handleRemoveSpeaker}
                                                    icon-name="utility:delete" icon-position="right">
                                                </lightning-button>
                                            </div>
                                        </div>
                                    </div>
                                </template>
                            </template>
                            <lightning-button variant="Brand" label="+ Add Speaker" data-id={index}
                                data-speaker-index={speakerIndex} onclick={handleAddSpeaker}></lightning-button>
                        </div>

                        <!---Location details-->
                        <div>
                            <!-- Select location type -->
                            <div class="custom-container">
                                <div>
                                    <p><strong>Location Details</strong></p><br>
                                    <p>Select location type</p><br>
                                </div>
                                <div class="loaction-radio-group">

                                    <div class="location-radio-field">

                                        <input type="radio" name={index} data-id={index} value="online"
                                            checked={eachEventSchedule.isOnlineEvent}
                                            onclick={handleLocationTypeSelection} />
                                        <label>
                                            Online event
                                        </label>
                                    </div>
                                    <div class="location-radio-field">

                                        <input type="radio" name={index} data-id={index} value="onsite"
                                            checked={eachEventSchedule.isOnSite}
                                            onclick={handleLocationTypeSelection} />
                                        <label>
                                            On University Campus
                                        </label>
                                    </div>
                                    <div class="location-radio-field">

                                        <input type="radio" name={index} data-id={index} value="Hybrid"
                                            checked={eachEventSchedule.isHybrid}
                                            onclick={handleLocationTypeSelection} />
                                        <label>
                                            Hybrid
                                        </label>
                                    </div>

                                </div>

                                <!-- Address input field -->
                                <div class="slds-grid slds-glutters">

                                    <div class="slds-col slds-size_1-of-2" style="padding: 0.5rem 1rem;">
                                        <template if:false={eachEventSchedule.isOnlineEvent}>
                                            <lightning-input label=" " placeholder="Enter address to the session venue"
                                                name="locationAddress" data-field="locationAddress" data-id={index}
                                                value={eachEventSchedule.locationAddress}
                                                onchange={handleLocationTextFields}>
                                            </lightning-input>
                                        </template>
                                        <template if:true={eachEventSchedule.isOnlineEvent}>
                                            <lightning-input label=" " placeholder="Paste event link" name="sessionLink"
                                                data-field="sessionLink" data-id={index}
                                                value={eachEventSchedule.sessionLink}
                                                onchange={handleLocationTextFields}>
                                            </lightning-input>
                                        </template>
                                    </div>

                                    <!-- Auto-generated link -->
                                    <div class="slds-col slds-size_1-of-2" style="padding: 0.5rem 1rem;">
                                        <template if:true={eachEventSchedule.isHybrid}>
                                            <lightning-input label=" " placeholder="Paste event link" name="sessionLink"
                                                data-field="sessionLink" data-id={index}
                                                value={eachEventSchedule.sessionLink}
                                                onchange={handleLocationTextFields}>
                                            </lightning-input>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="slds-grid slds-grid_align-end">
                            <!-- Only show Remove Session button if there is more than one session -->
                            <!-- <template if:true={showRemoveSessionButton}>
                        <lightning-button variant="destructive" class="slds-p-around_xx-small" label=" Remove Session" data-id={index} icon-name="utility:delete" icon-position="right"
                            onclick={handleDeleteSession}></lightning-button>
                    </template> -->

                            <lightning-button variant="brand" class="slds-p-around_xx-small"
                                label="Save Session Details" data-id={index}
                                onclick={handleSaveSession}></lightning-button>
                        </div>
                    </div>
                </template>
            </div>
        </template>

        <div style="float: left slds-m-around_xx-small">
            <lightning-button variant="brand" class="slds-p-around_xx-small" name="addrow" label="Add Sessions +"
                onclick={addEmptySession}></lightning-button>
        </div>

        <!--Open Fee section modal-->
        <template if:true={openFeeSelection}>

            <div class="slds-backdrop slds-backdrop_open"></div>
            <div class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <div class="slds-modal__body">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                            title="Close" onclick={closeModal}>
                            <lightning-icon icon-name="utility:close" alternative-text="close"
                                size="small"></lightning-icon>
                            <span class="slds-assistive-text">Close</span>
                        </button>
                        <div class="slds-modal__header">
                            <h2 class="slds-text-heading_medium">How would you like to proceed?</h2>
                        </div>
                        <div class="radio-group">
                            <div class="radio-field">
                                <label>
                                    Session-wise pricing for the event
                                </label>
                                <input type="radio" name="pricingOption" value="session" checked={isSessionPricing}
                                    onclick={handleSessionFee} />
                            </div>
                            <div class="radio-field">
                                <label>
                                    Overall pricing for the entire event
                                </label>
                                <input type="radio" name="pricingOption" value="overall" checked={isEventPricing}
                                    onclick={handleEventFee} />
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </template>
        <br>
        <div class="custom-flex-container">
            <div class="custom-flex-left" style="float: left">
                <lightning-button class="slds-p-around_xx-small" name="previous" label="Previous"
                    onclick={handlePrevious}></lightning-button>
            </div>
            <div class="custom-flex">
                <div class="slds-p-around_xx-small">
                    <lightning-button name="cancel" label="Cancel" onclick={handleCancel}></lightning-button>
                </div>
                <div class="slds-p-around_xx-small">
                    <lightning-button class="slds-p-around_xx-small" variant="brand" name="save"
                        label="Save and proceed" onclick={handleSave}
                        disabled={isSaveButtonDisabled}></lightning-button>
                </div>
            </div>
        </div>
    </template>

</template>
