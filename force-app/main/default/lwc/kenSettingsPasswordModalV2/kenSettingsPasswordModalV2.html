<template lwc:render-mode="light">
    <div class="modal-backdrop" onclick={handleBackdrop}>
        <div class="modal" onclick={handleStop}>
            <button type="button" class="modal__close" onclick={handleClose}>×</button>
            <h2 class="modal__title">Change Password</h2>

            <template lwc:if={isStep1}>
                <p class="modal__hint">We'll send a verification code to your registered email.</p>
                <div class="field"><label>Email</label><input type="email" data-field="email" value={emailDisplay} disabled/></div>
                <div class="actions">
                    <button class="btn btn--outline" onclick={handleClose}>Cancel</button>
                    <button class="btn btn--primary" onclick={handleSendOtp} disabled={busy}>Send code</button>
                </div>
            </template>

            <template lwc:if={isStep2}>
                <p class="modal__hint">Enter the 6-digit code we sent to {emailDisplay}.</p>
                <div class="field"><label>Verification code</label><input type="text" maxlength="6" data-field="otp" value={otp} oninput={handleField}/></div>
                <div class="actions">
                    <button class="btn btn--outline" onclick={handleClose}>Cancel</button>
                    <button class="btn btn--primary" onclick={handleVerifyOtp} disabled={busy}>Verify code</button>
                </div>
            </template>

            <template lwc:if={isStep3}>
                <p class="modal__hint">Choose your new password.</p>
                <div class="field"><label>New password</label><input type="password" data-field="next" value={nextPwd} oninput={handleField}/></div>
                <div class="field"><label>Confirm new password</label><input type="password" data-field="confirm" value={confirmPwd} oninput={handleField}/></div>
                <div class="actions">
                    <button class="btn btn--outline" onclick={handleClose}>Cancel</button>
                    <button class="btn btn--primary" onclick={handleSubmitReset} disabled={busy}>Update Password</button>
                </div>
            </template>

            <template lwc:if={errorMessage}>
                <p class="modal__error">{errorMessage}</p>
            </template>
        </div>
    </div>
</template>
