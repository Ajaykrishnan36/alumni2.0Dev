<template>
    <template if:true={isOpen}>
        <div class="modal-backdrop" onclick={handleBackdropClick}>
            <div class="modal-box" onclick={stopPropagation}>

                <!-- Header -->
                <div class="modal-header">
                    <div class="modal-title-wrap">
                        <h2 class="modal-title">{title}</h2>
                        <span class="modal-count">{recordCount} cases</span>
                    </div>
                    <div class="modal-actions">
                        <button class="export-btn" onclick={handleExportCsv} title="Export as CSV" aria-label="Export as CSV">&#x2193; Export CSV</button>
                        <button class="modal-close" onclick={handleClose} title="Close" aria-label="Close modal">&#x2715;</button>
                    </div>
                </div>

                <!-- Search -->
                <div class="modal-search">
                    <input
                        type="text"
                        class="search-input"
                        placeholder="Search by case #, subject, status, service or submitter..."
                        value={searchTerm}
                        oninput={handleSearch}
                    />
                </div>

                <!-- Body -->
                <div class="modal-body">
                    <template if:true={isLoading}>
                        <div class="loading-state">
                            <div class="spinner"></div>
                            <p>Loading cases...</p>
                        </div>
                    </template>

                    <template if:false={isLoading}>
                        <template if:true={hasRows}>
                            <table class="cases-table">
                                <thead>
                                    <tr>
                                        <th class="col-casenum">Case #</th>
                                        <th class="col-subject">Subject</th>
                                        <th class="col-status">Status</th>
                                        <th class="col-service">Service</th>
                                        <th class="col-offering">Service Offering</th>
                                        <th class="col-origin">Origin</th>
                                        <th class="col-submitter">Submitted By</th>
                                        <th class="col-date">Date</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={paginatedList} for:item="r">
                                        <tr key={r.id} class="case-row" data-record-id={r.id} onclick={handleRowClick}>
                                            <td class="col-casenum case-num-cell">{r.caseNumber}</td>
                                            <td class="col-subject subject-cell">{r.subject}</td>
                                            <td class="col-status">
                                                <span class={r.statusClass}>{r.status}</span>
                                            </td>
                                            <td class="col-service">{r.serviceName}</td>
                                            <td class="col-offering">{r.serviceOffering}</td>
                                            <td class="col-origin">{r.origin}</td>
                                            <td class="col-submitter">{r.submitterName}</td>
                                            <td class="col-date">{r.createdDate}</td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>

                            <div class="pagination">
                                <button class="page-btn" onclick={prevPage} disabled={isPrevDisabled}>&#8249; Prev</button>
                                <span class="page-info">{pageInfo}</span>
                                <button class="page-btn" onclick={nextPage} disabled={isNextDisabled}>Next &#8250;</button>
                            </div>
                        </template>

                        <template if:false={hasRows}>
                            <div class="empty-state">No cases found matching your search.</div>
                        </template>
                    </template>
                </div>

            </div>
        </div>
    </template>
</template>
