<template>
    <div class="photo-card" onclick={handleCardClick}>
        <!-- Photo Image -->
        <div class="photo-image-container">
            <!-- An image renders itself. It had no error handler before, which is
                 why an unreachable file showed the browser's broken-image box
                 rather than falling back to the placeholder art. -->
            <template if:true={showImage}>
                <img
                    src={photoImageUrl}
                    alt={fileName}
                    class="photo-image"
                    onerror={handleImageError}
                />
            </template>
            <template if:true={showThumbnail}>
                <img
                    src={thumbnailUrl}
                    alt={fileName}
                    class="photo-image"
                    onerror={handleThumbnailError}
                />
                <div class="thumbnail-filename-badge">{fileName}</div>
            </template>
            <!-- A document has no renderable preview, so it gets the same static
                 art the album cards use, with its name underneath. -->
            <template if:true={showPlaceholder}>
                <div class="file-placeholder">
                    <img src={placeholderImageUrl} alt={fileName} class="photo-image" />
                    <div class="thumbnail-filename-badge">{fileName}</div>
                </div>
            </template>
            <div class="photo-overlay"></div>

            <template if:true={isOwner}>
                <button
                    class="menu-button"
                    type="button"
                    onclick={handleMenuClick}
                    title="More options"
                >
                    <lightning-icon
                        icon-name="utility:threedots"
                        size="x-small"
                        alternative-text="Menu"
                        class="menu-icon"
                    ></lightning-icon>
                </button>

                <template if:true={showMenu}>
                    <div class="menu-dropdown">
                        <div
                            class="menu-item"
                            data-action="edit"
                            onclick={handleMenuAction}
                        >
                            Edit
                        </div>
                        <div
                            class="menu-item"
                            data-action="delete"
                            onclick={handleMenuAction}
                        >
                            Delete
                        </div>
                    </div>
                </template>
            </template>
        </div>

        <!-- Profile Overlay -->
        <div class="profile-overlay" onclick={handleOverlayClick}>
            <div class="profile-image-container">
                <img
                    src={profileImageUrl}
                    alt={personName}
                    class="profile-image"
                    data-profile-image="true"
                />
            </div>
            <span class="profile-name">{personName}</span>
        </div>
    </div>
</template>
