<template>
    <div class="photo-card" onclick={handleCardClick}>
        <!-- Photo Image -->
        <div class="photo-image-container">
            <template if:true={isImage}>
                <img src={photoImageUrl} alt="Photo" class="photo-image" />
            </template>
            <template if:false={isImage}>
                <div class="file-placeholder">
                    <lightning-icon icon-name="doctype:attachment" size="large"></lightning-icon>
                    <p class="file-placeholder-name">{fileName}</p>
                </div>
            </template>
            <div class="photo-overlay"></div>

            <template if:true={isOwner}>
                <button
                    class="menu-button"
                    type="button"
                    onclick={handleMenuClick}
                    title="More options"
                >
                    <lightning-icon
                        icon-name="utility:threedots"
                        size="x-small"
                        alternative-text="Menu"
                        class="menu-icon"
                    ></lightning-icon>
                </button>

                <template if:true={showMenu}>
                    <div class="menu-dropdown">
                        <div
                            class="menu-item"
                            data-action="edit"
                            onclick={handleMenuAction}
                        >
                            Edit
                        </div>
                        <div
                            class="menu-item"
                            data-action="delete"
                            onclick={handleMenuAction}
                        >
                            Delete
                        </div>
                    </div>
                </template>
            </template>
        </div>

        <!-- Profile Overlay -->
        <div class="profile-overlay" onclick={handleOverlayClick}>
            <div class="profile-image-container">
                <img
                    src={profileImageUrl}
                    alt={personName}
                    class="profile-image"
                    data-profile-image="true"
                />
            </div>
            <span class="profile-name">{personName}</span>
        </div>
    </div>
</template>
