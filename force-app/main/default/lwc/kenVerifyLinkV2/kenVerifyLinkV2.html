<template>
    <section class="card">
        <div class="card__logo">
            <template lwc:if={institutionLogoUrl}>
                <img src={institutionLogoUrl} alt="Institution Logo" />
            </template>
            <template lwc:else>
                <span>Institution Logo</span>
            </template>
        </div>

        <p class="sent-to">
            An OTP has been sent to
            <span class="sent-to__email">{email}</span>
            <button type="button" class="edit" onclick={handleEditEmail} aria-label="Edit email">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3061FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 20h9"/>
                    <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
                </svg>
            </button>
        </p>

        <div class="otp">
            <div class="otp__boxes">
                <template for:each={digits} for:item="d" for:index="idx">
                    <input
                        key={d.key}
                        class="otp__input"
                        type="text"
                        inputmode="numeric"
                        maxlength="1"
                        data-index={idx}
                        value={d.value}
                        oninput={handleDigit}
                        onkeydown={handleKeydown}
                    />
                </template>
            </div>
            <p class="otp__expires">{expiresLabel}</p>
        </div>

        <p class="resend">
            Did not receive it yet?
            <a href="#resend" onclick={handleResend}>Resend OTP</a>
        </p>

        <button type="button" class={verifyClass} onclick={handleVerify} disabled={verifyDisabled}>
            Verify
        </button>

        <div class="powered-by">
            <span>Powered by</span>
            <template lwc:if={poweredByLogoUrl}>
                <img src={poweredByLogoUrl} alt="Powered by" />
            </template>
            <template lwc:else>
                <span class="powered-by__placeholder"></span>
            </template>
        </div>
    </section>
</template>
