<template>
	<div class="section-width">
		<template if:true={isRedirectingToReset}>
			<div class="login-fullscreen-spinner">
				<lightning-spinner alternative-text="Redirecting..." size="medium" variant="brand"></lightning-spinner>
			</div>
		</template>
		<template if:false={isRedirectingToReset}>
		<template if:true={isLoading}>
			<lightning-spinner alternative-text="Loading..." size="medium" variant="brand"></lightning-spinner>
		</template>
		<p class="login-title">Login</p>
		<p class="login-subtitle">Continue your journey with the alumni community</p>

		<div class="slds-grid slds-wrap">
			<div class="slds-col slds-size_1-of-1">
				<div class="field-label">Email</div>
				<lightning-input id="email" label="Email" type="email" placeholder="Email" data-id="email" value={email}
					variant="label-hidden" oninput={handleInputChange} onchange={handleInputChange}
					onblur={handleOnBlur} onkeyup={handleEnterKey} class="studentportalInputsLogin">
				</lightning-input>

			</div>

			<div class="slds-col slds-size_1-of-1">
				<div class="field-label">Password</div>
				<div class="password-input-container">
					<lightning-input class="studentportalInputsLogin password-input" id="password" label="Password"
						type={passwordFieldType} placeholder="Enter password" data-id="password" value={password}
						variant="label-hidden" oninput={handleInputChange} onchange={handleInputChange}
						onblur={handleOnBlur} onkeyup={handleEnterKey}>
					</lightning-input>
					<template if:true={showPasswordToggle}>
						<button class="password-toggle-button" type="button" onclick={togglePasswordVisibility}
							aria-pressed={isPasswordVisible} aria-label={passwordToggleLabel}>
							<lightning-icon icon-name={iconName} size="x-small"></lightning-icon>
						</button>
					</template>
				</div>
			</div>
			<div class="slds-col slds-size_1-of-1 remember-forgot-container">
				<label class="remember-me-label">
					<input type="checkbox" class="remember-checkbox" />
					<span class="remember-text">Remember Me</span>
				</label>
				<span class="forgot-password-text">
					Forgot Password? <button type="button" class="reset-link"
						onclick={handleForgotPassword}>Reset</button>
				</span>
			</div>
			<template if:true={errorMessage}>
				<div class="slds-text-color_error slds-m-bottom_medium error-message">{errorMessage}</div>
			</template>
		</div>
		<div style="margin-top: 25px;">
			<lightning-button variant="brand" disable-animation="true" label="Login" type="submit" onclick={handleLogin} stretch
				class="studentportal-BlueButtonLogin"></lightning-button>
		</div>
		<div class="divider-container">
			<hr class="divider-line" />
			<span class="divider-text">(or continue with)</span>
			<hr class="divider-line" />
		</div>
		<div class="sso-buttons-container">
			<div class="google-button" onclick={handleLinkedInLogin}>
				<img src={linkedinLogo} alt="LinkedIn" class="google-logo" />
				<span>LinkedIn</span>
			</div>
			<template if:true={showGoogleLogin}>
				<div class="google-button" onclick={handleGoogleLogin}>
					<svg class="google-logo" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
						<path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
						<path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
						<path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
						<path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
					</svg>
					<span>Google</span>
				</div>
			</template>
		</div>
		<div class="register-now-section">
			<span class="register-now-text">Don't have an account? <button type="button" class="register-now-link" onclick={handleSignup}>Register Now</button></span>
		</div>
		<div class="card-powered-by">
			<span class="card-powered-text">Powered by</span>
			<img src={kenPoweredbyLogo} alt="ken42" class="card-powered-logo" />
		</div>
	</template>
	</div>
	<!-- Toast notification -->
	<c-ken-toast-notification 
		is-visible={showToast}
		toast-title={toastTitle}
		toast-message={toastMessage}
		toast-variant={toastVariant}>
	</c-ken-toast-notification>

</template>
