<template>
    <div class="portal-home-container">
        <section class={newsletterClass}>
            <div class="newsletter__head">
                <span class="newsletter__tag">Newsletter</span>
                <span class="newsletter__title">Alumni Newsletter | October 2025</span>
            </div>
            <div class="newsletter__actions">
                <button type="button" class="newsletter__view" onclick={handleViewNewsletter}>View More</button>
                <button type="button" class="newsletter__cta" onclick={handleViewNewsletter}>Read Now</button>
            </div>
        </section>

        <div class="home-grid">

            <div class="feed-column">
                <c-ken-portal-home-feed></c-ken-portal-home-feed>
            </div>

            <div class="right-column">

                <div class="top-row">
                    <div class="events-section">
                        <div class="section-header">
                            <p class="section-title">Upcoming Events</p>
                            <button class="view-all-btn" aria-label="View all events" onclick={handleViewAllEvents}>
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M12 4L10.59 5.41L16.17 11H4V13H16.17L10.59 18.59L12 20L20 12L12 4Z" fill="#373A45"/>
                                </svg>
                            </button>
                        </div>
                        <div class="events-content">
                            <template for:each={upcomingEvents} for:item="event">
                                <div key={event.id} class="event-card">
                                    <img src={event.image} alt={event.title} class="event-image" />
                                    <div class="event-info">
                                        <p class="event-title">{event.title}</p>
                                        <p class="event-date">{event.date}</p>
                                    </div>
                                </div>
                            </template>
                            <template if:false={hasEvents}>
                                <div class="empty-mini">
                                    <img src={eventsEmptyImage} alt="" class="empty-mini-img" />
                                    <p class="empty-mini-text">No upcoming events yet</p>
                                </div>
                            </template>
                        </div>
                    </div>

                    <div class="birthdays-section">
                        <div class="section-header">
                            <p class="section-title">Upcoming Birthdays</p>
                        </div>
                        <div class="birthdays-content">
                            <template for:each={upcomingBirthdays} for:item="birthday">
                                <div key={birthday.id} class="birthday-row">
                                    <div class="birthday-profile">
                                        <div class="birthday-avatar-wrap">
                                            <img src={birthday.image} alt={birthday.name} class="birthday-avatar" />
                                            <template if:true={birthday.isOnline}>
                                                <span class="birthday-status-dot"></span>
                                            </template>
                                        </div>
                                        <div class="birthday-info">
                                            <p class="birthday-name">{birthday.name}</p>
                                            <p class="birthday-meta">
                                                <span class="birthday-batch">{birthday.batch}</span>
                                                <span class="birthday-separator">|</span>
                                                <span class="birthday-course">{birthday.course}</span>
                                            </p>
                                        </div>
                                    </div>
                                    <div class="birthday-date">
                                        <span class="birthday-month">{birthday.month}</span>
                                        <span class="birthday-day">{birthday.day}</span>
                                    </div>
                                </div>
                            </template>
                            <template if:false={hasBirthdays}>
                                <div class="empty-mini">
                                    <img src={emptyImage} alt="" class="empty-mini-img" />
                                    <p class="empty-mini-text">No upcoming birthdays</p>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>

                <div class="middle-row">
                    <div class="quick-links-section">
                        <div class="section-header">
                            <p class="section-title">Quick Links</p>
                        </div>
                        <div class="quick-links-content">
                            <template for:each={quickLinks} for:item="link">
                                <button key={link.id} class="quick-link-btn" onclick={handleQuickLinkClick} data-link={link.id}>
                                    <span class="quick-link-icon">{link.icon}</span>
                                    <span class="quick-link-label">{link.label}</span>
                                </button>
                            </template>
                        </div>
                    </div>

                    <div class="resources-section">
                        <div class="section-header">
                            <p class="section-title">Resources</p>
                            <button class="view-all-btn" aria-label="View all resources" onclick={handleViewAllResources}>
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M12 4L10.59 5.41L16.17 11H4V13H16.17L10.59 18.59L12 20L20 12L12 4Z" fill="#373A45"/>
                                </svg>
                            </button>
                        </div>
                        <div class="resources-content">
                            <template for:each={resources} for:item="resource">
                                <button key={resource.id} class="resource-btn" onclick={handleResourceClick} data-resource={resource.id}>
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="resource-icon">
                                        <path d="M10 4H4C2.9 4 2 4.9 2 6V18C2 19.1 2.9 20 4 20H20C21.1 20 22 19.1 22 18V8C22 6.9 21.1 6 20 6H12L10 4Z" fill="#F6C244"/>
                                        <path d="M2 9H22V18C22 19.1 21.1 20 20 20H4C2.9 20 2 19.1 2 18V9Z" fill="#FFD97A"/>
                                    </svg>
                                    <span class="resource-label">{resource.label}</span>
                                </button>
                            </template>
                            <template if:false={hasResources}>
                                <div class="empty-mini">
                                    <img src={emptyImage} alt="" class="empty-mini-img" />
                                    <p class="empty-mini-text">No albums in the gallery yet</p>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>

                <div class="bottom-row">
                    <div class="invite-friends-section">
                        <p class="section-title">Invite Friends</p>
                        <p class="invite-text">Know alumni not here yet? Share your invite link to invite them onboard.</p>
                        <div class="invite-link-container">
                            <input type="text" class="invite-link-input" value={inviteLink} readonly />
                            <button class="copy-btn" onclick={handleCopyLink} aria-label="Copy link">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                    <path d="M15 20H5V7C5 6.45 4.55 6 4 6C3.45 6 3 6.45 3 7V20C3 21.1 3.9 22 5 22H15C15.55 22 16 21.55 16 21C16 20.45 15.55 20 15 20ZM20 16V4C20 2.9 19.1 2 18 2H9C7.9 2 7 2.9 7 4V16C7 17.1 7.9 18 9 18H18C19.1 18 20 17.1 20 16ZM18 16H9V4H18V16Z" fill="currentColor"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="businesses-section">
                        <div class="section-header">
                            <p class="section-title">Businesses by Alumni</p>
                            <button class="view-all-btn" aria-label="View all businesses" onclick={handleViewAllBusinesses}>
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M12 4L10.59 5.41L16.17 11H4V13H16.17L10.59 18.59L12 20L20 12L12 4Z" fill="#373A45"/>
                                </svg>
                            </button>
                        </div>
                        <div class="businesses-content">
                            <template for:each={businesses} for:item="business">
                                <button key={business.id} class="business-card" onclick={handleBusinessClick}>
                                    <img src={business.logo} alt={business.name} class="business-logo" />
                                    <span class="business-name">{business.name}</span>
                                </button>
                            </template>
                            <template if:false={hasBusinesses}>
                                <div class="empty-mini">
                                    <img src={emptyImage} alt="" class="empty-mini-img" />
                                    <p class="empty-mini-text">No alumni businesses posted yet</p>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</template>
